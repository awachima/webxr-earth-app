<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebXR Earth Controls — CJK font via CDN</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
AFRAME.registerComponent('rounded-panel', {
  schema: {
    width:  {type: 'number', default: 0.6},
    height: {type: 'number', default: 0.7},
    radius: {type: 'number', default: 0.05},
    color:  {type: 'color',  default: '#333'},
    opacity:{type: 'number', default: 0.7},
    stroke: {type: 'number', default: 0.001},
    strokeColor:   {type: 'color',  default: '#FFFFFF'},
    strokeOpacity: {type: 'number', default: 1.0},
    doubleSided:   {type: 'boolean', default: false}
  },
  init: function () { this._build(); },
  update: function () { this._build(); },
  remove: function () { this._disposeMesh('rp-fill'); this._disposeMesh('rp-stroke'); },
  _disposeMesh: function (key) {
    const obj = this.el.getObject3D(key);
    if (obj) {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) obj.material.dispose();
      this.el.removeObject3D(key);
    }
  },
  _roundedRectShape: function (w, h, r) {
    const shape = new THREE.Shape();
    const hw = w / 2, hh = h / 2;
    const rr = Math.max(0, Math.min(r, Math.min(hw, hh)));
    shape.moveTo(-hw + rr, -hh);
    shape.lineTo(hw - rr, -hh);
    shape.absarc(hw - rr, -hh + rr, rr, -Math.PI / 2, 0, false);
    shape.lineTo(hw, hh - rr);
    shape.absarc(hw - rr, hh - rr, rr, 0, Math.PI / 2, false);
    shape.lineTo(-hw + rr, hh);
    shape.absarc(-hw + rr, hh - rr, rr, Math.PI / 2, Math.PI, false);
    shape.lineTo(-hw, -hh + rr);
    shape.absarc(-hw + rr, -hh + rr, rr, Math.PI, 1.5 * Math.PI, false);
    return shape;
  },
  _build: function () {
    const d = this.data;
    const side = d.doubleSided ? THREE.DoubleSide : THREE.FrontSide;
    this._disposeMesh('rp-fill');
    this._disposeMesh('rp-stroke');

    const fillShape = this._roundedRectShape(d.width, d.height, d.radius);
    const fillGeom = new THREE.ShapeGeometry(fillShape, 24);
    const fillMat  = new THREE.MeshBasicMaterial({
      color: new THREE.Color(d.color),
      transparent: true,
      opacity: d.opacity,
      side
    });
    const fillMesh = new THREE.Mesh(fillGeom, fillMat);
    this.el.setObject3D('rp-fill', fillMesh);

    if (d.stroke > 0) {
      const innerW = Math.max(0, d.width  - 2 * d.stroke);
      const innerH = Math.max(0, d.height - 2 * d.stroke);
      const innerR = Math.max(0, d.radius - d.stroke);
      const outer = this._roundedRectShape(d.width,  d.height,  d.radius);
      const inner = this._roundedRectShape(innerW,   innerH,    innerR);
      outer.holes.push(inner);
      const strokeGeom = new THREE.ShapeGeometry(outer, 24);
      const strokeMat  = new THREE.MeshBasicMaterial({
        color: new THREE.Color(d.strokeColor),
        transparent: true,
        opacity: d.strokeOpacity,
        side
      });
      const strokeMesh = new THREE.Mesh(strokeGeom, strokeMat);
      this.el.setObject3D('rp-stroke', strokeMesh);
    }
  }
});
</script>
  <script src="https://cdn.jsdelivr.net/npm/troika-three-text@0.47.2/dist/troika-three-text.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-troika-text@0.9.0/dist/aframe-troika-text.min.js"></script>

  <style>
    /* （参考）CSS側にも同名familyを定義しておくが、Troikaは下の JS 定数URLを参照する */
    @font-face{
      font-family:"NotoSansCJKLocal";
      src:url("https://cdn.jsdelivr.net/gh/googlefonts/noto-cjk@v20241215/Sans/WOFF2/SimplifiedChinese/NotoSansSC-Regular.woff2") format("woff2");
      font-weight:400; font-style:normal; font-display:swap;
    }
    html,body{ height:100%; margin:0; overflow:hidden; background:#eceff1; }
  </style>
</head>
<body>

<script>
/* ▼ Troika に渡す CJK フォントURL（CORS可・CDN配信） */
const FONT_URL = 'https://cdn.jsdelivr.net/gh/googlefonts/noto-cjk@v20241215/Sans/WOFF2/SimplifiedChinese/NotoSansSC-Regular.woff2';

/* レイキャスター対象切り替え */
function refreshAllRaycasters(){
  ['#mouseCursor', '#right-ray'].forEach(function(sel){
    var el=document.querySelector(sel);
    var rc = el && el.components && el.components.raycaster;
    if(rc && rc.refreshObjects) rc.refreshObjects();
  });
}
function setRaycasterTargets(uiOnly){
  var objs = uiOnly ? '.ui' : '.collidable, .ui';
  ['#mouseCursor', '#right-ray'].forEach(function(sel){
    var el=document.querySelector(sel);
    if(el) el.setAttribute('raycaster','objects',objs);
  });
}

/* パネル固定 */
AFRAME.registerComponent('panel-world-lock',{
  schema:{ baseDist:{type:'number',default:1.5}, baseScale:{type:'number',default:1.40}, margin:{type:'number',default:0.03}, minDist:{type:'number',default:1.02}, worldYaw:{type:'number',default:0}, yOffset:{type:'number',default:0.00} },
  init:function(){
    this.cam = document.querySelector('#camera');
    this.earth = document.querySelector('#earth');
    this._camPos   = new THREE.Vector3();
    this._earthPos = new THREE.Vector3();
    this._fwd      = new THREE.Vector3();
    this._up       = new THREE.Vector3(0,1,0);
    this._placed = false;
  },
  tick:function(){ if(!this._placed) this.placeOnce(); },
  placeOnce:function(){
    if(this._placed || !this.cam) return; this._placed = true;
    this.cam.object3D.getWorldPosition(this._camPos);
    this._fwd.set(0,0,-1).applyQuaternion(this.cam.object3D.quaternion).normalize();
    let dist = this.data.baseDist;
    if(this.earth){
      this.earth.object3D.getWorldPosition(this._earthPos);
      const s = this.earth.object3D.scale.x || 1;
      const R = (this.earth.getAttribute('geometry')?.radius || 1) * s;
      const along = this._earthPos.clone().sub(this._camPos).dot(this._fwd);
      const nearAlong = along - R;
      const willIntersect = (along > 0) && (nearAlong <= dist + this.data.margin);
      if (willIntersect){
        dist = Math.max(this.data.minDist, nearAlong - this.data.margin);
      }
    }
    dist = Math.max(this.data.minDist, dist);
    const side = new THREE.Vector3().crossVectors(this._fwd, this._up).normalize();
    const up   = new THREE.Vector3().crossVectors(side, this._fwd).normalize();
    const worldPos = this._camPos.clone().add(this._fwd.clone().multiplyScalar(dist)).add(up.multiplyScalar(this.data.yOffset));
    this.el.object3D.position.copy(worldPos);
    const scl = this.data.baseScale * (dist / this.data.baseDist);
    this.el.object3D.scale.set(scl, scl, scl);
    const yawRad = THREE.MathUtils.degToRad(this.data.worldYaw);
    this.el.object3D.rotation.set(0, yawRad, 0);
  }
});

/* コントローラ子レイ強制 */
AFRAME.registerComponent('ray-enforce-child', {
  init: function(){
    var scene = this.el.sceneEl || this.el;
    function setAttr(el, comp, prop, val){ if(!el) return; try{ el.setAttribute(comp, prop, val);}catch(e){} }
    function enableChild(){
      var right = document.getElementById('right-hand');
      var child = document.getElementById('right-ray');
      var mouse = document.getElementById('mouseCursor');
      if(right && right.components && right.components.raycaster){
        right.removeAttribute('raycaster');
      }
      Array.from(document.querySelectorAll('[raycaster]')).forEach(function(e){
        if(e.id !== 'right-ray' && e.id !== 'mouseCursor'){
          setAttr(e,'raycaster','enabled',false);
        }
      });
      if(child){
        setAttr(child,'raycaster','useWorldCoordinates',false);
        setAttr(child,'raycaster','showLine',true);
        setAttr(child,'raycaster','enabled',true);
      }
      if(mouse){ setAttr(mouse,'raycaster','enabled',false); }
    }
    function disableChild(){
      var child = document.getElementById('right-ray');
      var mouse = document.getElementById('mouseCursor');
      if(child){ setAttr(child,'raycaster','enabled',false); }
      if(mouse){ setAttr(mouse,'raycaster','enabled',true); }
    }
    disableChild();
    scene.addEventListener('enter-vr', enableChild);
    scene.addEventListener('exit-vr', disableChild);
  }
});
</script>

<script>
/* ===== Earth Controls（タッチ対応） ===== */
AFRAME.registerComponent('earth-controls',{
  schema:{
    rotationSpeed:{type:'number',default:2.0},
    joystickRotationSpeed:{type:'number',default:1.0},
    scaleSpeed:{type:'number',default:0.01},
    mouseRotationSpeed:{type:'number',default:0.2},
    wheelScaleSpeed:{type:'number',default:0.0005},
    pinchScaleSpeed:{type:'number', default:0.001}
  },
  init:function(){
    this.minScale=1.0; this.maxScale=3.0;
    this.currentXRotation=0; this.keys={};
    this.stickInput={ left:{x:0,y:0}, right:{x:0,y:0} };

    this.isDragging=false;
    this.previousPointerPosition={x:0,y:0};
    this.previousPinchDistance = 0;

    this.cameraEl=document.querySelector('#camera');
    this.uiState = { rotUp:false, rotDown:false, rotLeft:false, rotRight:false, zoomIn:false, zoomOut:false };
    var self=this;
    window.addEventListener('keydown',e=>self.keys[e.key]=true);
    window.addEventListener('keyup',e=>self.keys[e.key]=false);
    this.el.sceneEl.addEventListener('loaded', function(){
      var cvs=self.el.sceneEl.canvas;
      setTimeout(()=>{
        cvs.addEventListener('mousedown',e=>self.onMouseDown(e));
        window.addEventListener('mousemove',e=>self.onMouseMove(e));
        cvs.addEventListener('touchstart', e => self.onTouchStart(e), {passive: false});
        cvs.addEventListener('touchmove', e => self.onTouchMove(e), {passive: false});
        cvs.addEventListener('touchend', e => self.onTouchEnd(e));
      }, 150);
      window.addEventListener('mouseup',()=>self.onMouseUp());
      if (!AFRAME.utils.device.checkHeadsetConnected()){
        cvs.addEventListener('wheel',e=>self.onWheelCanvas(e),{passive:true});
      }
      self.setupUIListeners();
    });
    this._bindThumbsticks = function(){
      var L=document.querySelector('#left-hand');
      var R=document.querySelector('#right-hand');
      if(L && !L._thumbBound){
        L.addEventListener('thumbstickmoved', e=>{ self.stickInput.left={x:e.detail.x,y:e.detail.y}; });
        L._thumbBound=true;
      }
      if(R && !R._thumbBound){
        R.addEventListener('thumbstickmoved', e=>{ self.stickInput.right={x:e.detail.x,y:e.detail.y}; });
        R._thumbBound=true;
      }
    };
    var leftHand = document.querySelector('#left-hand');
    var rightHand = document.querySelector('#right-hand');
    if(leftHand)  leftHand.addEventListener('controllerconnected', this._bindThumbsticks.bind(this));
    if(rightHand) rightHand.addEventListener('controllerconnected', this._bindThumbsticks.bind(this));
  },
  setupUIListeners:function(){
    var self=this;
    [
      { id:'#btn-rot-up',    state:'rotUp' },
      { id:'#btn-rot-down',  state:'rotDown' },
      { id:'#btn-rot-left',  state:'rotLeft' },
      { id:'#btn-rot-right', state:'rotRight' },
      { id:'#btn-zoom-in',   state:'zoomIn' },
      { id:'#btn-zoom-out',  state:'zoomOut' }
    ].forEach(item=>{
      var btn=document.querySelector(item.id);
      if(btn){
        btn.addEventListener('mousedown', ()=> { self.uiState[item.state]=true; });
        btn.addEventListener('mouseup',   ()=> { self.uiState[item.state]=false; });
        btn.addEventListener('mouseleave',()=> { self.uiState[item.state]=false; });
      }
    });
  },
  onMouseDown:function(evt){
    if (evt.target.classList.contains('ui') || window.__panelOpen) return;
    this.isDragging=true; this.previousPointerPosition={x:evt.clientX,y:evt.clientY};
    if(this.cameraEl) this.cameraEl.setAttribute('look-controls','enabled',false);
  },
  onMouseMove:function(evt){
    if(!this.isDragging || window.__panelOpen) return;
    var dx=evt.clientX-this.previousPointerPosition.x;
    var dy=evt.clientY-this.previousPointerPosition.y;
    this.el.object3D.rotation.y += dx*(Math.PI/180)*this.data.mouseRotationSpeed;
    this.currentXRotation += dy*this.data.mouseRotationSpeed;
    this.previousPointerPosition={x:evt.clientX,y:evt.clientY};
  },
  onMouseUp:function(){ this.isDragging=false; },
  onWheelCanvas:function(evt){
    if(window.__panelOpen) return;
    var s=this.el.object3D.scale.x; s += evt.deltaY*-1*this.data.wheelScaleSpeed; s=Math.max(this.minScale,Math.min(this.maxScale,s));
    this.el.object3D.scale.set(s,s,s);
  },
  getPinchDistance: function(evt) {
    var dx = evt.touches[0].clientX - evt.touches[1].clientX;
    var dy = evt.touches[0].clientY - evt.touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  },
  onTouchStart: function(evt) {
    if (window.__panelOpen) return;
    evt.preventDefault();
    if (evt.touches.length === 1) {
      this.isDragging = true;
      this.previousPointerPosition = { x: evt.touches[0].clientX, y: evt.touches[0].clientY };
    } else if (evt.touches.length === 2) {
      this.isDragging = false;
      this.previousPinchDistance = this.getPinchDistance(evt);
    }
  },
  onTouchMove: function(evt) {
    if (window.__panelOpen) return;
    evt.preventDefault();
    if (this.isDragging && evt.touches.length === 1) {
      var dx = evt.touches[0].clientX - this.previousPointerPosition.x;
      var dy = evt.touches[0].clientY - this.previousPointerPosition.y;
      this.el.object3D.rotation.y += dx * (Math.PI / 180) * this.data.mouseRotationSpeed;
      this.currentXRotation += dy * this.data.mouseRotationSpeed;
      this.previousPointerPosition = { x: evt.touches[0].clientX, y: evt.touches[0].clientY };
    } else if (evt.touches.length === 2) {
      var currentDist = this.getPinchDistance(evt);
      var delta = currentDist - this.previousPinchDistance;
      var s = this.el.object3D.scale.x;
      s += delta * this.data.pinchScaleSpeed;
      s = Math.max(this.minScale, Math.min(this.maxScale, s));
      this.el.object3D.scale.set(s, s, s);
      this.previousPinchDistance = currentDist;
    }
  },
  onTouchEnd: function(evt) {
    if (evt.touches.length < 2) this.previousPinchDistance = 0;
    if (evt.touches.length < 1) this.isDragging = false;
  },
  getNonVrSticks:function(){
    var pads = (navigator.getGamepads && navigator.getGamepads()) ? navigator.getGamepads() : [];
    var p = null;
    for (var i=0;i<pads.length;i++){
      if(pads[i] && pads[i].connected){ p=pads[i]; break; }
    }
    if(!p) return null; var ax=p.axes||[]; return { left:{x:ax[0]||0,y:ax[1]||0}, right:{x:ax[2]||0,y:ax[3]||0} };
  },
  tick:function(){
    if (window.__panelOpen) return;
    var stickRotY_raw = this.stickInput.right.x;
    var stickRotX_raw = this.stickInput.right.y;
    var stickScale_raw = this.stickInput.left.y;

    if (stickRotX_raw === 0 && stickRotY_raw === 0 && stickScale_raw === 0){
      var gp = this.getNonVrSticks();
      if(gp){
        stickRotY_raw = gp.right.x;
        stickRotX_raw = gp.right.y;
        stickScale_raw = gp.left.y;
      }
    }
    var rotY_k = (this.keys['ArrowLeft']?-1:0) + (this.keys['ArrowRight']?1:0);
    var rotX_k = (this.keys['ArrowUp']?-1:0) + (this.keys['ArrowDown']?1:0);
    var scale_k = (this.keys['w']||this.keys['W']?1:0) + (this.keys['s']||this.keys['S']?-1:0);
    var rotY_ui = (this.uiState.rotRight?1:0) + (this.uiState.rotLeft?-1:0);
    var rotX_ui = (this.uiState.rotDown?1:0) + (this.uiState.rotUp?-1:0);
    var scale_ui = (this.uiState.zoomIn?1:0) + (this.uiState.zoomOut?-1:0);

    var s=this.el.object3D.scale.x; var t=(s-1.0)/(3.0-1.0); var mul=1-(t*(7/8));
    var finalRotY=(stickRotY_raw!==0? stickRotY_raw*this.data.joystickRotationSpeed : (rotY_ui!==0? rotY_ui*this.data.rotationSpeed : rotY_k*this.data.rotationSpeed))*mul;
    var finalRotX=(stickRotX_raw!==0? stickRotX_raw*this.data.joystickRotationSpeed : (rotX_ui!==0? rotX_ui*this.data.rotationSpeed : rotX_k*this.data.rotationSpeed))*mul;
    var finalScale=(stickScale_raw!==0? -stickScale_raw : (scale_ui!==0? scale_ui : scale_k))*this.data.scaleSpeed;
    this.el.object3D.rotation.y += finalRotY*(Math.PI/180);
    this.currentXRotation = Math.max(-80, Math.min(80, this.currentXRotation + finalRotX));
    this.el.object3D.rotation.x = this.currentXRotation*(Math.PI/180);
    var ns=s+finalScale; ns=Math.max(this.minScale,Math.min(this.maxScale,ns));
    this.el.object3D.scale.set(ns,ns,ns);
  }
});

/* ============ hex-marker ============ */
AFRAME.registerComponent('hex-marker',{
  schema:{ count:{type:'number',default:1}, color:{type:'color',default:'#FF7F8A'}, baseRadius:{type:'number',default:0.013}, heightUnit:{type:'number',default:0.0001}, fontUrl:{type:'string',default:FONT_URL} },
  init:function(){
    var d=this.data;
    this.height=0.01+(d.count*d.heightUnit);
    var geom=new THREE.CylinderGeometry(d.baseRadius*0.7,d.baseRadius,this.height,6);
    var mat =new THREE.MeshStandardMaterial({color:d.color,flatShading:true});
    this.el.setObject3D('mesh', new THREE.Mesh(geom,mat));
    try{
      var baseFontSize=d.baseRadius*0.7;
      var text=document.createElement('a-entity');
      text.setAttribute('troika-text',{ value:String(d.count), font:d.fontUrl, fontSize:baseFontSize, color:'#111', outlineColor:'#fff', outlineWidth:0.0006, outlineBlur:0.00001, anchor:'center' });
      text.setAttribute('rotation','-90 0 0');
      text.setAttribute('position',{x:0,y:this.height/2+0.00012,z:0});
      this.el.appendChild(text); this.el.textEl=text;
    }catch(err){ console.warn('Troika text disabled:', err); }
  }
});

/* ============ marker-placer ============ */
AFRAME.registerComponent('marker-placer',{
  schema:{ maxMarkerMultiplier:{type:'number',default:20}, minWorldMultiplier:{type:'number',default:3.5} },
  init:async function(){
    this.allLocations=[]; this.currentMarkers=[];
    this.cameraEl=document.querySelector('#camera');
    this.cameraPos=new THREE.Vector3(); this.markerPos=new THREE.Vector3(); this.earthPos=new THREE.Vector3();
    this.previousEarthScale=this.el.object3D.scale.x;

    this.el.sceneEl.addEventListener('panel-closed', () => {
      this.currentMarkers.forEach(marker => {
        var mesh=marker.getObject3D('mesh'); if(mesh) mesh.material.color.set('#FF7F8A');
      });
    });

    var sheetUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vQKDucOdVD9mvoZHq-HIOxi_J1L8s9Qjh7hP3oU_oTQrh1k_4tvB8m9ZRtp9Lond1XqVDdu5R8bNAsW/pub?gid=717261533&single=true&output=csv";
    try{
      var res=await fetch(sheetUrl,{cache:'no-store'});
      if(res.ok){
        var text=await res.text();
        this.allLocations=this.parseCsv(text);
      }else{
        console.error('CSV fetch failed:', res.status);
      }
    }catch(e){ console.error("データ取得エラー:",e); }
    this.updateClusters();
  },

  parseCsv:function(csvText){
    const locations = [];

    const parseCsvLine = (line) => {
      const parts = [];
      let currentPart = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"' && (i === 0 || line[i-1] !== '"')) {
          inQuotes = !inQuotes;
          continue;
        }
        if (char === ',' && !inQuotes) {
          parts.push(currentPart);
          currentPart = '';
        } else {
          currentPart += char;
        }
      }
      parts.push(currentPart);
      if (parts[0] && parts[0].startsWith('"')) parts[0] = parts[0].slice(1);
      if (parts[0] && parts[0].endsWith('"')) parts[0] = parts[0].slice(0, -1);
      return parts;
    };

    const lines = String(csvText||'').trim().split(/\r?\n/);
    if (lines.length === 0) return locations;

    const cleanAndParseFloat = (str) => {
      if (typeof str !== 'string') return NaN;
      const cleanedStr = str.trim().replace(/[−–‐]/g, '-');
      return parseFloat(cleanedStr);
    };

    const firstLineParts = parseCsvLine(lines[0] || '');
    const latTry = cleanAndParseFloat(firstLineParts[1] || '');
    const lonTry = cleanAndParseFloat(firstLineParts[2] || '');
    const isHeader = isNaN(latTry) || isNaN(lonTry);
    const startIndex = isHeader ? 1 : 0;

    for (let i = startIndex; i < lines.length; i++) {
      if (!lines[i]) continue;
      const parts = parseCsvLine(lines[i]);
      if (parts.length >= 4) {
        const title = parts[0];
        const lat = cleanAndParseFloat(parts[1]);
        const lon = cleanAndParseFloat(parts[2]);
        const url = parts[3];

        if (isNaN(lat) || isNaN(lon)) {
          locations.push({ title: title || '名称不明（座標なし）', lat: -90, lon: 0, url: url });
        } else {
          locations.push({ title: title, lat: lat, lon: lon, url: url });
        }
      }
    }
    return locations;
  },

  computeThreshold:function(){ var s=this.el.object3D.scale.x; var t=(s-1)/(3-1); return 0.2 - t*(0.2-0.008); },
  updateClusters:function(){
    this.currentMarkers.forEach(m=>{ if(m && m.parentNode) m.parentNode.removeChild(m); }); this.currentMarkers=[];
    var th=this.computeThreshold(); var unclustered=this.allLocations.slice(); var clusters=[];
    while(unclustered.length>0){
      var p=unclustered.shift(); var cluster=[p]; var rest=[];
      for(var i2=0;i2<unclustered.length;i2++){
        var q=unclustered[i2]; var dist=this.haversineDistance(p,q);
        if(dist<th) cluster.push(q); else rest.push(q);
      }
      unclustered=rest; clusters.push(cluster);
    }
    this.placeMarkersFromClusters(clusters);
  },
  placeMarkersFromClusters:function(clusters){
    var R=this.el.getAttribute('geometry').radius; var self=this;
    clusters.forEach(function(cluster){
      var lat=0,lon=0; cluster.forEach(p=>{lat+=p.lat;lon+=p.lon;}); lat/=cluster.length; lon/=cluster.length;
      var pos=self.latLonTo3D(lat,lon,R);
      var marker=document.createElement('a-entity'); marker.setAttribute('position',pos);
      var yAxis=pos.clone().normalize(), worldUp=new THREE.Vector3(0,1,0);
      var xAxis=new THREE.Vector3().crossVectors(worldUp,yAxis).normalize(); if(xAxis.length()===0) xAxis.set(1,0,0);
      var zAxis=new THREE.Vector3().crossVectors(xAxis,yAxis);
      var rotM=new THREE.Matrix4().makeBasis(xAxis,yAxis,zAxis);
      marker.object3D.quaternion.setFromRotationMatrix(rotM);
      marker.setAttribute('hex-marker',{count:cluster.length});
      marker.classList.add('collidable');
      marker.dataset.locations=JSON.stringify(cluster);
      marker.addEventListener('mouseenter',()=>{ if(window.__panelOpen) return; var mesh=marker.getObject3D('mesh'); if(mesh) mesh.material.color.set('yellow'); });
      marker.addEventListener('mouseleave',()=>{ if(window.__panelOpen) return; var mesh=marker.getObject3D('mesh'); if(mesh) mesh.material.color.set('#FF7F8A'); });
      marker.addEventListener('click', e=>{ if(window.__panelOpen) return; openPanel(JSON.parse(e.currentTarget.dataset.locations)); });
      self.el.appendChild(marker); self.currentMarkers.push(marker);
    });
    refreshAllRaycasters();
  },
  haversineDistance:function(a,b){
    function toRad(x){ return x*Math.PI/180; }
    var dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
    var lat1=toRad(a.lat), lat2=toRad(b.lat);
    var h=Math.sin(dLat/2)**2 + Math.sin(dLon/2)**2 * Math.cos(lat1)*Math.cos(lat2);
    return 2*Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
  },
  tick:function(){
    if(this.currentMarkers.length===0 || !this.cameraEl) return;
    var s=this.el.object3D.scale.x; if(Math.abs(s-this.previousEarthScale)>0.1){ this.updateClusters(); this.previousEarthScale=s; }
    this.el.object3D.getWorldPosition(this.earthPos); this.cameraEl.object3D.getWorldPosition(this.cameraPos);
    for(var i=0;i<this.currentMarkers.length;i++){
      var marker=this.currentMarkers[i];
      var t = (s-1)/(3-1);
      var targetWorld = this.data.maxMarkerMultiplier - t*(this.data.maxMarkerMultiplier - this.data.minWorldMultiplier);
      var markerScale = targetWorld / s;
      marker.object3D.scale.set(markerScale, markerScale, markerScale);
      marker.object3D.getWorldPosition(this.markerPos);
      var normal = this.markerPos.clone().sub(this.earthPos).normalize();
      var toEye = this.cameraPos.clone().sub(this.earthPos).normalize();
      var visible = (normal.dot(toEye) > 0.001);
      marker.object3D.visible = visible;
      if (marker.textEl) marker.textEl.object3D.visible = visible;
    }
  },
  latLonTo3D:function(lat,lon,R){ var phi=(90-lat)*(Math.PI/180), theta=(lon+180)*(Math.PI/180);
    return new THREE.Vector3( -(R*Math.sin(phi)*Math.cos(theta)), R*Math.cos(phi), R*Math.sin(phi)*Math.sin(theta)); }
});
</script>

<script>
/* ===== パネル（CJKフォント固定・UI省略版） ===== */
(function(){
  'use strict';
  const PANEL = { BOARD_W:1.10, CONTENT_LEFT:-0.45, TEXT_MAX_W:0.84, PAD_X:0.02, PAD_Y:0.020, GAP:0.020,
                  CONTENT_TOP:0.48, CONTENT_BOTTOM:-0.45, SCROLL_MARGIN_R:0.035, SCROLL_TRACK_W:0.048, SCROLL_TRACK_H:0.78 };
  const HOVER_BG = '#23324A', ZEBRA_A='#262b31', ZEBRA_B='#21262c';
  const FONT_SIZE=0.035, LINE_HEIGHT=1.35, EST_SCALE=1.08;
  const PANEL_FONT_URL = FONT_URL;

  function safeNavigate(url){
    if(!url) return;
    const topWin = window.top || window.parent || window;
    try { topWin.location.assign(url); } catch(_) { topWin.location.href = url; }
  }

  function setRowBgColor(row,color){ const bg=row.querySelector('.list-bg'); if(bg){ const mat=bg.getAttribute('material')||{}, opa=(typeof mat.opacity==='number')?mat.opacity:0.95; bg.setAttribute('material',`shader:flat;color:${color};opacity:${opa};transparent:true;side:double`);} }
  function sanitizeTitle(s){ return String(s||'').replace(/\r\n?/g,'\n').replace(/^\s+|\s+$/g,'').replace(/\n{2,}/g,'\n'); }

  function openPanel(locations){
    closePanel();
    const scene=document.querySelector('a-scene');
    const panel=document.createElement('a-entity'); panel.id='vrPanel'; panel.classList.add('ui','collidable');
    panel.setAttribute('position','0 0 -0.5'); panel.setAttribute('rotation','0 0 0'); panel.setAttribute('scale','0.5 0.5 0.5');
    if(AFRAME.components['panel-world-lock']) panel.setAttribute('panel-world-lock', 'baseDist: 1.5; baseScale: 1.40;');
    scene.appendChild(panel);

    const listGroup=document.createElement('a-entity'); listGroup.classList.add('list-group'); listGroup.setAttribute('position',`0 ${PANEL.CONTENT_TOP} 0.02`); panel.appendChild(listGroup);

    const maxWidth=PANEL.TEXT_MAX_W-0.002; const rows=[];
    (locations||[]).forEach((loc,i)=>{
      const row=document.createElement('a-entity'); row.classList.add('ui','list-entry','collapsible','collidable');
      const title=sanitizeTitle(loc.title); row.dataset.title=title; row.dataset.url=String(loc.url??''); row.dataset.baseColor=(i%2===0)?ZEBRA_A:ZEBRA_B;
      const txt=document.createElement('a-entity'); txt.classList.add('ui','list-text');
      txt.setAttribute('troika-text',{ value:row.dataset.title, fontSize:FONT_SIZE, lineHeight:LINE_HEIGHT, maxWidth, anchor:'left', baseline:'top', color:'#fff', outlineWidth:0.004, outlineColor:'#000', overflowWrap:'break-word', whiteSpace:'pre-wrap', clipRect:`0 -9999 ${maxWidth} 9999`, font:PANEL_FONT_URL });
      txt.setAttribute('position',`-0.45 -0.02 0.03`);
      row.appendChild(txt);

      row.addEventListener('mousedown',()=>{ const u=row.dataset.url; if(u) safeNavigate(u); });
      row.addEventListener('mouseenter',()=>setRowBgColor(row,'#23324A'));
      row.addEventListener('mouseleave',()=>setRowBgColor(row,row.dataset.baseColor));

      listGroup.appendChild(row); rows.push(row);
    });

    window.__panelOpen=true;
  }

  function closePanel(){
    const p=document.getElementById('vrPanel');
    if(p && p.parentNode) p.parentNode.removeChild(p);
    window.__panelOpen=false;
  }

  window.openPanel=openPanel; window.closePanel=closePanel;
})();
</script>

<script>
/* 位置・回転・スケールをセッション保存/復元 */
(function(){
  'use strict';
  const KEY = 'earthState.v1';
  function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }
  function readEarthState(){ try { return JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch(_) { return null; } }
  function writeEarthState(state){ try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch(_) {} }
  function saveNow(){
    const earth = document.getElementById('earth');
    if (!earth || !earth.object3D) return;
    const o = earth.object3D;
    const ec = earth.components['earth-controls'];
    const rxDeg = ec ? ec.currentXRotation : THREE.MathUtils.radToDeg(o.rotation.x);
    const ryDeg = THREE.MathUtils.radToDeg(o.rotation.y);
    const s = o.scale.x;
    writeEarthState({ rxDeg, ryDeg, s });
  }
  window.addEventListener('pagehide', saveNow, {capture:true});
  window.addEventListener('beforeunload', saveNow, {capture:true});
  function restoreIfAny(){
    const state = readEarthState(); if (!state) return;
    const earth = document.getElementById('earth'); if (!earth || !earth.object3D) return;
    const s = clamp(Number(state.s)||1, 1.0, 3.0);
    const rxDeg = clamp(Number(state.rxDeg)||0, -80, 80);
    const ryDeg = Number(state.ryDeg)||0;
    earth.object3D.scale.set(s, s, s);
    earth.object3D.rotation.x = THREE.MathUtils.degToRad(rxDeg);
    earth.object3D.rotation.y = THREE.MathUtils.degToRad(ryDeg);
    const ec = earth.components['earth-controls'];
    if (ec) ec.currentXRotation = rxDeg;
    const mp = earth.components['marker-placer'];
    if (mp && typeof mp.updateClusters === 'function') {
      mp.previousEarthScale = s;
      try { mp.updateClusters(); } catch(_) {}
    }
  }
  window.addEventListener('pageshow', function(){
    const scene = (AFRAME.scenes && AFRAME.scenes[0]) || document.querySelector('a-scene');
    if (scene && scene.hasLoaded) restoreIfAny();
    else if (scene) scene.addEventListener('loaded', restoreIfAny, {once:true});
    else window.addEventListener('load', restoreIfAny, {once:true});
  }, {capture:true});
})();
</script>
