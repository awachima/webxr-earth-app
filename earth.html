  <script>
AFRAME.registerComponent('rounded-panel', {
  schema: {
    width:  {type: 'number', default: 0.6},
    height: {type: 'number', default: 0.7},
    radius: {type: 'number', default: 0.05},      // 角丸半径
    color:  {type: 'color',  default: '#333'},
    opacity:{type: 'number', default: 0.7},
    stroke: {type: 'number', default: 0.001},      // 枠線の太さ（面の外周から内側方向）
    strokeColor:   {type: 'color',  default: '#FFFFFF'},
    strokeOpacity: {type: 'number', default: 1.0},
    doubleSided:   {type: 'boolean', default: false} // 両面表示（必要に応じて）
  },

  init: function () {
    this._build();
  },

  update: function () {
    this._build();
  },

  remove: function () {
    this._disposeMesh('rp-fill');
    this._disposeMesh('rp-stroke');
  },

  _disposeMesh: function (key) {
    const obj = this.el.getObject3D(key);
    if (obj) {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) obj.material.dispose();
      this.el.removeObject3D(key);
    }
  },

  _roundedRectShape: function (w, h, r) {
    const shape = new THREE.Shape();
    const hw = w / 2, hh = h / 2;
    const rr = Math.max(0, Math.min(r, Math.min(hw, hh))); // 過大半径の抑制

    // 開始点（左下角の丸の始点）
    shape.moveTo(-hw + rr, -hh);

    // 下辺 → 右下角
    shape.lineTo(hw - rr, -hh);
    shape.absarc(hw - rr, -hh + rr, rr, -Math.PI / 2, 0, false);

    // 右辺 → 右上角
    shape.lineTo(hw, hh - rr);
    shape.absarc(hw - rr, hh - rr, rr, 0, Math.PI / 2, false);

    // 上辺 → 左上角
    shape.lineTo(-hw + rr, hh);
    shape.absarc(-hw + rr, hh - rr, rr, Math.PI / 2, Math.PI, false);

    // 左辺 → 左下角
    shape.lineTo(-hw, -hh + rr);
    shape.absarc(-hw + rr, -hh + rr, rr, Math.PI, 1.5 * Math.PI, false);

    return shape;
  },

  _build: function () {
    const d = this.data;
    const side = d.doubleSided ? THREE.DoubleSide : THREE.FrontSide;

    // 既存メッシュの破棄
    this._disposeMesh('rp-fill');
    this._disposeMesh('rp-stroke');

    // === 本体（塗り） ===
    const fillShape = this._roundedRectShape(d.width, d.height, d.radius);
    const fillGeom = new THREE.ShapeGeometry(fillShape, 24);
    const fillMat  = new THREE.MeshBasicMaterial({
      color: new THREE.Color(d.color),
      transparent: true,
      opacity: d.opacity,
      side
    });
    const fillMesh = new THREE.Mesh(fillGeom, fillMat);
    this.el.setObject3D('rp-fill', fillMesh);

    // === 枠線（リング形状） ===
    if (d.stroke > 0) {
      const innerW = Math.max(0, d.width  - 2 * d.stroke);
      const innerH = Math.max(0, d.height - 2 * d.stroke);
      const innerR = Math.max(0, d.radius - d.stroke);

      const outer = this._roundedRectShape(d.width,  d.height,  d.radius);
      const inner = this._roundedRectShape(innerW,   innerH,    innerR);
      // 「穴」を開けてリング形状に
      outer.holes.push(inner);

      const strokeGeom = new THREE.ShapeGeometry(outer, 24);
      const strokeMat  = new THREE.MeshBasicMaterial({
        color: new THREE.Color(d.strokeColor),
        transparent: true,
        opacity: d.strokeOpacity,
        side
      });
      const strokeMesh = new THREE.Mesh(strokeGeom, strokeMat);
      this.el.setObject3D('rp-stroke', strokeMesh);
    }
  }
});
  </script>

  addLabels: function() {
    const el = this.el;
    // 半径を取得（ジオメトリが未ロードの場合はデフォルト1とする）
    const geometryRadius = el.getAttribute('geometry') ? el.getAttribute('geometry').radius : 1;
    // 文字を配置する半径（地表より少し浮かせる）
    const R = geometryRadius * this.data.altitude;

    this.countries.forEach(country => {
      // 1. テキストエンティティの作成
      const textEl = document.createElement('a-entity');
      
      // 2. troika-textの設定 (日本語対応フォント、アウトライン付きで視認性確保)
      textEl.setAttribute('troika-text', {
        value: country.name,
        font: this.data.font,
        fontSize: this.data.fontSize,
        align: 'center',
        anchor: 'center',
        color: this.data.color,
        outlineWidth: '10%',
        outlineColor: '#000000',
        depthOffset: 1 // チラつき防止
      });

      // 3. 座標計算 (latLonTo3Dロジックの再利用)
      const pos = this.latLonTo3D(country.lat, country.lon, R);
      textEl.setAttribute('position', pos);

      // 4. 回転設定 (地球の中心から外側を向くように設定)
      // まず地球の中心(0,0,0)の方を向かせる
      textEl.object3D.lookAt(new THREE.Vector3(0, 0, 0));
      // そのままだと文字が裏返るので、Y軸で180度回転させて表に向ける
      textEl.object3D.rotateY(Math.PI); 

      // 子要素として追加
      el.appendChild(textEl);
    });
  },

  // 既存のmarker-placerと同じ計算ロジックを使用
  latLonTo3D: function(lat, lon, R) {
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lon + 180) * (Math.PI / 180);
    const x = -(R * Math.sin(phi) * Math.cos(theta));
    const z = R * Math.sin(phi) * Math.sin(theta);
    const y = R * Math.cos(phi);
    return new THREE.Vector3(x, y, z);
  }
});

<script>
const FONT_URL = 'static/NotoSansJP-Regular.ttf';
window.__panelOpen = false;
window.__panelTick = null; // panel scroll step runner injected at openPanel

function refreshAllRaycasters(){
  ['#mouseCursor', '#right-ray'].forEach(function(sel){
    var el=document.querySelector(sel);
    var rc = el && el.components && el.components.raycaster;
    if(rc && rc.refreshObjects) rc.refreshObjects();
  });
}
function setRaycasterTargets(uiOnly){
  var objs = uiOnly ? '.ui' : '.collidable, .ui';
  ['#mouseCursor', '#right-ray'].forEach(function(sel){
    var el=document.querySelector(sel);
    if(el) el.setAttribute('raycaster','objects',objs);
  });
}

// ----- パネルをワールド固定 -----
AFRAME.registerComponent('panel-world-lock',{
  schema:{ baseDist:{type:'number',default:0.5}, baseScale:{type:'number',default:0.5}, margin:{type:'number',default:0.03}, minDist:{type:'number',default:1.02}, worldYaw:{type:'number',default:0}, yOffset:{type:'number',default:0.00} },
  init:function(){
    this.cam = document.querySelector('#camera');
    this.earth = document.querySelector('#earth');
    this._camPos   = new THREE.Vector3();
    this._earthPos = new THREE.Vector3();
    this._fwd      = new THREE.Vector3();
    this._up       = new THREE.Vector3(0,1,0);
    this._placed = false;
  },
  tick:function(){ if(!this._placed) this.placeOnce(); },
  placeOnce:function(){
    if(this._placed || !this.cam) return; this._placed = true;
    this.cam.object3D.getWorldPosition(this._camPos);
    this._fwd.set(0,0,-1).applyQuaternion(this.cam.object3D.quaternion).normalize();
    let dist = this.data.baseDist;
    if(this.earth){
      this.earth.object3D.getWorldPosition(this._earthPos);
      const s = this.earth.object3D.scale.x || 1;
      const R = (this.earth.getAttribute('geometry')?.radius || 1) * s;
      const along = this._earthPos.clone().sub(this._camPos).dot(this._fwd); // +: forward
      const nearAlong = along - R;
      const willIntersect = (along > 0) && (nearAlong <= dist + this.data.margin);
      if (willIntersect){
        dist = Math.max(this.data.minDist, nearAlong - this.data.margin);
      }
    }
    dist = Math.max(this.data.minDist, dist);
    const side = new THREE.Vector3().crossVectors(this._fwd, this._up).normalize();
    const up   = new THREE.Vector3().crossVectors(side, this._fwd).normalize();
    const worldPos = this._camPos.clone().add(this._fwd.clone().multiplyScalar(dist)).add(up.multiplyScalar(this.data.yOffset));
    this.el.object3D.position.copy(worldPos);
    const scl = this.data.baseScale * (dist / this.data.baseDist);
    this.el.object3D.scale.set(scl, scl, scl);
    this.el.object3D.rotation.set(0, 0, 0);
    console.log('[panel-world-lock] placed at dist=',dist.toFixed(3),' baseDist=',this.data.baseDist,' pos=',this.el.object3D.position.toArray());
  }
});



// --- Ray Aim Offset (post-multiply each frame) ---
AFRAME.registerComponent('ray-aim-offset', {
  schema: { x:{type:'number',default:0}, y:{type:'number',default:0}, z:{type:'number',default:0} },
  init() {
    this._qOffset = new THREE.Quaternion();
    this._euler = new THREE.Euler();
    this._apply = this._apply.bind(this);
    this.update();
    this.el.object3D.onBeforeRender = this._apply; // apply after tracked-controls each frame
  },
  update() {
    this._euler.set(
      THREE.MathUtils.degToRad(this.data.x),
      THREE.MathUtils.degToRad(this.data.y),
      THREE.MathUtils.degToRad(this.data.z)
    );
    this._qOffset.setFromEuler(this._euler);
  },
  remove() {
    if (this.el.object3D.onBeforeRender === this._apply) {
      this.el.object3D.onBeforeRender = null;
    }
  },
  _apply() {
    this.el.object3D.quaternion.multiply(this._qOffset);
  }
});



// --- Enforce child raycaster (#right-ray) as the only VR ray ---
AFRAME.registerComponent('ray-enforce-child', {
  init: function(){
    // 🟦 PC などヘッドセット未接続の環境では何もしない（mouseCursor を優先）
    try {
      if (!AFRAME.utils ||
          !AFRAME.utils.device ||
          !AFRAME.utils.device.checkHeadsetConnected ||
          !AFRAME.utils.device.checkHeadsetConnected()) {
        console.log('[ray-enforce-child] no headset detected, keep mouseCursor only');
        return;
      }
    } catch (e) {
      console.log('[ray-enforce-child] device check failed, keep mouseCursor only', e);
      return;
    }

    var scene = this.el.sceneEl || this.el;

    function setAttr(el, comp, prop, val){
      if (!el) return;
      try { el.setAttribute(comp, prop, val); } catch(e){}
    }

    function enableChild(){
      var right = document.getElementById('right-hand');
      var child = document.getElementById('right-ray');
      var mouse = document.getElementById('mouseCursor');

      // 親（right-hand）側の raycaster は消しておく
      if (right && right.components && right.components.raycaster){
        right.removeAttribute('raycaster');
      }

      // 他の raycaster を無効化（mouseCursor と right-ray は除外）
      Array.from(document.querySelectorAll('[raycaster]')).forEach(function(e){
        if (e.id !== 'right-ray' && e.id !== 'mouseCursor'){
          setAttr(e, 'raycaster', 'enabled', false);
        }
      });

      // 子 ray（right-ray）を有効化
      if (child){
        setAttr(child, 'raycaster', 'useWorldCoordinates', false);
        setAttr(child, 'raycaster', 'showLine', true);
        setAttr(child, 'raycaster', 'enabled', true);
      }

      // VR 中は mouse を無効化
      if (mouse){
        setAttr(mouse, 'raycaster', 'enabled', false);
      }

      console.log('[ray-enforce-child] enter-vr: child ray enabled, others disabled');
    }

    function disableChild(){
      var child = document.getElementById('right-ray');
      var mouse = document.getElementById('mouseCursor');

      if (child){
        setAttr(child, 'raycaster', 'enabled', false);
      }
      if (mouse){
        setAttr(mouse, 'raycaster', 'enabled', true);
      }

      console.log('[ray-enforce-child] exit-vr: child ray disabled, mouse enabled');
    }

    // 初期状態では VR 用 ray はオフ、マウスはオン
    disableChild();

    // VR への出入りで切り替え
    scene.addEventListener('enter-vr', enableChild);
    scene.addEventListener('exit-vr', disableChild);
  }
});



// ===================================================================
// ===== Earth Controls (★★スマホ・タッチ操作対応版★★) =====
// ===================================================================
AFRAME.registerComponent('earth-controls',{
  // schemaにpinchScaleSpeedを追加
  schema:{
    rotationSpeed:{type:'number',default:2.0},
    joystickRotationSpeed:{type:'number',default:1.0},
    scaleSpeed:{type:'number',default:0.01},
    mouseRotationSpeed:{type:'number',default:0.2},
    wheelScaleSpeed:{type:'number',default:0.0005},
    pinchScaleSpeed:{type:'number', default:0.001} // ★ スマホのピンチ操作の感度
  },
  init:function(){
    this.minScale=1.0; this.maxScale=3.0;
    this.currentXRotation=0; this.keys={};
    this.stickInput={ left:{x:0,y:0}, right:{x:0,y:0} };

    // --- マウス・タッチ操作の状態管理 ---
    this.isDragging=false;
    this.previousPointerPosition={x:0,y:0}; // マウスと1本指タッチの座標
    this.previousPinchDistance = 0; // 2本指タッチの距離

    this.cameraEl=document.querySelector('#camera');
    this.uiState = { rotUp:false, rotDown:false, rotLeft:false, rotRight:false, zoomIn:false, zoomOut:false };
    var self=this;
    window.addEventListener('keydown',e=>self.keys[e.key]=true);
    window.addEventListener('keyup',e=>self.keys[e.key]=false);
    this.el.sceneEl.addEventListener('loaded', function(){
      var cvs=self.el.sceneEl.canvas;
      setTimeout(()=>{
        // PC マウス操作
        cvs.addEventListener('mousedown',e=>self.onMouseDown(e));
        window.addEventListener('mousemove',e=>self.onMouseMove(e));

        // ★★★ スマートフォン タッチ操作 ★★★
        cvs.addEventListener('touchstart', e => self.onTouchStart(e), {passive: false});
        cvs.addEventListener('touchmove', e => self.onTouchMove(e), {passive: false});
        cvs.addEventListener('touchend', e => self.onTouchEnd(e));
        // ★★★ ここまで ★★★

      }, 150);
      window.addEventListener('mouseup',()=>self.onMouseUp());
      if (!AFRAME.utils.device.checkHeadsetConnected()){
        cvs.addEventListener('wheel',e=>self.onWheelCanvas(e),{passive:true});
      }
      self.setupUIListeners();
    });
    this._bindThumbsticks = function(){
      var L=document.querySelector('#left-hand');
      var R=document.querySelector('#right-hand');
      if(L && !L._thumbBound){
        L.addEventListener('thumbstickmoved', e=>{ self.stickInput.left={x:e.detail.x,y:e.detail.y}; console.log('[L thumb] moved', e.detail); });
        L.addEventListener('axismove', e=>{
          var a=(e.detail && e.detail.axis)? e.detail.axis : [];
          if (self.stickInput.left.x===0 && self.stickInput.left.y===0){ self.stickInput.left={x:a[0]||0,y:a[1]||0}; }
          console.log('[L axis] ', a);
        });
        L.addEventListener('controllerconnected', ()=>console.log('[left-hand] controllerconnected'));
        L._thumbBound=true;
      }
      if(R && !R._thumbBound){
        R.addEventListener('thumbstickmoved', e=>{ self.stickInput.right={x:e.detail.x,y:e.detail.y}; console.log('[R thumb] moved', e.detail); });
        R.addEventListener('axismove', e=>{
          var a=(e.detail && e.detail.axis)? e.detail.axis : [];
          var rx= a.length > 2 ? a[2] : (a.length > 0 ? a[0] : 0);
          var ry= a.length > 3 ? a[3] : (a.length > 1 ? a[1] : 0);
          if (self.stickInput.right.x===0 && self.stickInput.right.y===0){ self.stickInput.right={x:rx,y:ry}; }
          console.log('[R axis] ', a, '=> right(x,y)=', rx, ry);
        });
        R.addEventListener('controllerconnected', ()=>console.log('[right-hand] controllerconnected'));
        R._thumbBound=true;
      }
    };
    var leftHand = document.querySelector('#left-hand');
    var rightHand = document.querySelector('#right-hand');
    if(leftHand)  leftHand.addEventListener('controllerconnected', this._bindThumbsticks.bind(this));
    if(rightHand) rightHand.addEventListener('controllerconnected', this._bindThumbsticks.bind(this));
  },
  setupUIListeners:function(){
    var self=this;
    [
      { id:'#btn-rot-up',    state:'rotUp' },
      { id:'#btn-rot-down',  state:'rotDown' },
      { id:'#btn-rot-left',  state:'rotLeft' },
      { id:'#btn-rot-right', state:'rotRight' },
      { id:'#btn-zoom-in',   state:'zoomIn' },
      { id:'#btn-zoom-out',  state:'zoomOut' }
    ].forEach(item=>{
      var btn=document.querySelector(item.id);
      if(btn){
        btn.addEventListener('mousedown', ()=> { self.uiState[item.state]=true; console.log('[UI] down', item.state); });
        btn.addEventListener('mouseup',   ()=> { self.uiState[item.state]=false; console.log('[UI] up', item.state); });
        btn.addEventListener('mouseleave',()=> { self.uiState[item.state]=false; });
      }
    });
  },
  onMouseDown:function(evt){
    if (evt.target.classList.contains('ui') || window.__panelOpen) return;
    this.isDragging=true; this.previousPointerPosition={x:evt.clientX,y:evt.clientY};
    if(this.cameraEl) this.cameraEl.setAttribute('look-controls','enabled',false);
  },
  onMouseMove:function(evt){
    if(!this.isDragging || window.__panelOpen) return;
    var dx=evt.clientX-this.previousPointerPosition.x;
    var dy=evt.clientY-this.previousPointerPosition.y;
    this.el.object3D.rotation.y += dx*(Math.PI/180)*this.data.mouseRotationSpeed;
    this.currentXRotation += dy*this.data.mouseRotationSpeed;
    this.previousPointerPosition={x:evt.clientX,y:evt.clientY};
  },
  onMouseUp:function(){ this.isDragging=false; },
  onWheelCanvas:function(evt){
    if(window.__panelOpen) return;
    var s=this.el.object3D.scale.x; s += evt.deltaY*-1*this.data.wheelScaleSpeed; s=Math.max(this.minScale,Math.min(this.maxScale,s));
    this.el.object3D.scale.set(s,s,s);
  },

  // ★★★ ここからタッチイベント処理の関数を追加 ★★★
  getPinchDistance: function(evt) {
    var dx = evt.touches[0].clientX - evt.touches[1].clientX;
    var dy = evt.touches[0].clientY - evt.touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  },

  onTouchStart: function(evt) {
    if (window.__panelOpen) return;
    // デフォルトの画面スクロールなどを防ぐ
    evt.preventDefault();

    if (evt.touches.length === 1) { // 1本指での操作（回転）
      this.isDragging = true;
      this.previousPointerPosition = { x: evt.touches[0].clientX, y: evt.touches[0].clientY };
    } else if (evt.touches.length === 2) { // 2本指での操作（拡縮）
      this.isDragging = false; // 2本指の場合は回転させない
      this.previousPinchDistance = this.getPinchDistance(evt);
    }
  },

  onTouchMove: function(evt) {
    if (window.__panelOpen) return;
    evt.preventDefault();

    if (this.isDragging && evt.touches.length === 1) { // 1本指でドラッグ中
      var dx = evt.touches[0].clientX - this.previousPointerPosition.x;
      var dy = evt.touches[0].clientY - this.previousPointerPosition.y;
      this.el.object3D.rotation.y += dx * (Math.PI / 180) * this.data.mouseRotationSpeed;
      this.currentXRotation += dy * this.data.mouseRotationSpeed;
      this.previousPointerPosition = { x: evt.touches[0].clientX, y: evt.touches[0].clientY };

    } else if (evt.touches.length === 2) { // 2本指でピンチ中
      var currentDist = this.getPinchDistance(evt);
      var delta = currentDist - this.previousPinchDistance;
      var s = this.el.object3D.scale.x;
      s += delta * this.data.pinchScaleSpeed; // 新しいプロパティで感度調整
      s = Math.max(this.minScale, Math.min(this.maxScale, s));
      this.el.object3D.scale.set(s, s, s);
      this.previousPinchDistance = currentDist;
    }
  },

  onTouchEnd: function(evt) {
    // 指が離れたらドラッグやピンチの状態をリセット
    if (evt.touches.length < 2) {
      this.previousPinchDistance = 0;
    }
    if (evt.touches.length < 1) {
      this.isDragging = false;
    }
  },
  // ★★★ ここまで ★★★

  getNonVrSticks:function(){
    var pads = (navigator.getGamepads && navigator.getGamepads()) ? navigator.getGamepads() : [];
    var p = null; for (var i=0;i<pads.length;i++){ if(pads[i] && pads[i].connected){ p=pads[i]; break; } }
    if(!p) return null; var ax=p.axes||[]; return { left:{x:ax[0]||0,y:ax[1]||0}, right:{x:ax[2]||0,y:ax[3]||0} };
  },
  tick:function(){
    if (window.__panelOpen) {
      return;
    }
    var stickRotY_raw = this.stickInput.right.x;
    var stickRotX_raw = this.stickInput.right.y;
    var stickScale_raw = this.stickInput.left.y;

    if (stickRotX_raw === 0 && stickRotY_raw === 0 && stickScale_raw === 0){
      var gp = this.getNonVrSticks();
      if(gp){
        stickRotY_raw = gp.right.x;
        stickRotX_raw = gp.right.y;
        stickScale_raw = gp.left.y;
      }
    }

    var rotY_k = (this.keys['ArrowLeft']?-1:0) + (this.keys['ArrowRight']?1:0);
    var rotX_k = (this.keys['ArrowUp']?-1:0) + (this.keys['ArrowDown']?1:0);
    var scale_k = (this.keys['w']||this.keys['W']?1:0) + (this.keys['s']||this.keys['S']?-1:0);
    var rotY_ui = (this.uiState.rotRight?1:0) + (this.uiState.rotLeft?-1:0);
    var rotX_ui = (this.uiState.rotDown?1:0) + (this.uiState.rotUp?-1:0);
    var scale_ui = (this.uiState.zoomIn?1:0) + (this.uiState.zoomOut?-1:0);

    var s=this.el.object3D.scale.x; var t=(s-1.0)/(3.0-1.0); var mul=1-(t*(7/8));
    var finalRotY=(stickRotY_raw!==0? stickRotY_raw*this.data.joystickRotationSpeed : (rotY_ui!==0? rotY_ui*this.data.rotationSpeed : rotY_k*this.data.rotationSpeed))*mul;
    var finalRotX=(stickRotX_raw!==0? stickRotX_raw*this.data.joystickRotationSpeed : (rotX_ui!==0? rotX_ui*this.data.rotationSpeed : rotX_k*this.data.rotationSpeed))*mul;
    var finalScale=(stickScale_raw!==0? -stickScale_raw : (scale_ui!==0? scale_ui : scale_k))*this.data.scaleSpeed;
    this.el.object3D.rotation.y += finalRotY*(Math.PI/180);
    this.currentXRotation = Math.max(-80, Math.min(80, this.currentXRotation + finalRotX));
    this.el.object3D.rotation.x = this.currentXRotation*(Math.PI/180);
    var ns=s+finalScale; ns=Math.max(this.minScale,Math.min(this.maxScale,ns));
    this.el.object3D.scale.set(ns,ns,ns);
  }
});

AFRAME.registerComponent('marker-placer',{
  schema:{ maxMarkerMultiplier:{type:'number',default:20}, minWorldMultiplier:{type:'number',default:3.5} },
  init:async function(){
    this.allLocations=[]; this.currentMarkers=[];
    this.cameraEl=document.querySelector('#camera');
    this.cameraPos=new THREE.Vector3(); this.markerPos=new THREE.Vector3(); this.earthPos=new THREE.Vector3();
    this.previousEarthScale=this.el.object3D.scale.x;
    this.el.sceneEl.addEventListener('panel-closed', () => {
      this.currentMarkers.forEach(marker => { var mesh=marker.getObject3D('mesh'); if(mesh) mesh.material.color.set('#FF7F8A'); });
    });
    var sheetUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vQKDucOdVD9mvoZHq-HIOxi_J1L8s9Qjh7hP3oU_oTQrh1k_4tvB8m9ZRtp9Lond1XqVDdu5R8bNAsW/pub?gid=717261533&single=true&output=csv";
    console.log('[marker-placer] fetching CSV:', sheetUrl);
    try{
      var res=await fetch(sheetUrl,{cache:'no-store'});
      if(res.ok){
        var text=await res.text(); this.allLocations=this.parseCSV(text);
        console.log('[marker-placer] loaded records:', this.allLocations.length);
      }else{
        console.error('[marker-placer] fetch failed:', res.status);
      }
    }catch(err){
      console.error('[marker-placer] fetch error:', err);
    }
    this.updateClusters(true);
  },
  parseCSV:function(csv){
    var lines=csv.split(/\r?\n/);
    var out=[];
    for(var i=1;i<lines.length;i++){
      var row=lines[i].trim();
      if(!row) continue;
      var cols=row.split(',');
      if(cols.length<4) continue;
      var title=cols[0];
      var lat=parseFloat(cols[1]);
      var lng=parseFloat(cols[2]);
      var url=cols[3];
      if(!isFinite(lat)||!isFinite(lng)) continue;
      out.push({ title:title, lat:lat, lng:lng, url:url });
    }
    return out;
  },
  latLngToXYZ:function(lat,lng,R){
    var phi  =(90-lat)*Math.PI/180;
    var theta=(lng+180)*Math.PI/180;
    var x=-(R*Math.sin(phi)*Math.cos(theta));
    var z= (R*Math.sin(phi)*Math.sin(theta));
    var y= (R*Math.cos(phi));
    return {x:x,y:y,z:z};
  },
  clusterLocations:function(radius){
    var pts=this.allLocations.slice();
    var clusters=[];
    while(pts.length>0){
      var base=pts.shift();
      var cluster=[base];
      for(var i=pts.length-1;i>=0;i--){
        var p=pts[i];
        var dLat=base.lat-p.lat;
        var dLng=base.lng-p.lng;
        var dist=Math.sqrt(dLat*dLat+dLng*dLng);
        if(dist<radius){
          cluster.push(p); pts.splice(i,1);
        }
      }
      clusters.push(cluster);
    }
    return clusters;
  },
  updateClusters:function(force){
    if(this.allLocations.length===0) return;
    var s=this.el.object3D.scale.x;
    var t=(s-1.0)/(3.0-1.0);
    var minR=0.008, maxR=0.2;
    var radius=maxR - t*(maxR-minR);

    if(!force && Math.abs(s-this.previousEarthScale)<0.01) return;
    this.previousEarthScale=s;

    this.currentMarkers.forEach(m => m.parentNode && m.parentNode.removeChild(m));
    this.currentMarkers.length=0;

    var R=(this.el.getAttribute('geometry')&&this.el.getAttribute('geometry').radius)||1;
    var clusters=this.clusterLocations(radius);
    console.log('[marker-placer] scale=',s.toFixed(2),' radius=',radius.toFixed(4),' clusters=',clusters.length);

    clusters.forEach(cluster=>{
      var sumLat=0,sumLng=0;
      cluster.forEach(c=>{ sumLat+=c.lat; sumLng+=c.lng; });
      var cLat=sumLat/cluster.length;
      var cLng=sumLng/cluster.length;

      var pos=this.latLngToXYZ(cLat,cLng,R+0.01);
      var marker=document.createElement('a-entity');
      marker.setAttribute('position',pos);
      marker.setAttribute('look-at','[camera]');
      marker.setAttribute('hex-marker',{count:cluster.length, baseRadius:0.013});
      marker.classList.add('collidable');

      marker.addEventListener('click',()=>{
        console.log('[marker-placer] cluster clicked, size=',cluster.length);
        openPanelForCluster(cluster);
        this.currentMarkers.forEach(m=>{
          var mesh=m.getObject3D('mesh');
          if(mesh) mesh.material.color.set('#FF7F8A');
        });
        var myMesh=marker.getObject3D('mesh');
        if(myMesh) myMesh.material.color.set('#00FFAA');
      });

      this.el.appendChild(marker);
      this.currentMarkers.push(marker);
    });

    refreshAllRaycasters();
  }
});

<script>
(function(){
  'use strict';

  const STORAGE_KEY = 'earth_state_v2';

  function clamp(v,min,max){ return (v<min)?min:(v>max)?max:v; }

  function saveState(){
    var earth = document.getElementById('earth');
    if(!earth || !earth.object3D) return;
    var s = earth.object3D.scale.x || 1;
    var rx = earth.object3D.rotation.x || 0;
    var ry = earth.object3D.rotation.y || 0;
    var state = {
      s: s,
      rxDeg: THREE.MathUtils.radToDeg(rx),
      ryDeg: THREE.MathUtils.radToDeg(ry)
    };
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){}
  }

  function restoreIfAny(){
    var earth = document.getElementById('earth');
    if(!earth || !earth.object3D) return;

    var raw = null;
    try{
      raw = localStorage.getItem(STORAGE_KEY);
    }catch(e){}

    if(!raw) return;
    var state = null;
    try{
      state = JSON.parse(raw);
    }catch(e){
      return;
    }
    if(!state) return;

    const minS = 1.0, maxS = 3.0;
    const s = clamp(Number(state.s)||1, minS, maxS);
    const rxDeg = clamp(Number(state.rxDeg)||0, -80, 80);
    const ryDeg = Number(state.ryDeg)||0;

    earth.object3D.scale.set(s, s, s);
    earth.object3D.rotation.x = THREE.MathUtils.degToRad(rxDeg);
    earth.object3D.rotation.y = THREE.MathUtils.degToRad(ryDeg);

    const ec = earth.components['earth-controls'];
    if (ec) {
      ec.currentXRotation = rxDeg;
    }

    const mp = earth.components['marker-placer'];
    if (mp && typeof mp.updateClusters === 'function') {
      mp.previousEarthScale = s;
      try { mp.updateClusters(); } catch(_) {}
    }
  }

  window.addEventListener('beforeunload', saveState);

  window.addEventListener('pageshow', function(e){
    const scene = (AFRAME.scenes && AFRAME.scences[0]) || document.querySelector('a-scene');
    if (scene && scene.hasLoaded) {
      restoreIfAny();
    } else if (scene) {
      scene.addEventListener('loaded', restoreIfAny, {once:true});
    } else {
      window.addEventListener('load', restoreIfAny, {once:true});
    }
  }, {capture:true});

})();
</script>

<!-- ★追加スクリプト：Meta Quest ブラウザ（非VR）のときだけパネル表示 -->
<script>
(function(){
  function isQuestBrowser(){
    var ua = navigator.userAgent || '';
    return /OculusBrowser|Quest|Meta Quest/i.test(ua);
  }

  function updatePanelVisibility(){
    var panel = document.getElementById('ui-panel');
    var scene = (AFRAME.scenes && AFRAME.scenes[0]) || document.querySelector('a-scene');
    if (!panel || !scene) return;

    var isVr = scene.is && scene.is('vr-mode');

    var show = isQuestBrowser() && !isVr;
    panel.setAttribute('visible', show ? 'true' : 'false');
  }

  window.addEventListener('load', function(){
    var scene = (AFRAME.scenes && AFRAME.scenes[0]) || document.querySelector('a-scene');
    if (scene) {
      scene.addEventListener('enter-vr', updatePanelVisibility);
      scene.addEventListener('exit-vr', updatePanelVisibility);
    }
    // 初期表示時にも一度チェック
    updatePanelVisibility();
  });
})();
</script>
