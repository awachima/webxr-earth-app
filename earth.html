<head>

  <script>
AFRAME.registerComponent('rounded-panel', {
  schema: {
    width:  {type: 'number', default: 0.6},
    height: {type: 'number', default: 0.7},
    radius: {type: 'number', default: 0.05},
    color:  {type: 'color',  default: '#333'},
    opacity:{type: 'number', default: 0.7},
    stroke: {type: 'number', default: 0.001},
    strokeColor: {type: 'color', default: '#ffffff'},
    doubleSide: {type: 'boolean', default: true}
  },

  init: function () {
    this._build();
  },

  update: function () {
    this._build();
  },

  remove: function () {
    if (this.mesh) {
      this.el.object3D.remove(this.mesh);
      this.mesh.geometry.dispose();
      if (Array.isArray(this.mesh.material)) {
        this.mesh.material.forEach(m => m.dispose());
      } else {
        this.mesh.material.dispose();
      }
      this.mesh = null;
    }
  },

  _createRoundedShape: function (width, height, radius) {
    const shape = new THREE.Shape();
    const hw = width / 2;
    const hh = height / 2;
    const rr = Math.min(radius, hw, hh);

    shape.moveTo(-hw + rr, -hh);

    shape.lineTo(hw - rr, -hh);
    shape.absarc(hw - rr, -hh + rr, rr, 1.5 * Math.PI, 2 * Math.PI, false);

    shape.lineTo(hw, hh - rr);
    shape.absarc(hw - rr, hh - rr, rr, 0, 0.5 * Math.PI, false);

    shape.lineTo(-hw + rr, hh);
    shape.absarc(-hw + rr, hh - rr, rr, 0.5 * Math.PI, Math.PI, false);

    shape.lineTo(-hw, -hh + rr);
    shape.absarc(-hw + rr, -hh + rr, rr, Math.PI, 1.5 * Math.PI, false);

    return shape;
  },

  _build: function () {
    const d = this.data;
    const side = d.doubleSide ? THREE.DoubleSide : THREE.FrontSide;

    const shape = this._createRoundedShape(d.width, d.height, d.radius);
    const geometry = new THREE.ShapeGeometry(shape);

    const panelMaterial = new THREE.MeshStandardMaterial({
      color: d.color,
      opacity: d.opacity,
      transparent: d.opacity < 1.0,
      side: side
    });

    let materials;
    if (d.stroke > 0) {
      const strokeGeometry = new THREE.ShapeGeometry(shape);
      strokeGeometry.translate(0, 0, 0.0001);

      const strokeMaterial = new THREE.MeshBasicMaterial({
        color: d.strokeColor,
        wireframe: true,
        side: side
      });

      materials = [panelMaterial, strokeMaterial];

      const panelMesh = new THREE.Mesh(geometry, panelMaterial);
      const strokeMesh = new THREE.Mesh(strokeGeometry, strokeMaterial);

      const group = new THREE.Group();
      group.add(panelMesh);
      group.add(strokeMesh);

      if (this.mesh) {
        this.el.object3D.remove(this.mesh);
      }

      this.mesh = group;
      this.el.object3D.add(group);

    } else {
      const mesh = new THREE.Mesh(geometry, panelMaterial);

      if (this.mesh) {
        this.el.object3D.remove(this.mesh);
      }

      this.mesh = mesh;
      this.el.object3D.add(mesh);
    }
  }
});

AFRAME.registerComponent('hex-marker',{
  schema:{ count:{type:'number',default:1} },
  init:function(){
    const C=0.2;
    var r=0.2;
    var h=0.35;
    var geo=new THREE.CylinderGeometry(r,r,h,6);
    geo.rotateX(Math.PI/2);
    var mat=new THREE.MeshStandardMaterial({color:'#FF7F8A'});
    var mesh=new THREE.Mesh(geo,mat);
    mesh.castShadow=true; mesh.receiveShadow=true;
    this.el.setObject3D('mesh',mesh);

    var fontLoader=new THREE.FontLoader();
    var self=this;
    fontLoader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json',function(font){
      var textGeo=new THREE.TextGeometry(String(self.data.count),{
        font:font,size:0.16,height:0.02,curveSegments:6,
        bevelEnabled:false
      });
      textGeo.computeBoundingBox();
      var box=textGeo.boundingBox;
      var textWidth=box.max.x-box.min.x;
      var textMat=new THREE.MeshBasicMaterial({color:'#fff'});
      var textMesh=new THREE.Mesh(textGeo,textMat);
      textMesh.position.set(-textWidth/2,0.25,0.18);
      textMesh.rotation.x = -Math.PI / 2;
      self.el.setObject3D('text',textMesh);
    });
  },
  remove:function(){
    this.el.removeObject3D('mesh');
    this.el.removeObject3D('text');
  }
});

AFRAME.registerComponent('look-at-camera',{
  tick:function(){
    var cam=this.el.sceneEl.camera; if(!cam) return;
    this.el.object3D.lookAt(cam.position);
  }
});

AFRAME.registerComponent('panel-follow-camera',{
  schema:{ distance:{type:'number',default:1.5} },
  init:function(){
    this.cameraEl=document.querySelector('#camera');
  },
  tick:function(){
    if(!this.cameraEl) return;
    var cam=this.cameraEl.object3D;
    var panel=this.el.object3D;
    var dist=this.data.distance;

    var camWorldPos=new THREE.Vector3();
    cam.getWorldPosition(camWorldPos);

    var camDir=new THREE.Vector3(0,0,-1);
    cam.getWorldDirection(camDir);
    camDir.normalize();

    var upWorld=new THREE.Vector3(0,1,0);

    var newPos=camWorldPos.clone().add(camDir.clone().multiplyScalar(dist));
    panel.position.copy(newPos);

    var target=camWorldPos.clone().add(camDir);
    panel.lookAt(target);

    panel.up.copy(upWorld);
  }
});

AFRAME.registerComponent('link-opener',{
  schema:{ url:{type:'string',default:''} },
  init:function(){
    this.el.addEventListener('click',()=>{
      var url=this.data.url;
      if(!url) return;
      try{
        if(window.parent && window.parent!==window){
          window.parent.postMessage({type:'open-url',url:url},'*');
        }else{
          window.open(url,'_blank');
        }
      }catch(e){
        console.error('URL open failed:',e);
        window.open(url,'_blank');
      }
    });
  }
});

AFRAME.registerComponent('panel-closer',{
  init:function(){
    this.el.addEventListener('click',()=>{
      var panel=document.querySelector('#infoPanel');
      if(panel){
        panel.setAttribute('visible','false');
        window.__panelOpen=false;
        var scene=panel.sceneEl;
        if(scene){
          scene.emit('panel-closed',{});
        }
      }
    });
  }
});

AFRAME.registerComponent('marker-placer',{
  schema:{ maxMarkerMultiplier:{type:'number',default:20}, minWorldMultiplier:{type:'number',default:3.5} },
  init:async function(){
    this.allLocations=[]; this.currentMarkers=[]; this.lucyRowFilter=null;
    this.cameraEl=document.querySelector('#camera');
    this.cameraPos=new THREE.Vector3(); this.markerPos=new THREE.Vector3(); this.earthPos=new THREE.Vector3();
    this.previousEarthScale=this.el.object3D.scale.x;
    this.el.sceneEl.addEventListener('panel-closed', () => {
      this.currentMarkers.forEach(marker => {
        var mesh=marker.getObject3D('mesh');
        if(mesh) mesh.material.color.set('#FF7F8A');
      });
    });
    var sheetUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vQKDucOdVD9mvoZHq-HIOxi_J1L8s9Qjh7hP3oU_oTQrh1k_4tvB8m9ZRtp9Lond1XqVDdu5R8bNAsW/pub?gid=717261533&single=true&output=csv";
    console.log('[marker-placer] fetching CSV:', sheetUrl);
    try{
      var res=await fetch(sheetUrl,{cache:'no-store'});
      if(res.ok){
        var text=await res.text(); this.allLocations=this.parseCsv(text);
        console.log('[marker-placer] CSV loaded:', this.allLocations.length, 'rows');
      }else{ console.error('CSV fetch failed:', res.status); }
    }catch(e){ console.error("データ取得エラー:",e); }
    this.updateClusters();
  },

  // ★★★ CSV を解析して rowIndex を付与する関数 ★★★
  parseCsv:function(csvText){
    const locations = [];

    function parseCsvLine(line){
      const parts = [];
      let cur = "";
      let inQuotes = false;
      for(let i=0;i<line.length;i++){
        const ch = line[i];
        if(ch === '"'){
          if(inQuotes && line[i+1] === '"'){
            cur += '"';
            i++;
          }else{
            inQuotes = !inQuotes;
          }
        }else if(ch === ',' && !inQuotes){
          parts.push(cur);
          cur = "";
        }else{
          cur += ch;
        }
      }
      parts.push(cur);
      return parts;
    }

    function cleanAndParseFloat(str){
      if(typeof str !== 'string') return NaN;
      const cleaned = str.trim().replace(/[−–‐]/g, '-');
      return parseFloat(cleaned);
    }

    const lines = csvText.split(/\r?\n/);
    if(lines.length <= 1) return locations;

    for(let i=1;i<lines.length;i++){
      const line = lines[i].trim();
      if(!line) continue;
      const cols = parseCsvLine(line);

      const title = (cols[0] || "").trim();
      const latStr = (cols[1] || "").trim();
      const lonStr = (cols[2] || "").trim();
      const url    = (cols[3] || "").trim();

      if(!title && !latStr && !lonStr && !url) continue;

      const lat = cleanAndParseFloat(latStr);
      const lon = cleanAndParseFloat(lonStr);
      const rowIndex = i - 1;

      if(isNaN(lat) || isNaN(lon)) continue;

      locations.push({
        title: title,
        lat:   lat,
        lon:   lon,
        url:   url,
        rowIndex: rowIndex
      });
    }

    return locations;
  },

  computeThreshold:function(){
    var s=this.el.object3D.scale.x;
    var t=(s-1)/(3-1);
    return 0.2 - t*(0.2-0.015);
  },

  updateClusters:function(){
    this.currentMarkers.forEach(m=>{ if(m && m.parentNode) m.parentNode.removeChild(m); });
    this.currentMarkers=[];
    var th=this.computeThreshold();

    var baseList = this.allLocations;
    if(this.lucyRowFilter && this.lucyRowFilter.size>0){
      baseList = baseList.filter(function(loc){
        return typeof loc.rowIndex === 'number' && this.lucyRowFilter.has(loc.rowIndex);
      }, this);
    }

    var unclustered=baseList.slice(); var clusters=[];
    while(unclustered.length>0){
      var p=unclustered.shift(); var cluster=[p]; var rest=[];
      for(var i2=0;i2<unclustered.length;i2++){
        var q=unclustered[i2]; var dist=this.haversineDistance(p,q);
        if(dist<th) cluster.push(q); else rest.push(q);
      }
      unclustered=rest; clusters.push(cluster);
    }
    console.log('[marker-placer] clusters formed:', clusters.length);
    this.placeMarkersFromClusters(clusters);
  },

  placeMarkersFromClusters:function(clusters){
    var R=this.el.getAttribute('geometry').radius; var self=this;
    clusters.forEach(function(cluster, idx){
      var lat=0,lon=0; cluster.forEach(p=>{lat+=p.lat;lon+=p.lon;}); lat/=cluster.length; lon/=cluster.length;
      var pos=self.latLonTo3D(lat,lon,R);
      var marker=document.createElement('a-entity'); marker.setAttribute('position',pos);
      var yAxis=pos.clone().normalize(), worldUp=new THREE.Vector3(0,1,0);
      var xAxis=new THREE.Vector3().crossVectors(worldUp,yAxis).normalize(); if(xAxis.length()===0) xAxis.set(1,0,0);
      var zAxis=new THREE.Vector3().crossVectors(xAxis,yAxis);
      var rotM=new THREE.Matrix4().makeBasis(xAxis,yAxis,zAxis);
      marker.object3D.quaternion.setFromRotationMatrix(rotM);
      marker.setAttribute('hex-marker',{count:cluster.length});
      marker.classList.add('collidable');
      marker.dataset.locations=JSON.stringify(cluster);
      marker.addEventListener('mouseenter',()=>{ if(window.__panelOpen) return; var mesh=marker.getObject3D('mesh'); if(mesh) mesh.material.color.set('yellow'); });
      marker.addEventListener('mouseleave',()=>{ if(window.__panelOpen) return; var mesh=marker.getObject3D('mesh'); if(mesh) mesh.material.color.set('#FF7F8A'); });
      marker.addEventListener('click', e=>{
        if(window.__panelOpen) return;
        var locations=JSON.parse(e.currentTarget.dataset.locations);
        openPanel(locations);
      });
      self.el.appendChild(marker); self.currentMarkers.push(marker);
    });
    console.log('[marker-placer] markers placed:', this.currentMarkers.length);
    refreshAllRaycasters();
  },

  haversineDistance:function(a,b){
    function toRad(x){ return x*Math.PI/180; }
    var dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
    var lat1=toRad(a.lat), lat2=toRad(b.lat);
    var h=Math.sin(dLat/2)**2 + Math.sin(dLon/2)**2 * Math.cos(lat1)*Math.cos(lat2);
    return 2*Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
  },

  setLucyFilter:function(rows){
    if(Array.isArray(rows) && rows.length>0){
      var s = new Set();
      for(var i=0;i<rows.length;i++){
        var n = parseInt(rows[i],10);
        if(!isNaN(n)) s.add(n);
      }
      this.lucyRowFilter = s;
    }else{
      this.lucyRowFilter = null;
    }
    this.updateClusters();
  },

  tick:function(){
    if(this.currentMarkers.length===0 || !this.cameraEl) return;
    var s=this.el.object3D.scale.x;
    if(Math.abs(s-this.previousEarthScale)>0.1){
      this.updateClusters();
      this.previousEarthScale=s;
    }
    this.el.object3D.getWorldPosition(this.earthPos);
    this.cameraEl.object3D.getWorldPosition(this.cameraPos);

    for(var i=0;i<this.currentMarkers.length;i++){
      var marker=this.currentMarkers[i];
      var t = (s-1)/(3-1);
      var targetWorld = this.data.maxMarkerMultiplier - t*(this.data.maxMarkerMultiplier - this.data.minWorldMultiplier);
      var markerScale = targetWorld / s;
      marker.object3D.scale.set(markerScale,markerScale,markerScale);

      marker.object3D.getWorldPosition(this.markerPos);
      var normal = this.markerPos.clone().sub(this.earthPos).normalize();

      var toEye = this.cameraPos.clone().sub(this.earthPos).normalize();
      if(normal.dot(toEye)<0){
        marker.object3D.visible=false;
      }else{
        marker.object3D.visible=true;
      }
    }
  },

  latLonTo3D:function(lat,lon,R){
    var phi=(90-lat)*Math.PI/180;
    var theta=(lon+180)*Math.PI/180;
    var x=-(R)*Math.sin(phi)*Math.cos(theta);
    var z=(R)*Math.sin(phi)*Math.sin(theta);
    var y=(R)*Math.cos(phi);
    return new THREE.Vector3(x,y,z);
  }
});

AFRAME.registerComponent('hover-scale',{
  schema:{ scale:{type:'number',default:1.2} },
  init:function(){
    var s=this.data.scale;
    this.el.addEventListener('mouseenter',()=>{ this.el.object3D.scale.set(s,s,s); });
    this.el.addEventListener('mouseleave',()=>{ this.el.object3D.scale.set(1,1,1); });

function refreshAllRaycasters(){
  var rays=document.querySelectorAll('[raycaster]');
  rays.forEach(r=>{ if(r.components && r.components.raycaster){ r.components.raycaster.refreshObjects(); }});
}

function openPanel(locations){
  var panel=document.querySelector('#infoPanel');
  if(!panel) return;
  panel.setAttribute('visible','true');
  window.__panelOpen=true;

  var scene=panel.sceneEl;
  if(scene){
    scene.emit('panel-opened',{});
  }

  var textContainer=document.querySelector('#infoTextContainer');
  while(textContainer.firstChild){
    textContainer.removeChild(textContainer.firstChild);
  }

  if(!window.__textFont){
    var loader=new THREE.FontLoader();
    loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json',function(font){
      window.__textFont=font;
      buildText();
    });
  }else{
    buildText();
  }

  function buildText(){
    var font=window.__textFont;
    var lineHeight=0.15;
    var startY=(locations.length-1)*lineHeight/2;

    locations.forEach(function(loc,idx){
      var group=new THREE.Group();

      var titleGeo=new THREE.TextGeometry(loc.title || 'No Title',{
        font:font,size:0.12,height:0.01,curveSegments:6,bevelEnabled:false
      });
      titleGeo.computeBoundingBox();
      var titleBox=titleGeo.boundingBox;
      var titleWidth=titleBox.max.x-titleBox.min.x;
      var titleMat=new THREE.MeshBasicMaterial({color:'#fff'});
      var titleMesh=new THREE.Mesh(titleGeo,titleMat);
      titleMesh.position.set(-titleWidth/2, startY-idx*lineHeight, 0);
      group.add(titleMesh);

      if(loc.url){
        var urlGeo=new THREE.TextGeometry('Open Link',{
          font:font,size:0.08,height:0.01,curveSegments:6,bevelEnabled:false
        });
        urlGeo.computeBoundingBox();
        var urlBox=urlGeo.boundingBox;
        var urlWidth=urlBox.max.x-urlBox.min.x;
        var urlMat=new THREE.MeshBasicMaterial({color:'#00bcd4'});
        var urlMesh=new THREE.Mesh(urlGeo,urlMat);
        urlMesh.position.set(-urlWidth/2, startY-idx*lineHeight-0.12, 0);
        urlMesh.userData = { url: loc.url };
        urlMesh.callback = function(){
          try{
            if(window.parent && window.parent!==window){
              window.parent.postMessage({type:'open-url',url:loc.url},'*');
            }else{
              window.open(loc.url,'_blank');
            }
          }catch(e){
            window.open(loc.url,'_blank');
          }
        };
        group.add(urlMesh);
      }

      textContainer.add(group);
    });
  }
}

document.addEventListener('click',function(e){
  var scene=document.querySelector('a-scene');
  if(!scene || !scene.object3D) return;

  var mouse=new THREE.Vector2(
    (e.clientX/window.innerWidth)*2-1,
    -(e.clientY/window.innerHeight)*2+1
  );
  var camera=scene.camera;
  if(!camera) return;
  var raycaster=new THREE.Raycaster();
  raycaster.setFromCamera(mouse,camera);

  var clickable=[];
  scene.object3D.traverse(function(obj){
    if(obj.callback){
      clickable.push(obj);
    }
  });

  var intersects=raycaster.intersectObjects(clickable,true);
  if(intersects.length>0){
    var obj=intersects[0].object;
    while(obj && !obj.callback){
      obj=obj.parent;
    }
    if(obj && obj.callback){
      obj.callback();
    }
  }
});

  </script>

            laser-controls="hand: left"
            raycaster="objects: .collidable"
            line="color: #f0f; opacity: 0.8">
  </a-entity>

</a-scene>

<script>
(function(){
  function handleBeforeUnload(event){
    try{
      if(document.fullscreenElement){
        const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if(exitFullscreen){
          exitFullscreen.call(document);
        }
      }
      var scene=(AFRAME.scenes && AFRAME.scenes[0]) || document.querySelector('a-scene');
      if(scene && scene.xrSession){
        scene.xrSession.end();
      }
    }catch(e){
      console.warn('Error while cleaning VR session on unload:', e);
    }
  }

  window.addEventListener('beforeunload', handleBeforeUnload);
})();
</script>

<!-- Meta Quest ブラウザ（非VR）のときだけパネルを表示するスクリプト -->
<script>
(function(){
  function isQuestBrowser(){
    var ua = navigator.userAgent || '';
    return /OculusBrowser|Quest/i.test(ua);
  }

  function isInVr(){
    var scene = (AFRAME.scenes && AFRAME.scenes[0]) || document.querySelector('a-scene');
    if (!scene) return false;
    return !!scene.is('vr-mode');
  }

  function updatePanelVisibility(){
    var scene = (AFRAME.scenes && AFRAME.scenes[0]) || document.querySelector('a-scene');
    if (!scene) return;

    var panel = document.querySelector('#infoPanel');
    if (!panel) return;

    var isVr = isInVr();
    var show = isQuestBrowser() && !isVr;
    panel.setAttribute('visible', show ? 'true' : 'false');
  }

  window.addEventListener('load', function(){
    var scene = (AFRAME.scenes && AFRAME.scenes[0]) || document.querySelector('a-scene');
    if (scene) {
      scene.addEventListener('enter-vr', updatePanelVisibility);
      scene.addEventListener('exit-vr', updatePanelVisibility);
    }
    updatePanelVisibility();
  });
})();
</script>

<!-- Lucy フィルタ連携用：index.html からの postMessage を受けてマーカーを絞り込み -->
<script>
  window.addEventListener('message', function(event){
    var data = event.data;
    if(!data || typeof data !== 'object') return;
    if(data.type !== 'lucy-filter-rows') return;

    var rows = Array.isArray(data.rows) ? data.rows : [];
    console.log('[earth] received lucy-filter-rows:', rows);

    var scene = (AFRAME.scenes && AFRAME.scenes[0]) || document.querySelector('a-scene');
    if(!scene) return;
    var earth = scene.querySelector('[marker-placer]');
    if(!earth || !earth.components || !earth.components['marker-placer']) return;

    var comp = earth.components['marker-placer'];
    if(typeof comp.setLucyFilter === 'function'){
      comp.setLucyFilter(rows);
    }
  });
</script>

</body>
</html>
