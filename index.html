<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DokodemoDoors ファンサイト</title>
  <style>
    html,body{height:100%;margin:0;background:#fff;overflow-x:hidden;overflow-y:scroll}
    .wrap{display:flex;flex-direction:column;align-items:center;min-height:100%}
    header{position:relative;width:100%;padding:8px 12px;background:rgba(0,0,0,.6);color:#fff;text-align:center}
    .header-actions{position:absolute;right:8px;top:8px}
    .link{display:inline-block;padding:6px 10px;border:1px solid #eee;border-radius:10px;background:#fff;color:#111;font:600 12px system-ui;text-decoration:none}

    .stage{position:relative;width:100%;display:flex;justify-content:center;padding-bottom:24px}
    .site-logo{pointer-events:none;position:absolute;top:120px;left:50%;transform:translate(-50%,-50%);width:min(30vw,200px);opacity:.95;z-index:2}
    /* ▼ 最小差分（2プロパティ追加） */
    #webxr-iframe{display:block;width:100%;height:80vh;border:none;margin-top:120px;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.25);background:#000;overscroll-behavior:contain;overflow:hidden}
    @media(min-width:1024px){#webxr-iframe{width:1024px;height:80vh}}
    @media(max-width:1023px){#webxr-iframe{width:100%;height:calc(80vw)}}

    .meetups{width:min(1024px,100%);margin:0 auto 80px;padding:0 16px}
    .meetups__head{display:flex;justify-content:space-between;align-items:center;font:700 18px system-ui;margin:12px 0 8px}

    .btn{appearance:none;border:1px solid #111;background:#111;color:#fff;padding:8px 12px;border-radius:10px;cursor:pointer;font:600 12px system-ui;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .btn.ghost{background:#fff;color:#111}
    .btn.danger{background:#b00020;border-color:#b00020}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .card{position:relative;border:1px solid #eee;border-radius:12px;padding:12px;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.05)}
    .title{font:600 16px system-ui;margin:0 0 6px}
    .meta{color:#666;font:12px system-ui;margin:0 0 8px}
    .tools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
    .icon{width:28px;height:28px;padding:0;border-radius:8px;display:inline-grid;place-items:center}

    /* ▼ FAB をテキスト付きピル型に変更 */
    .fab{
      position:fixed; right:16px; bottom:16px;
      height:48px; padding:0 16px; border-radius:9999px;
      background:#111; color:#fff;
      display:flex; gap:8px; align-items:center; justify-content:center;
      font:600 14px system-ui;
      box-shadow:0 8px 24px rgba(0,0,0,.25); cursor:pointer; z-index:10;
    }
    .fab-icon{ font:600 18px/1 system-ui; transform:translateY(-1px); }
    .fab-label{ white-space:nowrap; }
    @media (max-width: 360px){ .fab{ padding:0 12px; } .fab-label{ display:none; } }

    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20}
    .modal{width:min(720px,92vw);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
    .modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#111;color:#fff;font:700 16px system-ui}
    .close{cursor:pointer;font-size:20px;line-height:1}
    .body{padding:16px}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
    @media(max-width:640px){.form{grid-template-columns:1fr}}
    label{font:600 12px system-ui;color:#333}
    input,select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font:14px system-ui;box-sizing:border-box}
    .actions{display:flex;gap:10px;justify-content:flex-end;padding:0 16px 16px;flex-wrap:wrap}
    .actions .left{margin-right:auto;display:flex;gap:10px;align-items:center}
    .status{display:none;padding:12px 16px 16px;color:#0a7f3f;font:600 14px system-ui}
    .note{font:12px system-ui;color:#666;margin-top:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <!-- 右上の「＋ 待ち合わせを作る」は削除 -->
      <div>Dokodemo Doors ファンサイト</div>
    </header>

    <div class="stage">
      <img class="site-logo" src="./assets/jp-mobile-new.fffa2967.png" alt="ロゴ">
      <!-- ▼ 最小差分（scrolling="no" を付与） -->
      <iframe id="webxr-iframe" title="WebXR Earth" src="./earth.html" allow="xr-spatial-tracking; fullscreen" scrolling="no"></iframe>
    </div>

    <section class="meetups">
      <div class="meetups__head">
        <span>待ち合わせ部屋の一覧</span>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </div>

  <!-- ▼ 右下の FAB（テキスト付き） -->
  <div class="fab" id="fab">
    <span class="fab-icon">＋</span>
    <span class="fab-label">待ち合わせ部屋を作る</span>
  </div>

  <!-- 作成/編集モーダル -->
  <div class="backdrop" id="backdrop">
    <div class="modal">
      <header><div id="modalTitle">待ち合わせを作成</div><div class="close" id="close">×</div></header>
      <div class="body">
        <div class="form">
          <div><label for="mTitle">タイトル</label><input id="mTitle" placeholder="例：〇〇ツアー集合"></div>
          <div><label for="mLimit">参加上限</label><select id="mLimit"><option>10</option><option>9</option><option>8</option><option>7</option><option>6</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
          <div><label for="mStart">集合日時（JST）</label><input id="mStart" type="datetime-local"></div>
          <div>
            <label for="mTarget">目的URL（移動先）</label>
            <input id="mTarget" placeholder="https://example.com/room">
            <div class="note">※ 作成後は目的URLは固定です。変更したい場合は「複製」して新しい部屋を作ってください。</div>
          </div>
        </div>
      </div>
      <div class="actions">
        <div class="left">
          <button class="btn danger" id="delete" style="display:none">この部屋を削除</button>
        </div>
        <button class="btn ghost" id="duplicate" style="display:none">この部屋を複製</button>
        <button class="btn ghost" id="close2">閉じる</button>
        <button class="btn" id="submit">待ち合わせを作成</button>
      </div>
      <div class="status" id="statusMsg">作成しました</div>
    </div>
  </div>

  <script>
    // ===== Helpers =====
    const $  = (s)=>document.querySelector(s);
    const $$ = (s)=>Array.from(document.querySelectorAll(s));
    const pad=(n)=>String(n).padStart(2,'0');
    const toISO=(local)=>{ const d=new Date(local); const off=-d.getTimezoneOffset(); const sign=off>=0?'+':'-'; const a=Math.abs(off); return local+`${sign}${pad(Math.floor(a/60))}:${pad(a%60)}`; };
    const uuid=()=> (crypto.randomUUID?.() || ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
    const randKey=(n=16)=>{ const a=new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); };

    // ===== Storage =====
    const S='meetups-store', O='meetups-owners';
    const readStore =()=>JSON.parse(localStorage.getItem(S)||'[]');
    const writeStore=(arr)=>localStorage.setItem(S,JSON.stringify(arr));
    const readOwners=()=>JSON.parse(localStorage.getItem(O)||'{}');
    const writeOwners=(map)=>localStorage.setItem(O,JSON.stringify(map));
    const isOwner   =(roomId)=>Boolean(readOwners()[roomId]);

    // 共有レジストリ API（DO 内 /api/rooms）
    const REGISTRY_API = '/api/rooms';

    // 開始後20分で自動削除
    const NEGATIVE_LIMIT_MS = 20*60*1000;

    // ===== Auto delete =====
    function autoDeleteRoom(roomId){
      if (!roomId) return;
      const remain = readStore().filter(x=>x.roomId!==roomId);
      writeStore(remain);
      const owners = readOwners(); delete owners[roomId]; writeOwners(owners);
      const c = document.querySelector(`.card[data-room-id="${roomId}"]`);
      if (c) c.remove();
      console.info('[auto-delete]', roomId, 'を削除しました（開始から20分経過）');
    }

    // ===== Cards =====
    function initCountdown(card){
      const start = new Date(card.dataset.start);
      const el    = card.querySelector('[data-countdown]');
      const label = card.dataset.title || '開始まで';
      const roomId = card.dataset.roomId || '';
      const expireAt = new Date(start.getTime() + NEGATIVE_LIMIT_MS);

      const tick = ()=>{
        const now  = new Date();
        const diff = start - now;

        if (diff > 0){
          const h=Math.floor(diff/3600000), m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
          if (el) el.textContent = `${label}: ${pad(h)}:${pad(m)}:${pad(s)}`;
          requestAnimationFrame(tick); return;
        }
        const remainMs = expireAt - now;
        if (remainMs > 0){
          const remainMin = Math.ceil(remainMs/60000);
          if (el) el.textContent = `消滅まで後${pad(remainMin)}分`;
          requestAnimationFrame(tick);
        } else {
          if (el) el.textContent = '消滅しました';
          autoDeleteRoom(roomId);
        }
      };
      requestAnimationFrame(tick);
    }

    function attachEnter(card){
      const btn=card.querySelector('[data-enter]');
      btn.onclick=()=>{
        const p=new URLSearchParams({
          roomId: card.dataset.roomId || '',
          title : card.dataset.title,
          start : card.dataset.start,
          limit : card.dataset.limit,
          target: card.dataset.url
        });
        location.href = `./lobby.html?${p.toString()}`;
      };
    }

    function renderTools(card){
      const roomId=card.dataset.roomId;
      let tools=card.querySelector('.tools');
      if(!tools){ tools=document.createElement('div'); tools.className='tools'; card.appendChild(tools); }
      tools.innerHTML='';
      if(roomId && isOwner(roomId)){
        const b=document.createElement('button'); b.className='btn icon'; b.title='編集'; b.textContent='✎';
        b.onclick=()=>openModal('edit', {
          roomId,
          title: card.dataset.title,
          start: card.dataset.start,
          limit: card.dataset.limit,
          target: card.dataset.url
        });
        tools.appendChild(b);
      }
    }

    function upsertCard(item){
      const grid=$('#grid');
      let card=grid.querySelector(`.card[data-room-id="${item.roomId}"]`);
      if(!card){
        card=document.createElement('article');
        card.className='card';
        card.innerHTML=`
          <div class="title"></div>
          <div class="meta"><span data-countdown>開始まで: --:--:--</span></div>
          <div><a class="btn" data-enter>Enter Lobby</a></div>`;
      }
      card.dataset.roomId=item.roomId;
      card.dataset.title=item.title;
      card.querySelector('.title').textContent=item.title;
      card.dataset.start=item.start;
      card.dataset.url=item.target;
      card.dataset.limit=item.limit;
      // 重複を避けるため prepend（新しいものが先頭）
      const gridEl = $('#grid');
      if (card.parentElement !== gridEl) gridEl.prepend(card);
      initCountdown(card);
      attachEnter(card);
      renderTools(card);
    }

    function persist(item){
      const arr=readStore().filter(x=>x.roomId!==item.roomId);
      arr.unshift(item);
      writeStore(arr.slice(0,100));
    }

    function restore(){
      $$('.card').forEach(c=>{initCountdown(c);attachEnter(c);renderTools(c);});
      readStore().forEach(upsertCard);
    }

    // ===== Modal =====
    const backdrop=$('#backdrop');
    const modalTitle=$('#modalTitle');
    const mTitle=$('#mTitle'), mLimit=$('#mLimit'), mStart=$('#mStart'), mTarget=$('#mTarget');
    const statusMsg=$('#statusMsg');
    const submit=$('#submit'), duplicate=$('#duplicate'), delBtn=$('#delete');
    let mode='create', editingRoomId=null, editingTarget=null;

    function initStartInput(){
      const now=new Date(); now.setMinutes(now.getMinutes()+30); now.setSeconds(0,0);
      mStart.value=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    function openModal(m='create', payload=null){
      mode=m; statusMsg.style.display='none'; statusMsg.textContent='';
      if(m==='create'){
        modalTitle.textContent='待ち合わせを作成';
        submit.textContent='待ち合わせを作成';
        duplicate.style.display='none';
        delBtn.style.display='none';
        mTarget.disabled=false;
        mTitle.value=''; mLimit.value='10'; initStartInput(); mTarget.value='';
        editingRoomId=null; editingTarget=null;
      }else{
        const owners=readOwners();
        if(!payload || !owners[payload.roomId]){ alert('この端末には編集権限がありません'); return; }
        modalTitle.textContent='待ち合わせを編集';
        submit.textContent='更新する';
        duplicate.style.display='inline-block';
        delBtn.style.display='inline-block';
        mTarget.disabled=true;
        editingRoomId=payload.roomId; editingTarget=payload.target;
        mTitle.value=payload.title||''; mLimit.value=String(payload.limit||'10');
        mStart.value=(payload.start||'').slice(0,16); mTarget.value=payload.target||'';
      }
      backdrop.style.display='flex';
    }
    function closeModal(){ backdrop.style.display='none'; }

    async function postRegistry(item){
      try{
        const owner = localStorage.getItem('nickname') || null;
        await fetch(REGISTRY_API, {
          method: "POST",
          headers: {"content-type":"application/json"},
          body: JSON.stringify({ roomId: item.roomId, title: item.title, start: item.start, limit: item.limit, target: item.target, owner })
        });
      }catch(e){ console.warn('[registry]', e); }
    }

    async function onSubmit(){
      const owners=readOwners();
      let roomId=editingRoomId, target=editingTarget;
      const title=(mTitle.value||'待ち合わせ').trim();
      const limit=parseInt(mLimit.value,10)||10;
      if(!mStart.value){ alert('集合日時を入力してください。'); return; }

      if(mode==='create'){
        target=(mTarget.value||'').trim();
        if(!/^https?:\/\//i.test(target)){ alert('目的URL（https:// から）を入力してください。'); return; }
        roomId=uuid();
        owners[roomId]=randKey();
        writeOwners(owners);
      }
      const item={
        roomId, title, start: toISO(mStart.value), limit: String(limit), target,
        updatedAt: new Date().toISOString(),
        createdAt: (readStore().find(x=>x.roomId===roomId)?.createdAt || new Date().toISOString())
      };

      upsertCard(item);
      persist(item);
      // ★ 共有レジストリへ登録/更新（失敗しても無視）
      postRegistry(item);

      statusMsg.textContent = (mode==='create') ? '作成しました' : '更新しました';
      statusMsg.style.display = 'block';
    }

    function onDuplicate(){
      if(!editingRoomId) return;
      const owners=readOwners();
      const newId=uuid();
      owners[newId]=randKey();
      writeOwners(owners);
      const item={
        roomId:newId,
        title:(mTitle.value||'待ち合わせ').trim(),
        start:toISO(mStart.value),
        limit:String(parseInt(mLimit.value,10)||10),
        target:editingTarget,
        updatedAt:new Date().toISOString(),
        createdAt:new Date().toISOString()
      };
      upsertCard(item);
      persist(item);
      // ★ 複製も共有レジストリへ
      postRegistry(item);

      alert('複製しました（目的URLは元と同じです）');
    }

    function onDelete(){
      if(!editingRoomId) return;
      autoDeleteRoom(editingRoomId);
      closeModal();
      // ※ 共有レジストリ側は「開始+20分」で自動消滅。即時削除APIは最小差分のため未実装。
    }

    // bind
    restore();

    // 右上ボタンは削除済みなので安全にガード
    const oc = document.getElementById('openCreate');
    if (oc) oc.onclick = () => openModal('create');

    $('#fab').onclick=()=>openModal('create');  // ← FAB でモーダル起動
    $('#close').onclick=closeModal;
    $('#close2').onclick=closeModal;
    $('#submit').onclick=onSubmit;
    $('#duplicate').onclick=onDuplicate;
    $('#delete').onclick=onDelete;

    // ===== 共有レジストリから一覧を取得（起動時に1回） =====
    async function loadShared(){
      try{
        const res = await fetch(REGISTRY_API);
        const j = await res.json();
        if (j && j.ok && Array.isArray(j.rooms)) {
          j.rooms.forEach(upsertCard);
        }
      }catch(e){
        console.warn('[registry GET]', e);
      }
    }
    loadShared();

    // ===== 隠し一括初期化 (Ctrl+Alt+X) =====
    const ADMIN_HASH = "REPLACE_WITH_SHA-256_HEX"; // ← あなたのパスフレーズの SHA-256(HEX) を設定
    function toHex(buf){ return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
    async function sha256(s){ const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return toHex(buf); }
    function subtleEqual(a,b){ if(a.length!==b.length) return false; let r=0; for(let i=0;i<a.length;i++) r |= a.charCodeAt(i)^b.charCodeAt(i); return r===0; }

    window.addEventListener("keydown", async (e)=>{
      if (e.ctrlKey && e.altKey && (e.key==='x' || e.key==='X')){
        e.preventDefault();
        const pass = prompt("管理パスフレーズを入力してください");
        if (!pass) return;
        try{
          const hash = await sha256(pass);
          if (subtleEqual(hash, ADMIN_HASH)){
            if (confirm("この端末の待ち合わせをすべて初期化します。よろしいですか？")){
              localStorage.removeItem(S);
              localStorage.removeItem(O);
              alert("初期化しました");
              location.reload();
            }
          } else {
            alert("パスフレーズが違います");
          }
        }catch(err){
          console.error(err);
          alert("初期化に失敗しました");
        }
      }
    });
  </script>

  <!-- ▼ 最小差分：ホイール挙動の状況別抑止（iframe 上では親スクロール停止／外では親のみ） -->
  <script>
    (function(){
      var iframe = document.getElementById('webxr-iframe');
      if(!iframe) return;

      function lockPageScroll(){
        document.documentElement.style.overflowY = 'hidden';
        document.body.style.overflowY = 'hidden';
      }
      function unlockPageScroll(){
        document.documentElement.style.overflowY = 'scroll';
        document.body.style.overflowY = 'scroll';
      }

      iframe.addEventListener('mouseenter', lockPageScroll);
      iframe.addEventListener('mouseleave', unlockPageScroll);

      // 念のため：フォーカス喪失やページ遷移時にロックが残らないように
      window.addEventListener('blur', unlockPageScroll);
      window.addEventListener('beforeunload', unlockPageScroll);
    })();
  </script>
</body>
</html>
