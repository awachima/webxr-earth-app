<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dokodemo Doors Fan Site</title>
  <style>
    * { box-sizing: border-box; }
    html {
      height: 100%;
      overflow-y: scroll;
      scrollbar-gutter: stable both-edges; /* 横ズレ防止 */
    }
    body {
      min-height: 100%;
      margin: 0;
      background: #fff;
      overflow-x: hidden;
    }
    .wrap{display:flex;flex-direction:column;align-items:center;min-height:100%}

    /* === ヘッダー：ロゴ＋最上部固定（グレー帯 55px + 直下5px白帯） === */
    header{
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      width: 100%;
      height: 55px;
      padding: 0 12px;
      background: rgba(0,0,0,.6);
      color:#fff;
      text-align:center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      overflow: visible;
    }
    header::after{
      content:"";
      position: fixed;
      left: 0; right: 0; top: 55px;
      height: 5px;
      background: #fff;
      z-index: 0;
      pointer-events: none;
    }

    .brand-logo-text{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 900;
      color: #f3aa1a;
      margin: 0 auto;
      margin-top: 8px;
      letter-spacing: 0.03em;
      z-index: 2;
      position: relative;
      pointer-events: auto;
      max-width: calc(100% - 360px);
      text-align: center;
      /* ▼ 外側にだけ縁が出るように text-shadow で擬似アウトライン */
      text-shadow:
        -3px -3px 0 #373d49,
         0px -3px 0 #373d49,
         3px -3px 0 #373d49,
        -3px  0px 0 #373d49,
         3px  0px 0 #373d49,
        -3px  3px 0 #373d49,
         0px  3px 0 #373d49,
         3px  3px 0 #373d49;
    }

    .brand-logo{
      font-size: 68px;
      display:block;
      max-width: calc(100% - 360px);
      margin: 0px auto -8px;
      object-fit: contain;
      position: relative;
      z-index: 2;
      pointer-events:auto;
    }

    .stage{
      position:relative;
      width:100%;
      display:flex;
      justify-content:center;
      padding-bottom:24px;
      background:url('./assets/background.jpg') center/cover no-repeat;
      margin-top: 60px; /* 55px+5px */
    }
    .site-logo{
      pointer-events:none;
      position:absolute;
      top:120px;
      left:50%;
      transform:translate(-50%,-50%);
      width:min(30vw,200px);
      opacity:.95;
      z-index:2
    }
    #webxr-iframe{
      display:block;
      width:100%;
      height:80vh;
      border:none;
      margin-top:120px;
      border-radius:16px;
      box-shadow:0 30px 80px rgba(0,0,0,.25);
      background:#000;
      overscroll-behavior:contain;
      overflow:hidden;
      border: 5px solid #ffffff;
    }
    @media(min-width:1024px){
      #webxr-iframe{width:90%;height:90vh}
      .brand-logo-text{
        margin: 0;
        margin-top: 8px;
        margin-left: 30px;
        margin-right: auto;
        text-align: left;
        max-width: 50vw;
		font-size: 64px;
      }
    }
    @media(max-width:1023px){
      /* ▼ スマホ・タブレットのときだけ左寄せ＋少し左に隙間 */
      .stage{
        justify-content:flex-start;       /* 子要素を左寄せ */
      }
      #webxr-iframe{
        width: calc(100% - 30px);        /* 全幅から少しだけ縮める */
        height: calc(86vw);
        margin-left: 2px;                /* 左に少し隙間 */
      }

      /* ★ スマホ時のタイトルテキスト */
      .brand-logo-text{
        font-size: 54px;
        width: 60vw;
        max-width: 60vw;
        margin-top: 5px;     /* 上方向5px */
        margin-left: 5px;    /* 左に5pxの余白 */
        margin-right: auto;  /* 左寄せ */
		text-align: left;
      }
    }

    @media(max-width:624px){
      .brand-logo-text{
        font-size: 42px;
        max-width: 50vw;
      }
    }

    /* ====== 待ち合わせ一覧（Paper Cards） ====== */
    :root{
      --paper-bg-1: #FBF6ED;
      --paper-bg-2: #F2E7D8;
      --ink-900:   #1e2430;
      --ink-700:   #344054;
      --ink-500:   #667085;
      --ink-950:   #111827;
      --accent:    #3B82F6;
      --accent-ink:#ffffff;
      --card-shadow-1: 0 4px 10px rgba(0,0,0,.06);
      --card-shadow-2: 0 16px 30px rgba(0,0,0,.08);
    }

    .meetups{
      width:min(1024px,100%);
      margin:24px auto 80px;
      padding:24px 16px 32px;
      position:relative;
      border-radius:18px;
      background-image:
        linear-gradient(180deg, rgba(251,246,237,0.92) 0%, rgba(242,231,216,0.92) 100%),
        url('./assets/background2.jpg');
      background-size: 100% 100%, cover;
      background-position: center, center top;
      background-repeat: no-repeat, no-repeat;
      box-shadow: 0 18px 40px rgba(0,0,0,.08);
      overflow:hidden;
    }
    .meetups::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(1000px 400px at 10% -20%, rgba(255,255,255,.55), rgba(255,255,255,0)),
        radial-gradient(800px 300px at 90% 120%, rgba(255,255,255,.45), rgba(255,255,255,0));
      pointer-events:none;
    }

    .meetups__head{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap:12px;
      margin:0 0 16px;
    }
    .meetups__title{
      grid-column:2;
      justify-self:center;
      margin:0;
      font-weight:900;
      font-size: clamp(24px, 4.2vw, 36px);
      line-height:1.2;
      letter-spacing:.02em;
      color: var(--ink-950);
      text-align:center;
    }

    .meetups .head-create.btn{
      grid-column:3;
      justify-self:end;
      background:#3b2a1a;
      color:#fff;
      border:1px solid #3b2a1a;
      height:44px;
      padding:0 18px;
      border-radius:12px;
      font:700 14px/1 system-ui;
      white-space:nowrap;
      box-shadow:0 6px 16px rgba(59,42,26,.25), inset 0 -2px 0 rgba(0,0,0,.15);
      transition:transform .05s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .meetups .head-create.btn:hover{
      box-shadow:0 8px 20px rgba(59,42,26,.35), inset 0 -2px 0 rgba(0,0,0,.2);
      opacity:.98;
    }
    .meetups .head-create.btn:active{ transform:translateY(1px); }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
      gap:20px;
    }

    .card{
      position:relative;
      border:none;
      border-radius:16px;
      padding:14px 14px 56px;
      background:#fff;
      box-shadow: var(--card-shadow-1), var(--card-shadow-2);
      transition: transform .15s ease, box-shadow .15s ease;
      overflow:hidden;
      isolation:isolate;
    }
    .card:hover{
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,0,0,.12);
    }

    .title {font:700 17px/1.4 system-ui;margin:0 0 6px;color:var(--ink-900)}
    .meta{color:var(--ink-500);font:12px/1.4 system-ui;margin:0 0 8px}

    .tools{
      position:absolute;
      right:10px;
      top:10px;
      display:flex;
      gap:6px;
      z-index:2;
    }
    .icon{
      width:28px;
      height:28px;
      padding:0;
      border-radius:8px;
      display:inline-grid;
      place-items:center;
      background:#f6f7fb;
      border:1px solid #e6e8ef;
      color:#334155;
    }

    .meetups .card [data-enter].btn{
      position:absolute;
      left:14px;
      right:14px;
      bottom:14px;
      height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font:700 14px/1 system-ui;
      letter-spacing:.02em;
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 8px 18px rgba(59,130,246,.35), inset 0 -2px 0 rgba(0,0,0,.08);
      transition: transform .05s ease, box-shadow .15s ease, opacity .15s ease;
      text-decoration:none;
    }
    .meetups .card [data-enter].btn:hover{
      box-shadow: 0 10px 22px rgba(59,130,246,.45), inset 0 -2px 0 rgba(0,0,0,.12);
    }
    .meetups .card [data-enter].btn:active{ transform: translateY(1px); }

    .btn{
      appearance:none;
      border:1px solid #111;
      background:#111;
      color:#fff;
      padding:8px 12px;
      border-radius:10px;
      cursor:pointer;
      font:600 12px system-ui;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .btn.ghost{background:#fff;color:#111}
    .btn.danger{background:#b00020;border-color:#b00020}

    #grid .card:nth-child(4n+1){ background:#0B3559; color:#fff; }
    #grid .card:nth-child(4n+1) .title{ color:#fff; }
    #grid .card:nth-child(4n+1) .meta{ color:rgba(255,255,255,.85); }

    #grid .card:nth-child(4n+2){ background:#3270A6; color:#fff; }
    #grid .card:nth-child(4n+2) .title{ color:#fff; }
    #grid .card:nth-child(4n+2) .meta{ color:rgba(255,255,255,.9); }

    #grid .card:nth-child(4n+3){ background:#4E7DA6; color:#1f2937; }
    #grid .card:nth-child(4n+3) .title{ color:#1e2430; }
    #grid .card:nth-child(4n+3) .meta{ color:#243041; }

    #grid .card:nth-child(4n+4){ background:#736055; color:#fff; }
    #grid .card:nth-child(4n+4) .title{ color:#fff; }
    #grid .card:nth-child(4n+4) .meta{ color:rgba(255,255,255,.9); }


    .backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:20;
      touch-action: manipulation;
    }
    .modal{
      width:min(720px,92vw);
      background:#fff;
      border-radius:16px;

      box-shadow:0 24px 60px rgba(0,0,0,.35);
      overflow:visible;
    }
    .modal header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 16px;
      background:#111;
      color:#fff;
      font:700 16px system-ui;
    }
    .close{cursor:pointer;font-size:20px;line-height:1}
    .body{padding:16px}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
    @media(max-width:640px){.form{grid-template-columns:1fr}}
    label{font:600 12px system-ui;color:#333}
    input,select{
      width:100%;
      padding:10px 12px;
      border:1px solid #ddd;
      border-radius:10px;
      font:14px system-ui;
      box-sizing:border-box;
    }
    select{position:relative;z-index:30;}

    .actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      padding:0 16px 16px;
      flex-wrap:wrap;
    }
    .actions .left{
      margin-right:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .status{
      display:none;
      padding:12px 16px 16px;
      color:#0a7f3f;
      font:600 14px system-ui;
    }
    .note{font:12px system-ui;color:#666;margin-top:6px}

    footer{
      width:100%;
      height:60px;
      margin:0;
      padding:0;
      background:#000;
    }

    .lang-switch{
      position:absolute;
      top:8px;
      right:16px;
      display:flex;
      gap:8px;
      font-size:12px;
      font-weight:600;
    }
    .lang-switch .en{ background:#2563eb; color:#fff; }
    .lang-switch .ja{ background:#fbbf24; color:#111827; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand-logo-text">Dokodemo Doors Fan Site</div>
      <div class="lang-switch">
        <button type="button" class="en" onclick="switchLang('en')">English</button>
        <button type="button" class="ja" onclick="switchLang('ja')">日本語</button>
      </div>
    </header>

    <div class="stage">
      <img class="site-logo" src="./assets/jp-mobile-new.fffa2967.png" alt="Logo">
      <iframe id="webxr-iframe" title="WebXR Earth" src="./earth.html" allow="xr-spatial-tracking; fullscreen" scrolling="no"></iframe>
    </div>

    <section class="meetups">
      <div class="meetups__head">
        <h2 class="meetups__title">Meetup Rooms</h2>
        <button class="btn ghost head-create" id="openCreate">Create Meetup Room</button>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </div>

  <!-- 作成/編集モーダル -->
  <div class="backdrop" id="backdrop">
    <div class="modal">
      <header>
        <div id="modalTitle">Create meetup</div>
        <div class="close" id="close">×</div>
      </header>
      <div class="body">
        <div class="form">
          <div>
            <label for="mTitle">Title</label>
            <input id="mTitle" placeholder="e.g. Tokyo Night Tour" inputmode="text" maxlength="60">
          </div>

          <div>
            <label for="mLimit">Max participants</label>
            <select id="mLimit" aria-label="Select max participants">
              <option>10</option><option>9</option><option>8</option><option>7</option><option>6</option>
              <option>5</option><option>4</option><option>3</option><option>2</option><option>1</option>
            </select>
          </div>

          <div>
            <label for="mStart">Meeting time (JST)</label>
            <!-- 通常（対応ブラウザ向け） -->
            <input id="mStart" type="datetime-local" inputmode="none">

            <!-- フォールバック（Quest 等）：月/日/時/分 セレクト -->
            <div id="mStartFallback" style="display:none; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:8px">
              <select id="mMonth" aria-label="月"></select>
              <select id="mDay" aria-label="日"></select>
              <select id="mHour" aria-label="時"></select>
              <select id="mMinute" aria-label="分"></select>
            </div>
          </div>

          <div>
            <label for="mTarget">Destination URL</label>
            <input id="mTarget" placeholder="https://dokodemoors.com/..." inputmode="url" spellcheck="false" autocapitalize="off" autocomplete="off">
            <div class="note">Once created, the destination URL cannot be changed. To change it, duplicate this room and create a new one.</div>
          </div>
        </div>
      </div>
      <div class="actions">
        <div class="left">
          <button class="btn danger" id="delete" style="display:none">Delete this room</button>
        </div>
        <button class="btn ghost" id="duplicate" style="display:none">Duplicate this room</button>
        <button class="btn ghost" id="close2">Close</button>
        <button class="btn" id="submit">Create meetup</button>
      </div>
      <div class="status" id="statusMsg">Created</div>
    </div>
  </div>

  <!-- カスタムアラート（目的URLの内容） -->
  <div class="backdrop" id="alertBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="alertTitle" aria-describedby="alertBody">
      <header>
        <div id="alertTitle">Destination URL Details</div>
        <div class="close" id="alertClose" aria-label="Close">×</div>
      </header>
      <div class="body" id="alertBody">
        Please set the destination URL to a DokodemoDoors tour or world.
      </div>
      <div class="actions">
        <button class="btn" id="alertOk">OK</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Helpers =====
    const $  = (s)=>document.querySelector(s);
    const $$ = (s)=>Array.from(document.querySelectorAll(s));
    const pad=(n)=>String(n).padStart(2,'0');
    const toISO=(local)=>{
      const d=new Date(local);
      const off=-d.getTimezoneOffset();
      const sign=off>=0?'+':'-';
      const a=Math.abs(off);
      return local+`${sign}${pad(Math.floor(a/60))}:${pad(a%60)}`;
    };
    const uuid=()=> (crypto.randomUUID?.() || ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
    const randKey=(n=16)=>{
      const a=new Uint8Array(n);
      crypto.getRandomValues(a);
      return [...a].map(x=>x.toString(16).padStart(2,'0')).join('');
    };

    // ===== Storage =====
    const S='meetups-store', O='meetups-owners';
    const readStore =()=>JSON.parse(localStorage.getItem(S)||'[]');
    const writeStore=(arr)=>localStorage.setItem(S,JSON.stringify(arr));
    const readOwners=()=>JSON.parse(localStorage.getItem(O)||'{}');
    const writeOwners=(map)=>localStorage.setItem(O,JSON.stringify(map));
    const isOwner   =(roomId)=>Boolean(readOwners()[roomId]);

    const REGISTRY_API = 'https://do-chat.awachima7.workers.dev/api/rooms';
    const NEGATIVE_LIMIT_MS = 20*60*1000;

    // ===== タイマー & 自動削除 =====
    function autoDeleteRoom(roomId){
      if (!roomId) return;
      const remain = readStore().filter(x=>x.roomId!==roomId);
      writeStore(remain);
      const owners = readOwners(); delete owners[roomId]; writeOwners(owners);
      const c = document.querySelector(`.card[data-room-id="${roomId}"]`);
      if (c) c.remove();
      console.info('[auto-delete]', roomId, 'deleted (20 minutes after start)');
    }

    function initCountdown(card){
      const start = new Date(card.dataset.start);
      const el    = card.querySelector('[data-countdown]');
      const label = 'Starts in';
      const roomId = card.dataset.roomId || '';
      const expireAt = new Date(start.getTime() + NEGATIVE_LIMIT_MS);

      const tick = ()=>{
        const now  = new Date();
        const diff = start - now;
        if (diff > 0){
          const h=Math.floor(diff/3600000),
                m=Math.floor(diff/60000)%60,
                s=Math.floor(diff/1000)%60;
          if (el) el.textContent = `${label}: ${pad(h)}:${pad(m)}:${pad(s)}`;
          requestAnimationFrame(tick);
          return;
        }
        const remainMs = expireAt - now;
        if (remainMs > 0){
          const remainMin = Math.ceil(remainMs/60000);
          if (el) el.textContent = `Expires in ${pad(remainMin)} min`;
          requestAnimationFrame(tick);
        } else {
          if (el) el.textContent = 'Expired';
          autoDeleteRoom(roomId);
        }
      };
      requestAnimationFrame(tick);
    }

    // ===== カード操作 =====
    function attachEnter(card){
      const btn=card.querySelector('[data-enter]');
      btn.onclick=()=>{
        const p=new URLSearchParams({
          roomId: card.dataset.roomId || '',
          title : card.dataset.title,
          start : card.dataset.start,
          limit : card.dataset.limit,
          target: card.dataset.url
        });
        location.href = `./lobby.html?${p.toString()}`;
      };
    }

    function renderTools(card){
      const roomId=card.dataset.roomId;
      let tools=card.querySelector('.tools');
      if(!tools){
        tools=document.createElement('div');
        tools.className='tools';
        card.appendChild(tools);
      }
      tools.innerHTML='';
      if(roomId && isOwner(roomId)){
        const b=document.createElement('button');
        b.className='btn icon';
        b.title='Edit';
        b.textContent='✎';
        b.onclick=()=>openModal('edit', {
          roomId,
          title: card.dataset.title,
          start: card.dataset.start,
          limit: card.dataset.limit,
          target: card.dataset.url
        });
        tools.appendChild(b);
      }
    }

    function upsertCard(item){
      const grid=$('#grid');
      let card=grid.querySelector(`.card[data-room-id="${item.roomId}"]`);
      if(!card){
        card=document.createElement('article');
        card.className='card';
        card.innerHTML=`
          <div class="title"></div>
          <div class="meta"><span data-countdown>Starts in: --:--:--</span></div>
          <div><a class="btn" data-enter>Enter Lobby</a></div>`;
      }
      card.dataset.roomId=item.roomId;
      card.dataset.title=item.title;
      card.querySelector('.title').textContent=item.title;
      card.dataset.start=item.start;
      card.dataset.url=item.target;
      card.dataset.limit=item.limit;

      if (card.parentElement !== grid) grid.prepend(card);
      initCountdown(card);
      attachEnter(card);
      renderTools(card);
    }

    function persist(item){
      const arr=readStore().filter(x=>x.roomId!==item.roomId);
      arr.unshift(item);
      writeStore(arr.slice(0,100));
    }

    function restore(){
      $$('.card').forEach(c=>{
        initCountdown(c);
        attachEnter(c);
        renderTools(c);
      });
      readStore().forEach(upsertCard);
    }

    // ===== モーダル =====
    const backdrop=$('#backdrop');
    const modalTitle=$('#modalTitle');
    const mTitle=$('#mTitle'), mLimit=$('#mLimit'), mStart=$('#mStart'), mTarget=$('#mTarget');
    const mStartFallback = $('#mStartFallback');
    const mMonth = $('#mMonth'), mDay = $('#mDay'), mHour = $('#mHour'), mMinute = $('#mMinute');
    const statusMsg=$('#statusMsg');
    const submit=$('#submit'), duplicate=$('#duplicate'), delBtn=$('#delete');

    // Quest / datetime-local 非対応検出
    const isQuest = /\b(OculusBrowser|Meta Quest Browser|MetaQuestBrowser|Quest)\b/i.test(navigator.userAgent);
    function supportsDateTimeLocal(){
      const i=document.createElement('input');
      i.setAttribute('type','datetime-local');
      return i.type === 'datetime-local';
    }
    const useFallback = isQuest || !supportsDateTimeLocal();

    // フォールバック用（セレクト）の年情報
    let fallbackYear = new Date().getFullYear();

    function daysInMonth(year, month){
      // month: 1〜12
      return new Date(year, month, 0).getDate();
    }

    function populateDateSelects(){
      if (!mMonth || !mDay || !mHour || !mMinute) return;

      if (!mMonth.options.length){
        for (let i=1;i<=12;i++){
          const opt=document.createElement('option');
          opt.value=String(i);
          opt.textContent=String(i);
          mMonth.appendChild(opt);
        }
      }
      if (!mHour.options.length){
        for (let h=0;h<24;h++){
          const opt=document.createElement('option');
          opt.value=String(h);
          opt.textContent=pad(h);
          mHour.appendChild(opt);
        }
      }
      if (!mMinute.options.length){
        for (let m=0;m<60;m+=10){
          const opt=document.createElement('option');
          opt.value=String(m);
          opt.textContent=pad(m);
          mMinute.appendChild(opt);
        }
      }
    }

    function updateDayOptions(year, month, currentDay){
      if (!mDay) return;
      const maxDay = daysInMonth(year, month || 1);
      const prev = currentDay || parseInt(mDay.value || '1',10) || 1;

      while (mDay.firstChild){
        mDay.removeChild(mDay.firstChild);
      }
      for (let d=1; d<=maxDay; d++){
        const opt=document.createElement('option');
        opt.value=String(d);
        opt.textContent=String(d);
        mDay.appendChild(opt);
      }
      const clamped = Math.min(prev, maxDay);
      mDay.value = String(clamped);
    }

    function initStartInput(){
      const now=new Date(); 
      now.setMinutes(now.getMinutes()+30); 
      now.setSeconds(0,0);
      const yyyy=now.getFullYear(), mm=pad(now.getMonth()+1), dd=pad(now.getDate());
      const hh=pad(now.getHours()), mi=pad(now.getMinutes());

      if (useFallback){
        // Quest 等: 月/日/時/分 セレクトを使用
        mStart.style.display='none';
        mStartFallback.style.display='grid';

        fallbackYear = now.getFullYear();
        populateDateSelects();

        const monthNum = now.getMonth()+1;
        const dayNum   = now.getDate();
        const hourNum  = now.getHours();
        let minuteNum  = now.getMinutes();
        minuteNum = Math.ceil(minuteNum / 10) * 10;
        if (minuteNum >= 60) minuteNum = 50;

        mMonth.value = String(monthNum);
        updateDayOptions(fallbackYear, monthNum, dayNum);
        mHour.value = String(hourNum);
        mMinute.value = String(minuteNum);
      }else{
        // PC など: datetime-local を使用
        mStart.style.display='';
        mStartFallback.style.display='none';
        mStart.value=`${yyyy}-${mm}-${dd}T${hh}:${mi}`;
      }
    }

    let mode='create';
    let editingRoomId=null;
    let editingTarget=null;

    function openModal(m='create', payload=null){
      mode=m; 
      statusMsg.style.display='none'; 
      statusMsg.textContent='';

      if(m==='create'){
        modalTitle.textContent='Create meetup';
        submit.textContent='Create meetup';
        duplicate.style.display='none';
        delBtn.style.display='none';
        mTarget.disabled=false;
        mTitle.value=''; 
        mLimit.value='10'; 
        mTarget.value='';
        editingRoomId=null; 
        editingTarget=null;
        initStartInput();
      }else{
        const owners=readOwners();
        if(!payload || !owners[payload.roomId]){ 
          alert('You do not have permission to edit this room on this device'); 
          return; 
        }
        modalTitle.textContent='Edit meetup';
        submit.textContent='Update';
        duplicate.style.display='inline-block';
        delBtn.style.display='inline-block';
        mTarget.disabled=true;
        editingRoomId=payload.roomId; 
        editingTarget=payload.target;
        mTitle.value=payload.title||''; 
        mLimit.value=String(payload.limit||'10');

        const d = new Date(payload.start||Date.now());
        if (useFallback){
          // セレクト版
          mStart.style.display='none';
          mStartFallback.style.display='grid';

          fallbackYear = d.getFullYear();
          populateDateSelects();

          const monthNum = d.getMonth()+1;
          const dayNum   = d.getDate();
          const hourNum  = d.getHours();
          let minuteNum  = d.getMinutes();
          minuteNum = Math.floor(minuteNum / 10) * 10;
          if (minuteNum >= 60) minuteNum = 50;

          mMonth.value = String(monthNum);
          updateDayOptions(fallbackYear, monthNum, dayNum);
          mHour.value = String(hourNum);
          mMinute.value = String(minuteNum);
        }else{
          // datetime-local 版
          mStart.style.display='';
          mStartFallback.style.display='none';
          mStart.value=(payload.start||'').slice(0,16);
        }
        mTarget.value=payload.target||'';
      }
      backdrop.style.display='flex';
    }
    function closeModal(){ backdrop.style.display='none'; }

    // ===== カスタムアラート =====
    const alertBackdrop = $('#alertBackdrop');
    const alertClose = $('#alertClose');
    const alertOk = $('#alertOk');
    function showUrlAlert(){
      if(alertBackdrop){ alertBackdrop.style.display='flex'; }
    }
    function hideUrlAlert(){
      if(alertBackdrop){ alertBackdrop.style.display='none'; }
    }
    if(alertClose) alertClose.onclick = hideUrlAlert;
    if(alertOk) alertOk.onclick = hideUrlAlert;

    async function postRegistry(item){
      try{
        const owner = localStorage.getItem('nickname') || null;
        const ownerKey = readOwners()[item.roomId] || null;
        await fetch(REGISTRY_API, {
          method: "POST",
          headers: {"content-type":"application/json"},
          body: JSON.stringify({ roomId: item.roomId, title: item.title, start: item.start, limit: item.limit, target: item.target, owner, ownerKey })
        });
      }catch(e){ console.warn('[registry]', e); }
    }

    /**
     * 日時の組み立て
     * - PC: datetime-local の値をそのまま使う
     * - Quest 等: 年 + セレクト（月/日/時/分）から組み立てる
     * さらに、
     * - 「現在より過去」の日時の場合は、自動的に「翌年の同じ月日・時刻」に繰り上げる
     */
    function composeStartISO(){
      const now = new Date();

      if (!useFallback){
        if (!mStart.value) return '';

        // mStart.value は "YYYY-MM-DDTHH:mm"
        const base = new Date(mStart.value);
        if (isNaN(base.getTime())) return '';

        // 過去なら翌年に繰り上げ
        if (base < now){
          base.setFullYear(base.getFullYear() + 1);
        }

        const y  = base.getFullYear();
        const mo = pad(base.getMonth() + 1);
        const d  = pad(base.getDate());
        const h  = pad(base.getHours());
        const mi = pad(base.getMinutes());
        const localFixed = `${y}-${mo}-${d}T${h}:${mi}`;
        return toISO(localFixed);
      }

      // フォールバック（Quest 等）の場合：
      // fallbackYear + セレクトから Date を作り、過去なら翌年に繰り上げ
      const baseYear = fallbackYear || now.getFullYear();
      let month = parseInt(mMonth.value || '0', 10) || 1;
      let day   = parseInt(mDay.value   || '0', 10) || 1;
      let hour  = parseInt(mHour.value  || '0', 10) || 0;
      let min   = parseInt(mMinute.value|| '0', 10) || 0;

      // 月・日を一応 1〜12 / 1〜31 の範囲にクリップしてから Date を作成
      month = Math.min(Math.max(month, 1), 12);
      day   = Math.min(Math.max(day,   1), 31);

      let dObj = new Date(baseYear, month - 1, day, hour, min);
      if (isNaN(dObj.getTime())) return '';

      // 過去なら翌年に繰り上げ
      if (dObj < now){
        dObj.setFullYear(dObj.getFullYear() + 1);
      }

      const y2  = dObj.getFullYear();
      const mo2 = pad(dObj.getMonth() + 1);
      const d2  = pad(dObj.getDate());
      const h2  = dObj.getHours().toString().padStart(2,'0');
      const mi2 = dObj.getMinutes().toString().padStart(2,'0');

      return toISO(`${y2}-${mo2}-${d2}T${h2}:${mi2}`);
    }

    async function onSubmit(){
      const owners=readOwners();
      let roomId=editingRoomId, target=editingTarget;
      const title=(mTitle.value||'Meetup').trim();
      const limit=parseInt(mLimit.value,10)||10;

      const startISO = composeStartISO();
      if(!startISO){ alert('Please enter the meeting time.'); return; }

      if(mode==='create'){
        target=(mTarget.value||'').trim();

        /* dokodemodoors 以外は不可 → ポップアップ表示して中断 */
        if (!target.toLowerCase().startsWith('https://dokodemoors.com/')) {
          showUrlAlert();
          return;
        }

        roomId=uuid();
        const ownersMap=readOwners();
        ownersMap[roomId]=randKey();
        writeOwners(ownersMap);
      }

      const prev = readStore().find(x=>x.roomId===roomId);
      const nowIso = new Date().toISOString();
      const item={
        roomId,
        title,
        start: startISO,
        limit: String(limit),
        target,
        updatedAt: nowIso,
        createdAt: prev?.createdAt || nowIso
      };

      upsertCard(item);
      persist(item);
      postRegistry(item);

      statusMsg.textContent = (mode==='create') ? 'Created' : 'Updated';
      statusMsg.style.display = 'block';
    }

    function onDuplicate(){
      if(!editingRoomId) return;
      const owners=readOwners();
      const newId=uuid();
      owners[newId]=randKey();
      writeOwners(owners);

      const startISO = composeStartISO() || new Date().toISOString();
      const nowIso = new Date().toISOString();
      const item={
        roomId:newId,
        title:(mTitle.value||'Meetup').trim(),
        start:startISO,
        limit:String(parseInt(mLimit.value,10)||10),
        target:editingTarget,
        updatedAt:nowIso,
        createdAt:nowIso
      };
      upsertCard(item);
      persist(item);
      postRegistry(item);
      alert('Duplicated. The destination URL is the same as the original.');
    }

    async function onDelete(){
      if(!editingRoomId) return;
      try{
        const ownerKey = readOwners()[editingRoomId];
        if (!ownerKey){
          alert("Owner information is missing on this device, so the room cannot be deleted.");
          return;
        }
        const res = await fetch(REGISTRY_API, {
          method:"DELETE",
          headers:{"content-type":"application/json"},
          body:JSON.stringify({ roomId: editingRoomId, ownerKey })
        });
        if (!res.ok){
          const data = await res.json().catch(()=>({}));
          alert(`Failed to delete: ${data.error || res.statusText}`);
          return;
        }
      }catch(e){
        alert("An error occurred while connecting to the server.");
        console.warn('[registry DELETE]', e);
        return;
      }
      autoDeleteRoom(editingRoomId);
      closeModal();
    }

    // ===== 初期化 =====
    restore();
    // 月変更時に日付の上限を月に合わせてクランプ
    if (mMonth && mDay){
      mMonth.addEventListener('change', ()=>{
        const year = fallbackYear || new Date().getFullYear();
        const currentDay = parseInt(mDay.value || '1',10) || 1;
        const monthNum   = parseInt(mMonth.value || '1',10) || 1;
        updateDayOptions(year, monthNum, currentDay);
      });
    }

    // タイトル右の作成ボタン
    const oc = document.getElementById('openCreate');
    if (oc) oc.onclick = () => openModal('create');

    // 読み込み直後は確実に非表示（チラ見え対策）
    closeModal();

    document.getElementById('close').onclick=closeModal;
    document.getElementById('close2').onclick=closeModal;
    document.getElementById('submit').onclick=onSubmit;
    document.getElementById('duplicate').onclick=onDuplicate;
    document.getElementById('delete').onclick=onDelete;

    // 共有部屋一覧の読み込み
    async function loadShared(){
      try{
        const res = await fetch(REGISTRY_API);
        const j = await res.json();
        if (j && j.ok && Array.isArray(j.rooms)){
          const remoteRoomIds = new Set(j.rooms.map(r=>r.roomId));
          document.querySelectorAll('#grid .card').forEach(card=>{
            const roomId = card.dataset.roomId;
            if (roomId && !remoteRoomIds.has(roomId)) card.remove();
          });
          j.rooms.forEach(upsertCard);
        }
      }catch(e){
        console.warn('[registry GET]', e);
      }
    }
    loadShared();
    setInterval(loadShared, 30000);

    // （将来用）管理者パスワード関連
    const ADMIN_HASH="27362e4fcff362576da78138fe5383a75fe64f66dcfd1e7b9e850504b845a5f4";
    function toHex(buf){return[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");}
    async function sha256(s){const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));return toHex(buf);}
    function subtleEqual(a,b){if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0;}
  </script>
