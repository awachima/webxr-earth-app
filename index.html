<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dokodemo Doors Fan Site</title>

  <!--（中略：CSS・既存UIは一切変更していません）-->

</head>
<body>
  <!--（中略：HTML構造はそのまま）-->

  <script>
  (function(){
    // =====================================================
    // Tag Filter (Tree from Google Sheets CSV)
    // =====================================================

    const STORAGE_KEY = 'dd_selected_tags_v1';

    // ★ 正式な tree データソース（Google Sheets / CSV）
    const TREE_CSV_URL =
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxY1OEEnEqJi1gK6D156ql0Ybe5Hqsn-mrAmvC3p98oRYYdXFNTjUY3-SMNgusPHqowztL3aAF3COl/pub?gid=0&single=true&output=csv';

    const btn       = document.getElementById('tagFilterBtn');
    const badge    = document.getElementById('tagFilterCount');
    const backdrop = document.getElementById('tagFilterBackdrop');
    const closeBtn = document.getElementById('tagFilterClose');
    const applyBtn = document.getElementById('tagFilterApply');
    const clearBtn = document.getElementById('tagFilterClear');
    const colsRoot = document.getElementById('tagFilterColumns');
    const iframe   = document.getElementById('webxr-iframe');

    if (!btn || !backdrop || !applyBtn || !colsRoot || !iframe) return;

    let tree = null;
    let nodesById = new Map();
    let selected = new Set();
    let activePath = [];

    // ---------- CSV ----------
    function parseCSV(text){
      const lines = text.replace(/\r/g,'').split('\n').filter(l => l.trim());
      return lines.map(line => {
        let res = [], cur = '', q = false;
        for (let c of line){
          if (c === '"'){ q = !q; continue; }
          if (c === ',' && !q){ res.push(cur.trim()); cur=''; }
          else cur += c;
        }
        res.push(cur.trim());
        return res;
      });
    }

    function makeNode(id,label,parent){
      return { id, label, parent, children:new Map() };
    }

    function buildTree(rows){
      const header = rows[0];
      const levelIdx = header.map((h,i)=>/^level/i.test(h)?i:null).filter(i=>i!==null);
      const root = makeNode('__root__','(root)',null);

      function getChild(p,label){
        if(!p.children.has(label)){
          const id = p.id==='__root__'?label:`${p.id}/${label}`;
          const n = makeNode(id,label,p.id);
          p.children.set(label,n);
          nodesById.set(id,n);
        }
        return p.children.get(label);
      }

      for(let i=1;i<rows.length;i++){
        let p=root;
        for(let idx of levelIdx){
          const v=(rows[i][idx]||'').trim();
          if(!v) continue;
          p=getChild(p,v);
        }
      }
      return root;
    }

    // ---------- UI ----------
    function render(){
      colsRoot.innerHTML='';
      const cols=[{title:'カテゴリ',node:tree}];
      for(const id of activePath){
        const n=nodesById.get(id);
        if(n && n.children.size) cols.push({title:n.label,node:n});
      }

      for(let i=0;i<cols.length;i++){
        const col=document.createElement('div');
        col.className='tag-filter-col';
        col.innerHTML=`<div class="tag-filter-col-title">${cols[i].title}</div>`;

        for(const n of [...cols[i].node.children.values()].sort((a,b)=>a.label.localeCompare(b.label,'ja'))){
          const row=document.createElement('div');
          row.className='tag-item';

          const cb=document.createElement('input');
          cb.type='checkbox';
          cb.checked=selected.has(n.id);
          cb.onclick=e=>{
            e.stopPropagation();
            if(cb.checked) selectAll(n);
            else deselectAll(n);
            render();
          };

          row.append(cb,document.createTextNode(n.label));
          row.onclick=()=>{
            activePath=activePath.slice(0,i);
            activePath[i]=n.id;
            render();
          };
          col.appendChild(row);
        }
        colsRoot.appendChild(col);
      }
      badge.textContent=`(${selected.size})`;
    }

    function collect(n,arr=[]){
      arr.push(n.id);
      for(const c of n.children.values()) collect(c,arr);
      return arr;
    }
    function selectAll(n){ collect(n).forEach(id=>selected.add(id)); }
    function deselectAll(n){ collect(n).forEach(id=>selected.delete(id)); }

    // ---------- Messaging ----------
    applyBtn.onclick=()=>{
      const tags=[...selected].map(id=>nodesById.get(id)?.label).filter(Boolean);
      iframe.contentWindow.postMessage({type:'dd-tags-apply',tags},'*');
      backdrop.classList.remove('open');
    };
    clearBtn.onclick=()=>{ selected.clear(); render(); };
    btn.onclick=()=>{ backdrop.classList.add('open'); render(); };
    closeBtn.onclick=()=> backdrop.classList.remove('open');

    // ---------- Init ----------
    fetch(TREE_CSV_URL)
      .then(r=>r.text())
      .then(csv=>{
        nodesById.clear();
        tree=buildTree(parseCSV(csv));
        render();
      })
      .catch(e=>{
        console.error('tree CSV load failed',e);
      });

  })();
  </script>
</body>
</html>
