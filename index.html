<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dokodemo Doors Fan Site</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       Tag Filter Modal 専用スタイル
       （※他モーダルの.backdropを壊さないためスコープ限定）
       ===================================================== */

    #tagFilterBackdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      padding: 0;
      overflow: hidden;
      z-index: 10000;
    }

    #tagFilterBackdrop.open{
      display: block;
    }

    .tag-filter-modal{
      position: fixed;
      top: 0;
      left: 0;
      margin: 0;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      border-radius: 14px;

      width: min(852px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);

      min-height: 440px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tag-filter-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .tag-filter-title{
      font-weight: 700;
      font-size: 16px;
    }

    .tag-filter-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .tag-filter-actions button{
      border: 1px solid rgba(0,0,0,0.14);
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .tag-filter-actions button.primary{
      background:#0B3559;
      color:#fff;
      border-color:#0B3559;
    }

    .tag-filter-body{
      display:flex;
      flex:1;
      min-height: 0;
    }

    .columns{
      display:flex;
      flex:1;
      min-width:0;
      overflow:auto;
      padding: 12px 14px 14px;
      gap: 14px;
    }

    .column{
      flex: 0 0 260px;
      width: 260px;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 10px 10px;
      background: rgba(255,255,255,0.96);
      min-height: 300px;
    }

    .column h3{
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 700;
    }

    .node{
      display:flex;
      align-items:flex-start;
      gap: 8px;
      padding: 6px 6px;
      border-radius: 10px;
      cursor: pointer;
    }

    .node:hover{
      background: rgba(0,0,0,0.04);
    }

    .node .label{
      line-height: 1.25;
      font-size: 13px;
    }

    .node .chev{
      margin-left:auto;
      opacity: 0.55;
    }

    .tag-filter-footer{
      padding: 10px 14px;
      border-top: 1px solid rgba(0,0,0,0.08);
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="lang-switch">
        <button class="lang-switch__toggle" id="langToggle" type="button">Language</button>
        <div class="lang-switch__menu" id="langMenu" style="display:none;">
          <button type="button" data-lang="ja">日本語</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="hi">हिन्दी</button>
          <button type="button" data-lang="he">עברית</button>
          <button type="button" data-lang="fa">فارسی</button>
        </div>
      </div>

      <h1 class="brand-logo-text" id="siteTitle">Dokodemo Doors Fan Site</h1>
    </header>

    <main class="stage">
      <img class="site-logo" src="./assets/fansitelogo.png" alt="logo" />

      <div class="intro-bar">
        <button class="intro-bar__button" id="aboutBtn" type="button">どこでもドアとは？</button>
        <button class="intro-bar__button" id="guideBtn" type="button">このファンサイトとは？</button>
      </div>

      <section class="earth-frame-wrap">
        <iframe id="webxr-iframe" src="./earth.html"></iframe>

        <button class="btn tag-filter-btn" id="tagFilterBtn" type="button">
          <span id="tagFilterCount"></span>
        </button>

        <button class="tourist-info-btn" id="touristInfoBtn" type="button"></button>
      </section>

      <section class="meetups" id="meetupsSection">
        <div class="meetups__head">
          <h2 class="meetups__title">待合室</h2>
          <button class="btn head-create" id="openCreate" type="button">作成</button>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <!-- About Modal -->
      <div class="backdrop" id="aboutBackdrop">
        <div class="modal">
          <header>
            <strong>どこでもドアとは？</strong>
            <button class="close" id="aboutClose">×</button>
          </header>
          <div class="body" id="aboutBody"></div>
          <div class="actions">
            <button class="btn primary" id="aboutOk">OK</button>
          </div>
        </div>
      </div>

      <!-- Guide Modal -->
      <div class="backdrop" id="guideBackdrop">
        <div class="modal">
          <header>
            <strong>このファンサイトとは？</strong>
            <button class="close" id="guideClose">×</button>
          </header>
          <div class="body" id="guideBody"></div>
          <div class="actions">
            <button class="btn primary" id="guideOk">OK</button>
          </div>
        </div>
      </div>

      <!-- Create / Edit Modal -->
      <div class="backdrop" id="backdrop">
        <div class="modal">
          <header>
            <strong id="modalTitle">待合室を作成</strong>
            <button class="close" id="close">×</button>
          </header>

          <div class="body">
            <div class="status" id="status"></div>

            <div class="form">
              <div>
                <label for="title">タイトル</label>
                <input id="title" type="text" maxlength="60" />
              </div>

              <div>
                <label for="url">ツアーURL</label>
                <input id="url" type="url" />
              </div>

              <div>
                <label for="startAt">開始時刻</label>
                <input id="startAt" type="datetime-local" />
              </div>

              <div>
                <label for="maxPeople">参加人数（上限）</label>
                <select id="maxPeople">
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                </select>
              </div>

              <div>
                <label for="eventType">イベント形式</label>
                <select id="eventType">
                  <option value="free">無料</option>
                  <option value="paid">有料</option>
                </select>
              </div>

              <div>
                <label for="price">価格（有料時）</label>
                <input id="price" type="text" placeholder="例：500円" />
              </div>
            </div>

            <div class="note" id="noteText"></div>
          </div>

          <div class="actions">
            <button class="btn danger" id="delete">削除</button>
            <button class="btn" id="duplicate">複製</button>
            <button class="btn primary" id="submit">作成</button>
          </div>
        </div>
      </div>

      <!-- Tag Filter Modal -->
      <div class="backdrop" id="tagFilterBackdrop">
        <div class="modal tag-filter-modal">
          <div class="tag-filter-header">
            <div class="tag-filter-title">絞り込み</div>
            <div class="tag-filter-actions">
              <button id="tagFilterClear">クリア</button>
              <button class="primary" id="tagFilterApply">適用</button>
              <button id="tagFilterClose">×</button>
            </div>
          </div>

          <div class="tag-filter-body">
            <div class="columns" id="tagColumns"></div>
          </div>

          <div class="tag-filter-footer"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="tagfilter.js"></script>
  <script src="main.js"></script>
</body>
</html>
