<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Dokodemo Doors Fan Site</title>
<link href="./styles.css" rel="stylesheet"/>
<link crossorigin="anonymous" href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="anonymous" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap" rel="stylesheet"/>
<style>
    /* ===== Tag filter UI (multi-column) ===== */
.tag-filter-btn{
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.10);
      cursor: pointer;
      font: inherit;
    }
.tag-filter-count{ opacity: 0.8; }

    /* ★ 3カラム(260px×3) + gap(10px×2) + padding(8px×2) = 852px でピッタリ */
    .tag-filter-modal{
      width: min(852px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
    }

    .tag-filter-toolbar{
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 10px;
    }

    .tag-filter-columns{
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      min-height: 420px;
    }

    .tag-filter-col{
      border: 1px solid rgba(0,0,0,0.10);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(250,250,250,0.9);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .tag-filter-col-title{
      padding: 10px 10px;
      font-weight: 700;
      font-size: 13px;
      background: rgba(255,255,255,0.95);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .tag-item{
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      cursor: pointer;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      background: transparent;
      user-select: none;
      min-width: 0;
    }
    .tag-item:last-child{ border-bottom: 0; }
    .tag-item:hover{ background: rgba(50,112,166,0.10); }
    .tag-item.active{ background: rgba(50,112,166,0.14); }
    .tag-item input{ width: 16px; height: 16px; }
    .tag-item label{
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    /* モーダル内のヘッダーが既存headerと衝突しないよう最小 */
    .tag-filter-modal header{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .tag-filter-modal header #tagFilterTitle{
      font-weight: 800;
      font-size: 16px;
    }
    .tag-filter-modal header .close{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.12);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor: pointer;
      background: rgba(255,255,255,0.92);
    }
    .tag-filter-modal .body{
      padding: 12px;
      overflow: auto;
      background: #fff;
    }

    .tag-filter-modal .btn{
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.92);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font: inherit;
    }
    .tag-filter-modal .btn.primary{
      background: rgba(50,112,166,0.95);
      color: #fff;
      border-color: rgba(50,112,166,0.95);
    }

    /* backdrop（既存のものに合わせたまま） */
    .backdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 18px;
    }
    .backdrop.open{ display:flex; }

    @media (max-width: 900px){
      .tag-filter-columns{ grid-template-columns: 1fr; }
    }

    /* ===== iFrame wrapper (button overlay) ===== */
    .earth-frame-wrap{
      position: relative;
      width: 100%;
    }
    #webxr-iframe{
      display: block;
      width: 100% !important;
      aspect-ratio: 16 / 9;
      border: 0;
      background: #000;
    }
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand-logo-text">Dokodemo Doors Fan Site</div>
<div class="lang-switch">
<button class="lang-switch__toggle" id="langToggle" type="button">Language</button>
<div class="lang-switch__menu" hidden="" id="langMenu">
<button data-lang="en" type="button">English</button>
<button data-lang="ja" type="button">日本語</button>
<button data-lang="zh" type="button">中文</button>
<button data-lang="fa" type="button">فارسی</button>
<button data-lang="hi" type="button">हिन्दी</button>
<button data-lang="he" type="button">עברית</button>
</div>
</div>
</header>
<!-- Tag filter modal -->
<div aria-hidden="true" class="backdrop" id="tagFilterBackdrop">
<div aria-describedby="tagFilterBody" aria-labelledby="tagFilterTitle" class="modal tag-filter-modal" role="dialog">
<header>
<div id="tagFilterTitle">絞り込み</div>
<div aria-label="Close" class="close" id="tagFilterClose">×</div>
</header>
<div class="body" id="tagFilterBody">
<div class="tag-filter-toolbar">
<button aria-hidden="true" class="btn" id="tagFilterSelectAll" style="display:none" tabindex="-1" type="button">全て選択</button>
<button class="btn" id="tagFilterClear" type="button">クリア</button>
<button class="btn primary" id="tagFilterApply" type="button">適用</button>
</div>
<div aria-label="Tag tree" class="tag-filter-columns" id="tagFilterColumns"></div>
</div>
</div>
</div>
<div class="stage">
<img alt="Logo" class="site-logo" src="./assets/jp-mobile-new.fffa2967.png"/>
<!-- 白線の下に表示するボタン群 -->
<div class="intro-bar">
<button class="intro-bar__button" id="aboutBtn" type="button">
          What is Dokodemo Doors?
        </button>
<button class="intro-bar__button" id="guideBtn" type="button">
          What is this fan site?
        </button>
</div>

<!-- ★ ここで iframe を包んで、その上にボタンを重ねる -->
<div class="earth-frame-wrap">
<button aria-controls="tagFilterBackdrop" aria-haspopup="dialog" class="tag-filter-btn" id="tagFilterBtn" type="button">
      絞り込み <span class="tag-filter-count" id="tagFilterCount">(0)</span>
</button>
<iframe allow="xr-spatial-tracking; fullscreen" id="webxr-iframe" scrolling="no" src="./earth.html" title="WebXR Earth"></iframe>
</div>
</div>

<section id="recommendSection">
<div class="recommend-card">
<div class="recommend-header">
<img alt="Lucy" class="recommend-avatar" src="./assets/lucy.png"/>
<div class="recommend-headtext">
<div class="recommend-name">Lucy</div>
<div class="recommend-sub">AI tour recommendations</div>
</div>
</div>

<label class="recommend-label" for="tourInput">Tell Lucy what you want to experience</label>
<textarea id="tourInput" placeholder="e.g. I want to see famous ruins and temples in South America..." rows="3"></textarea>

<div class="recommend-actions">
<button class="btn primary" id="askLucyBtn" type="button">Ask Lucy</button>
<div id="lucyStatus"></div>
</div>

<div id="lucyAnswer"></div>
</div>
</section>
</div>

<script src="./tagfilter.js"></script>

<script>
(function(){
  const toggle = document.getElementById('langToggle');
  const menu = document.getElementById('langMenu');
  if(toggle && menu){
    toggle.addEventListener('click', ()=>{
      if(menu.hasAttribute('hidden')) menu.removeAttribute('hidden');
      else menu.setAttribute('hidden','');
    });
    document.addEventListener('click', (e)=>{
      if(!menu.contains(e.target) && !toggle.contains(e.target)){
        menu.setAttribute('hidden','');
      }
    });
    menu.querySelectorAll('button[data-lang]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const lang = btn.getAttribute('data-lang');
        try{ localStorage.setItem('dd_lang', lang); }catch(_){}
        menu.setAttribute('hidden','');
        location.reload();
      });
    });
  }
})();
</script>
</body>
</html>
