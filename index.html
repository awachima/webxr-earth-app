<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dokodemo Doors Fan Site</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <script>
    (function(){
      const LANG_KEYS = [
        "lang",
        "dd_lang",
        "language",
        "ddLang",
        "ddLanguage",
        "selectedLang",
        "selectedLanguage",
        "i18n_lang",
        "i18nextLng"
      ];

      function safeGet(k){
        try { return localStorage.getItem(k); } catch(_) { return null; }
      }
      function safeSet(k,v){
        try { localStorage.setItem(k, v); } catch(_) {}
      }
      function normalizeLang(v){
        if(!v) return null;
        const s = String(v).trim();
        if(!s) return null;
        const low = s.toLowerCase();
        const allow = ["ja","en","zh","fa","hi","he"];
        if(allow.includes(low)) return low;
        const base = low.split("-")[0];
        if(allow.includes(base)) return base;
        return low;
      }

      let picked = null;
      for(const k of LANG_KEYS){
        const v = normalizeLang(safeGet(k));
        if(v){ picked = v; break; }
      }

      if(!picked){
        const htmlLang = normalizeLang(document.documentElement.getAttribute("lang"));
        if(htmlLang) picked = htmlLang;
      }
      if(!picked){
        const nav = normalizeLang(navigator.language || navigator.userLanguage);
        picked = nav || "ja";
      }

      for(const k of LANG_KEYS){
        safeSet(k, picked);
      }

      document.documentElement.setAttribute("lang", picked);
      window.__DD_LANG = picked;
    })();
  </script>

  <style>

    /* ===== Earth frame: rounded corners cleanup ===== */
    #earthFrameWrap{
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
    }

    #webxr-iframe{
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ===== Tag filter UI (multi-column) ===== */
    .tag-filter-btn{
      position: fixed;
      top: 76px;
      left: 18px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.10);
      cursor: pointer;
      font: inherit;
    }
    .tag-filter-count{ opacity: 0.8; }

    .tag-filter-modal{
      width: min(920px, calc(100vw - 32px));
      min-width: 780px;
      max-width: none;
    }

    .tag-filter-toolbar{
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .tag-filter-spacer{ flex: 1; }

    .tag-filter-columns{
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      gap: 10px;
      height: min(70vh, 620px);
      overflow: auto;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.65);
    }
    .tag-filter-col{
      flex: 1 1 0;
      min-width: 0;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.85);
      padding: 10px;
      overflow: auto;
    }
    .tag-filter-col-title{
      font-weight: 700;
      font-size: 13px;
      opacity: 0.8;
      margin: 0 0 8px 0;
    }
    .tag-item{
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }
    .tag-item:hover{ background: rgba(0,0,0,0.05); }
    .tag-item.active{ background: rgba(50,112,166,0.12); }
    .tag-item label{
      flex: 1;
      cursor: pointer;
    }
    .tag-item input[type="checkbox"]{
      width: 18px;
      height: 18px;
      accent-color: #3270A6;
      cursor: pointer;
    }

    #tagFilterBackdrop{ z-index: 10000; }

    .backdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      padding: 0;
      overflow: hidden;
    }

    #tagFilterBackdrop.backdrop{
      overflow-x: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .backdrop.open{ display:block; }

    .tag-filter-modal{
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      border-radius: 14px;

      width: 920px;
      min-width: 780px;
      max-width: none;

      min-height: 440px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tag-filter-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .tag-filter-title{
      font-weight: 700;
      font-size: 16px;
    }
    .tag-filter-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .tag-filter-actions button{
      border: 1px solid rgba(0,0,0,0.14);
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }
    .tag-filter-actions button.primary{
      background:#0B3559;
      color:#fff;
      border-color:#0B3559;
    }

    .tag-filter-body{
      display:flex;
      flex:1;
      min-height: 0;
    }

    .columns{
      display:flex;
      flex:1;
      min-width:0;
      overflow:auto;
      padding: 12px 14px 14px;
      gap: 14px;
    }
    .column{
      flex: 1 1 0;
      min-width: 0;

      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 10px 10px;
      background: rgba(255,255,255,0.96);

      min-height: 360px;
      overflow: auto;
    }
    .column h3{
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 700;
    }
    .node{
      display:flex;
      align-items:flex-start;
      gap: 8px;
      padding: 6px 6px;
      border-radius: 10px;
      cursor: pointer;
    }
    .node:hover{ background: rgba(0,0,0,0.04); }
    .node .label{
      line-height: 1.25;
      font-size: 13px;
    }
    .node .chev{
      margin-left:auto;
      opacity: 0.55;
    }

    .tag-filter-footer{
      padding: 10px 14px;
      border-top: 1px solid rgba(0,0,0,0.08);
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }

    .modal.tag-filter-modal > header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .modal.tag-filter-modal > header #tagFilterTitle{
      font-weight: 700;
      font-size: 16px;
    }
    .modal.tag-filter-modal > header .close{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.14);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor: pointer;
      background:#fff;
    }

    .panel-close{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.14);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor: pointer;
      background:#fff;
      font: inherit;
      line-height: 1;
      color: inherit;
      padding: 0;
      flex: 0 0 auto;
    }
    .modal.tag-filter-modal .body{
      padding: 12px 14px 14px;
    }

    .modal.tag-filter-modal .btn{
      border: 1px solid rgba(0,0,0,0.14);
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font: inherit;
    }
    .modal.tag-filter-modal .btn.primary{
      background:#0B3559;
      color:#fff;
      border-color:#0B3559;
    }

    /* =========================================================
       Lucy chat bubble UI (recommendChat)
       ========================================================= */
    #recommendChat.chat-log{
      margin-bottom:12px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.80);
      height: 30.0em;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .msg-row{
      display: flex;
      margin: 10px 0;
    }
    .msg-row.assistant{ justify-content: flex-start; }
    .msg-row.user{ justify-content: flex-end; }

    .msg-bubble{
      max-width: min(760px, 90%);
      padding: 10px 12px;
      border-radius: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.06);
      background: #fff;
    }

    .msg-row.assistant .msg-bubble{
      background: #f6f7f9;
    }

    .msg-row.user .msg-bubble{
      background: rgba(11,53,89,0.10);
    }

    .msg-meta{
      font-size: 12px;
      opacity: 0.65;
      margin-bottom: 4px;
      user-select: none;
    }
    .msg-row.user .msg-meta{ text-align: right; }

    /* =========================================================
       Waiting Room Toggle Button（アイコン）
       → top-controls__icons のフレックス子要素として配置。
         画面固定（スクロール追従）は親の .top-controls 側で
         sticky 指定するため、ここでは position:static に戻す。
       ========================================================= */
    .waiting-room-btn{
      position:static;
      background:rgba(255,255,255,0.92);
      border:1px solid rgba(0,0,0,0.12);
      border-radius:50%;
      width:48px;
      height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:6px;
      cursor:pointer;
      box-shadow:0 8px 22px rgba(0,0,0,0.18);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      transition:all .18s ease, filter .15s ease;
    }
    .waiting-room-btn:hover{
      transform:scale(1.06);
    }
    .waiting-room-btn img{
      width:34px;
      height:34px;
      display:block;
    }

    /* ON（開いている）時は色反転。main.js側で
       btn.setAttribute('aria-expanded','true'/'false') が
       既にトグルされているのでJS変更は不要。
       絞り込み/観光案内/待合室の3アイコンをまとめて対象にする */
    .top-controls__icons [aria-expanded="true"]{
      filter: invert(1);
      transition: filter .15s ease;
    }

    .meetups.is-collapsed{
      display:none;
    }

    .lucy-panel.is-collapsed{
      display:none !important;
    }

    /* =========================================================
       ヘッダーロゴ
       - どこでもドアのロゴを、ヘッダー内タイトル（h1）の左に配置。
         元々 .brand-logo-text 単体に付いていたレイアウト用の
         margin/max-width/text-align は、ロゴとタイトルをまとめて
         動かせるよう .header-brand（新設のラッパー）側に移し、
         同じ見た目（モバイル：中央寄せ／デスクトップ：左寄せ）を
         ラッパー単位で再現している。
         .header-brand 側は2クラスセレクタで .brand-logo-text 単体
         より詳細度が高くなるので、外部 styles.css 側のmargin指定を
         確実に打ち消せる。 */
    .header-brand{
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 auto;
      margin-top: 4px;
      max-width: calc(100% - 160px);
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    .header-brand .header-logo{
      flex: 0 0 auto;
      display: block;
      height: clamp(24px, 6vw, 36px);
      width: auto;
    }

    .header-brand .brand-logo-text{
      margin: 0;
      max-width: none;
      text-align: left;
    }

    @media (min-width: 1024px){
      .header-brand{
        margin: 0;
        margin-top: 4px;
        margin-left: 30px;
        margin-right: auto;
        max-width: calc(100% - 200px);
        justify-content: flex-start;
      }
    }

    /* =========================================================
       Top Controls
       - 説明ボタン（左寄せ）と、絞り込み/観光案内/待合室の
         3アイコン（右寄せ）を1つの帯にまとめ、
         画面に常時表示（スクロール追従）させる

         ※ position:sticky ではなく position:fixed を使用。
           既存の body{ overflow-x:hidden } 指定の影響で body が
           スクロールコンテナ化してしまい、sticky が正常に
           固定されない問題を確認したため、fixed にしている。
           fixed はフローから外れるので、直後の .earth-frame-wrap に
           margin-top で余白を補ってレイアウトジャンプを防いでいる。

           ※ 幅によってはボタン文言（多言語対応で長さが変わる）が
             アイコン列と衝突することがあったため、.top-controls は
             常に flex-wrap:wrap にしておき、1行に収まらない場合は
             アイコン列が自動的に2段目へ折り返す仕様にしている
             （特定のブレークポイントの数値に頼らず、実際のコンテンツ
             幅で自動的に安全な折り返しが起きるようにするため）。
             また .earth-frame-wrap の margin-top は、下部の
             ResizeObserver（syncToolbarSpacing）で top-controls の
             実際の高さに合わせて動的に上書きするため、ここでの
             px指定はJS実行前の初期値／フォールバックに過ぎない。 */
    .top-controls{
      position: fixed;
      top: var(--header-offset, 76px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      width: min(980px, calc(100% - 32px));
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      column-gap: 14px;
      row-gap: 8px;
      flex-wrap: wrap;
      padding: 8px 12px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(15,23,42,0.08);
    }

    /* top-controls が fixed になった分、直後の地球エリアが
       上に隠れないように余白を確保（幅はモバイルで変える）
       ※ 実際の値は syncToolbarSpacing() が動的に上書きする */
    .earth-frame-wrap{
      margin-top: 86px;
    }

    .top-controls__left{
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .top-controls__buttons{
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      flex: 0 1 auto;
      min-width: 0;
    }

    .top-controls__btn{
      flex: 0 1 auto;
      white-space: nowrap;
    }

    .top-controls__icons{
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex: 0 0 auto;
      margin-left: auto;
    }

    /* 3アイコン（絞り込み / 観光案内 / 待合室）の見た目
       ※ .earth-frame-wrap 配下からこの位置へ移動したため、
         旧 styles.css の ".earth-frame-wrap .tag-filter-btn" /
         ".earth-frame-wrap .tourist-info-btn" の外観指定はもう
         効かない。ここで同等の見た目（丸アイコン化）を再定義する。 */
    .top-controls__icons .tag-filter-btn,
    .top-controls__icons .tourist-info-btn{
      position: static;
      width: 46px;
      height: 46px;
      min-width: 46px;
      min-height: 46px;
      padding: 0;
      border-radius: 999px;
      background-color: rgba(255,255,255,0.92);
      background-repeat: no-repeat;
      background-position: center;
      background-size: 46px 46px;
      border: 1px solid rgba(0,0,0,0.12);
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      font-size: 0;
      line-height: 0;
      color: transparent;
      gap: 0;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, filter .15s ease;
    }
    .top-controls__icons .tag-filter-btn{
      background-image: url("./assets/filter.png");
    }
    .top-controls__icons .tourist-info-btn{
      background-image: url("./assets/tourist-information.png");
    }
    .top-controls__icons .tag-filter-btn #tagFilterCount{
      display: none;
    }
    .top-controls__icons .tag-filter-btn:hover,
    .top-controls__icons .tourist-info-btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.14);
    }
    .top-controls__icons .tag-filter-btn:active,
    .top-controls__icons .tourist-info-btn:active{
      transform: translateY(0);
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    }

    @media (max-width: 520px){
      .top-controls{
        width: min(100%, calc(100% - 20px));
        margin: 8px auto 12px;
        align-items: flex-start;
        flex-wrap: wrap;
        row-gap: 8px;
        gap: 8px;
      }

      .top-controls__left{
        order: 1;
        flex: 1 1 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .top-controls__buttons{
        order: 2;
        width: 100%;
        gap: 8px;
        flex-wrap: nowrap;
      }

      .top-controls__icons{
        order: 2;
        flex: 0 0 auto;
        margin-left: auto;
      }

      /* ※ styles.css の ".top-controls .intro-bar__button"（クラス。2つ分）に
         詳細度で負けないよう、ここもクラス。2つのセレクタにする */
      .top-controls__buttons .top-controls__btn{
        flex: 1 1 0;
        min-width: 0;
        white-space: normal;
        text-align: center;
        line-height: 1.35;
        font-size: 0.86rem;
        padding: 8px 10px;
      }

      /* モバイルでは top-controls が2段になり背が高くなるため、
         地球エリア上部の余白を広めにとる */
      .earth-frame-wrap{
        margin-top: 190px;
      }
    }

    @media (max-width: 390px){
      .top-controls{
        width: min(100%, calc(100% - 16px));
      }

      .top-controls__buttons{
        gap: 6px;
      }

      .top-controls__buttons .top-controls__btn{
        font-size: 0.80rem;
        padding: 8px 8px;
      }
    }

    /* ===== initial bottom gap cleanup =====
       styles.css 側の .wrap 余白をここで打ち消す */
    .wrap{
      padding-bottom: 0 !important;
    }
    .stage{
      margin-bottom: 0 !important;
      padding-bottom: 0 !important;
    }
    .earth-frame-wrap{
      margin-bottom: 0 !important;
    }

  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <div class="header-brand">
        <img class="header-logo" src="./assets/jp-mobile-new.fffa2967.png" alt="Dokodemo Doors">
        <h1 class="brand-logo-text" id="siteTitle">Dokodemo Doors Fan Site</h1>
      </div>

      <div class="lang-switch">
        <button id="langToggle" class="lang-switch__toggle" type="button">Language</button>
        <div id="langMenu" class="lang-switch__menu" hidden>
          <button type="button" data-lang="ja">日本語</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="hi">हिन्दी</button>
          <button type="button" data-lang="he">עברית</button>
          <button type="button" data-lang="fa">فارسی</button>
        </div>
      </div>
    </header>

    <div id="aboutBackdrop" class="backdrop" aria-hidden="true">
      <div class="modal about-modal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
        <header>
          <div id="aboutTitle" style="font-weight:700;">What is Dokodemo Doors?</div>
          <button type="button" class="close" id="aboutClose" aria-label="Close">✕</button>
        </header>
        <div class="body" id="aboutBody">
          ...
        </div>
      </div>
    </div>

    <div id="guideBackdrop" class="backdrop" aria-hidden="true">
      <div class="modal about-modal" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
        <header>
          <div id="guideTitle" style="font-weight:700;">What is this fan site?</div>
          <button type="button" class="close" id="guideClose" aria-label="Close">✕</button>
        </header>
        <div class="body" id="guideBody">
          ...
        </div>
      </div>
    </div>

    <div id="tagFilterBackdrop" class="backdrop" aria-hidden="true">
      <div class="modal tag-filter-modal" role="dialog" aria-modal="true" aria-labelledby="tagFilterTitle">
        <header>
          <div id="tagFilterTitle">絞り込み</div>

          <div class="tag-filter-actions">
            <button
              type="button"
              id="tagFilterClear"
              aria-hidden="true"
              tabindex="-1"
              style="display:none;"
            >
              クリア
            </button>
            <button type="button" id="tagFilterApply" class="primary">適用</button>
          </div>

          <button type="button" class="close" id="tagFilterClose" aria-label="Close">✕</button>
        </header>

  <script>
  (function(){
    function smoothScrollToTourInfo(){
      const section = document.getElementById("recommendSection");
      if(!section) return;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          try {
            section.scrollIntoView({ behavior: "smooth", block: "start", inline: "nearest" });
          } catch (e) {
            const y = section.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0);
            window.scrollTo(0, y);
          }

          const input = document.getElementById("recommendInput");
          if(input){
            setTimeout(() => {
              try { input.focus({ preventScroll: true }); } catch (e) { try { input.focus(); } catch(_){} }
            }, 350);
          }
        });
      });
    }

    const btn = document.getElementById("touristInfoBtn");
    if(!btn) return;

    btn.addEventListener("click", () => {
      setTimeout(smoothScrollToTourInfo, 0);
    }, { passive: true });
  })();
  </script>

  <!-- ✅ WaitingRoomToggle:START -->
  <script>
  (function(){

    const btn = document.getElementById("waitingRoomBtn");
    const section = document.getElementById("meetupsSection");

    if(!btn || !section) return;

    function smoothScroll(){
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          try{
            section.scrollIntoView({behavior:"smooth", block:"start"});
          }catch(e){
            const y = section.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop || 0);
            window.scrollTo(0,y);
          }
        });
      });
    }

    btn.addEventListener("click", ()=>{

      const isOpen = !section.classList.contains("is-collapsed");

      if(isOpen){
        section.classList.add("is-collapsed");
        btn.setAttribute("aria-expanded","false");
      }else{
        section.classList.remove("is-collapsed");
        btn.setAttribute("aria-expanded","true");
        setTimeout(smoothScroll,0);
      }

    });

  })();
  </script>

<script>
(function(){
  const LANG_KEYS = [
    "lang",
    "dd_lang",
    "language",
    "ddLang",
    "ddLanguage",
    "selectedLang",
    "selectedLanguage",
    "i18n_lang",
    "i18nextLng"
  ];

  function normalizeLang(v){
    if(!v) return null;
    const s = String(v).trim().toLowerCase();
    if(!s) return null;
    const base = s.split("-")[0];
    if(["ja","en","zh","fa","hi","he"].includes(base)) return base;
    return s;
  }

  function readLang(){
    for(const k of LANG_KEYS){
      try{
        const v = normalizeLang(localStorage.getItem(k));
        if(v) return v;
      }catch(_){}
    }
    return normalizeLang(document.documentElement.getAttribute("lang")) || "ja";
  }

  let currentLang = readLang();

  function reloadIfLangChanged(){
    const nextLang = readLang();
    if(nextLang && nextLang !== currentLang){
      currentLang = nextLang;
      location.reload();
    }
  }

  window.addEventListener("storage", reloadIfLangChanged);
  window.addEventListener("focus", reloadIfLangChanged);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){
      reloadIfLangChanged();
    }
  });

  setInterval(reloadIfLangChanged, 500);
})();
</script>

<!-- ✅ ToolbarSpacingSync:START
     .top-controls は position:fixed なのでドキュメントフローに影響しない。
     多言語対応でボタンの文字数が変わり、幅によってはアイコン列が
     2段目に折り返されて top-controls 自体の高さが変わるため、
     固定 px の margin-top では地球エリアとの隙間がズレる。

     ※ 以前の実装は "top-controls 自身の高さ + 余白" だけを
       margin-top に入れていたが、top-controls は position:fixed で
       ビューポート上部から var(--header-offset) 分下がった位置に
       表示されるのに対し、.earth-frame-wrap はフロー上ではすでに
       上部にヘッダー分のオフセットがあるため、単純に
       "高さ分だけ" margin-top に入れるとオフセット分が二重に
       抜け落ちてしまい、モバイル幅では台座同士が密着（または
       わずかに重なる）していた。
       → 代わりに「今の実際の表示位置」と「本来あるべき位置
       （top-controls の下端 + 希望する隣間）の差分を現在の
       margin-top に加算する方式に変更。これにより、
       header-offset やフロー上の初期オフセットを意識しなくても
       常に正確な隙間（GAP_PX）に収束する。 -->
<script>
(function(){
  var GAP_PX = 16; // top-controls の下端と .earth-frame-wrap の間に欲しい隣間

  function syncToolbarSpacing(){
    var tc = document.querySelector(".top-controls");
    var earth = document.querySelector(".earth-frame-wrap");
    if(!tc || !earth) return;
    var tcRect = tc.getBoundingClientRect();
    if(!tcRect.height) return;
    var earthRect = earth.getBoundingClientRect();
    var currentMargin = parseFloat(getComputedStyle(earth).marginTop) || 0;
    var desiredTop = tcRect.bottom + GAP_PX;
    var delta = desiredTop - earthRect.top;
    var newMargin = Math.max(0, Math.round(currentMargin + delta));
    earth.style.marginTop = newMargin + "px";
  }

  window.addEventListener("load", syncToolbarSpacing);
  window.addEventListener("resize", syncToolbarSpacing);
  window.addEventListener("orientationchange", syncToolbarSpacing);
  document.addEventListener("DOMContentLoaded", syncToolbarSpacing);

  if(window.ResizeObserver){
    document.addEventListener("DOMContentLoaded", function(){
      var tc = document.querySelector(".top-controls");
      if(!tc) return;
      var ro = new ResizeObserver(syncToolbarSpacing);
      ro.observe(tc);
    });
  }

  syncToolbarSpacing();
})();
</script>
<!-- ✅ ToolbarSpacingSync:END -->

<!-- ✅ TagFilterModalCenter:START
     tagfilter.js は「絞り込みボタンの真下」にモーダルを出す位置計算をしている。
     ボタンをツールバー右側のアイコン列に移動したことで、モーダルが画面右寄りに
     開くようになってしまった。tagfilter.js 自体は編集できないので、
     モーダルの style 属性の変化を監視し、開いた直後に
     バックドロップ（= ビューポート全体）の中心に位置を上書きする。
     モーダルがビューポートより大きい狭い画面でも見えなくならないよう、
     左上（0,0）より小さくはしない（= 従来通りスクロールで全体を確認できる）。 -->
<script>
(function(){
  var backdrop = document.getElementById("tagFilterBackdrop");
  if(!backdrop) return;
  var modal = backdrop.querySelector(".tag-filter-modal");
  if(!modal) return;

  var centering = false;

  function centerTagFilterModal(){
    if(!backdrop.classList.contains("open")) return;
    var bw = backdrop.clientWidth;
    var bh = backdrop.clientHeight;
    var mw = modal.offsetWidth;
    var mh = modal.offsetHeight;
    if(!mw || !mh) return;
    var left = Math.max(0, Math.round((bw - mw) / 2));
    var top = Math.max(0, Math.round((bh - mh) / 2));
    centering = true;
    modal.style.left = left + "px";
    modal.style.top = top + "px";
    centering = false;
  }

  var mo = new MutationObserver(function(){
    if(centering) return;
    requestAnimationFrame(function(){
      requestAnimationFrame(centerTagFilterModal);
    });
  });
  mo.observe(modal, { attributes: true, attributeFilter: ["style"] });

  window.addEventListener("resize", centerTagFilterModal);
})();
</script>
<!-- ✅ TagFilterModalCenter:END -->
