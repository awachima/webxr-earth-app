<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Dokodemo Doors Fan Site</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <!-- Your main stylesheet -->
  <link rel="stylesheet" href="./styles.css" />

  <style>
    /* ===== iframe overlay buttons ===== */
    .tag-filter-btn{
      position: fixed;
      top: 76px;
      left: 18px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.10);
      cursor: pointer;
      font: inherit;
    }
    .tag-filter-count{ opacity: 0.8; }

    /* ★ 3カラム(260px×3) + gap(10px×2) + padding(8px×2) = 852px でピッタリ */
    .tag-filter-modal{
      width: min(852px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
    }

    .tag-filter-toolbar{
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .tag-filter-spacer{ flex: 1; }

    /* ★ 左寄せで列を詰めて並べる（均等割りしない） */
    .tag-filter-columns{
      display: flex;
      align-items: stretch;
      justify-content: flex-start; /* ← 常に左寄せ */
      gap: 10px;
      height: min(60vh, 520px);
      overflow: auto;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.65);
    }
    .tag-filter-col{
      flex: 0 0 260px;         /* ← 列幅固定で左から並ぶ */
      width: 260px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.85);
      padding: 10px;
      overflow: auto;
    }
    .tag-filter-col-title{
      font-weight: 700;
      font-size: 13px;
      opacity: 0.8;
      margin: 0 0 8px 0;
    }
    .tag-item{
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }
    .tag-item:hover{ background: rgba(0,0,0,0.05); }
    .tag-item.active{ background: rgba(50,112,166,0.12); }
    .tag-item label{
      flex: 1;
      cursor: pointer;
    }
    .tag-item input[type="checkbox"]{
      width: 18px;
      height: 18px;
      accent-color: #3270A6;
      cursor: pointer;
    }

    /* make backdrop/modal appear above iframe reliably */
    #tagFilterBackdrop{ z-index: 10000; }

    /* ===== Tag Filter Modal (multi-column) ===== */
    .backdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      padding: 0;
      overflow: hidden;
    }
    .backdrop.open{ display:block; }

    /* ★ 下の定義が勝つので、ここでも 852px に統一（3カラムぴったり） */
    .tag-filter-modal{
      position: fixed;
      top: 0;
      left: 0;
      margin: 0;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      border-radius: 14px;

      width: min(852px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);

      min-height: 440px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tag-filter-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .tag-filter-title{
      font-weight: 700;
      font-size: 16px;
    }
    .tag-filter-actions{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .tag-filter-actions button{
      border: 1px solid rgba(0,0,0,0.14);
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }
    .tag-filter-actions button.primary{
      background:#0B3559;
      color:#fff;
      border-color:#0B3559;
    }

    .tag-filter-body{
      display:flex;
      flex:1;
      min-height: 0;
    }

    .columns{
      display:flex;
      flex:1;
      min-width:0;
      overflow:auto;
      padding: 12px 14px 14px;
      gap: 14px;
    }
    .column{
      flex: 0 0 260px;
      width: 260px;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 10px 10px;
      background: rgba(255,255,255,0.96);
      min-height: 300px;
    }
    .column h3{
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 700;
    }
    .node{
      display:flex;
      align-items:flex-start;
      gap: 8px;
      padding: 6px 6px;
      border-radius: 10px;
      cursor: pointer;
    }
    .node:hover{ background: rgba(0,0,0,0.04); }
    .node .label{
      line-height: 1.25;
      font-size: 13px;
    }
    .node .chev{
      margin-left:auto;
      opacity: 0.55;
    }

    .tag-filter-footer{
      padding: 10px 14px;
      border-top: 1px solid rgba(0,0,0,0.08);
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }

    /* ===== Modal header/body (match your markup) ===== */
    .modal.tag-filter-modal > header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .modal.tag-filter-modal > header #tagFilterTitle{
      font-weight: 700;
      font-size: 16px;
    }
    .modal.tag-filter-modal > header .close{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.14);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor: pointer;
      background:#fff;
    }
    .modal.tag-filter-modal .body{
      padding: 12px 14px 14px;
    }

    /* ===== toolbar buttons ===== */
    .modal.tag-filter-modal .btn{
      border: 1px solid rgba(0,0,0,0.14);
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font: inherit;
    }
    .modal.tag-filter-modal .btn.primary{
      background:#0B3559;
      color:#fff;
      border-color:#0B3559;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <h1 class="brand-logo-text" id="siteTitle">Dokodemo Doors Fan Site</h1>

      <!-- 言語スイッチ -->
      <div class="lang-switch">
        <button id="langToggle" class="lang-switch__toggle" type="button">Language</button>
        <div id="langMenu" class="lang-switch__menu" hidden>
          <button type="button" data-lang="ja">日本語</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="hi">हिन्दी</button>
          <button type="button" data-lang="he">עברית</button>
          <button type="button" data-lang="fa">فارسی</button>
        </div>
      </div>
    </header>

    <!-- ===== About modals ===== -->
    <div id="aboutBackdrop" class="backdrop" aria-hidden="true">
      <div class="modal about-modal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
        <header>
          <div id="aboutTitle">About</div>
          <button type="button" class="close" id="aboutClose" aria-label="Close">✕</button>
        </header>
        <div class="body">
          <h2 class="heading-large" id="aboutHeading">Dokodemo Doors Fan Site</h2>
          <p id="aboutText">
            どこでもドアは、世界の360度VR動画を公開するサイトです。複数人で“同時に”閲覧可能で、同じ景色を見ながら会話やジェスチャーで体験を共有できます。
          </p>
        </div>
        <div class="actions">
          <button type="button" class="btn primary" id="aboutOk">OK</button>
        </div>
      </div>
    </div>

    <div id="guideBackdrop" class="backdrop" aria-hidden="true">
      <div class="modal guide-modal" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
        <header>
          <div id="guideTitle">Guide</div>
          <button type="button" class="close" id="guideClose" aria-label="Close">✕</button>
        </header>
        <div class="body">
          <h2 class="heading-large" id="guideHeading">How to use</h2>
          <p id="guideText">
            右上の言語切替で表示言語を変更できます。地球儀上のマーカーを選択すると、詳細情報が表示されます。
          </p>
        </div>
        <div class="actions">
          <button type="button" class="btn primary" id="guideOk">OK</button>
        </div>
      </div>
    </div>

    <main class="stage">
      <img class="site-logo" src="./assets/jp-mobile-new.fffa2967.png" alt="Logo">

      <!-- Intro buttons -->
      <div class="intro-bar">
        <button type="button" class="intro-bar__button" id="openAbout">About</button>
        <button type="button" class="intro-bar__button" id="openGuide">Guide</button>
      </div>

      <!-- Earth iframe wrap -->
      <section class="earth-frame-wrap" aria-label="Earth Viewer">
        <iframe id="webxr-iframe" src="./earth.html" title="Earth" allow="xr-spatial-tracking; fullscreen;"></iframe>

        <!-- 絞り込みボタン（iframe上 左上） -->
        <button id="tagFilterBtn" class="tag-filter-btn" type="button" aria-expanded="false">
          絞り込み <span id="tagFilterCount" class="tag-filter-count"></span>
        </button>

        <!-- 観光案内ボタン（iframe上 左下） -->
        <button id="touristInfoBtn" class="tourist-info-btn" type="button" aria-expanded="false">
          Tourist Info
        </button>
      </section>

      <!-- ツアー提案（Lucy）パネル -->
      <section id="recommendSection" class="recommend-section is-collapsed" aria-hidden="true">
        <h2 class="heading-large" id="recommendTitle">ツアー提案（プロトタイプ）</h2>
        <div id="recommendCards" class="recommend-cards"></div>
      </section>

      <!-- Meetups -->
      <section class="meetups" aria-label="Meetup Rooms">
        <div class="meetups__head">
          <h2 class="meetups__title" id="meetupsTitle">待合室</h2>
          <button id="openCreate" class="btn primary head-create" type="button">作成</button>
        </div>

        <div class="grid" id="grid"></div>
      </section>
    </main>

    <!-- ===== Create/Edit modal ===== -->
    <div id="backdrop" class="backdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true">
        <header>
          <div id="title">Create</div>
          <button type="button" class="close" id="close" aria-label="Close">✕</button>
        </header>

        <div class="body">
          <div class="form">
            <div>
              <label for="name">Title</label>
              <input id="name" placeholder="Title" />
            </div>
            <div>
              <label for="url">URL</label>
              <input id="url" placeholder="https://..." />
            </div>

            <div>
              <label for="time">Start</label>
              <input id="time" type="datetime-local" />
            </div>
            <div>
              <label for="limit">Limit</label>
              <input id="limit" type="number" min="1" value="10" />
            </div>

            <div>
              <label for="eventType">Event Type</label>
              <select id="eventType">
                <option value="free">Free</option>
                <option value="paid">Paid</option>
              </select>
            </div>

            <div id="priceWrap" style="display:none;">
              <label for="price">Price</label>
              <input id="price" type="text" placeholder="e.g., 500" />
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="delete" class="btn danger" type="button">Delete</button>
          <button id="duplicate" class="btn" type="button">Duplicate</button>
          <button id="submit" class="btn primary" type="button">Save</button>
        </div>
      </div>
    </div>

    <!-- ===== Tag filter modal ===== -->
    <div id="tagFilterBackdrop" class="backdrop" aria-hidden="true">
      <div class="modal tag-filter-modal" role="dialog" aria-modal="true" aria-labelledby="tagFilterTitle">
        <header>
          <div id="tagFilterTitle">絞り込み</div>
          <button type="button" class="close" id="tagFilterClose" aria-label="Close">✕</button>
        </header>
        <div class="body">
          <!-- ★ 以前と同じ：クリア / 適用 ボタン -->
          <div class="tag-filter-toolbar">
            <button type="button" class="btn" id="tagFilterClear">クリア</button>
            <div class="tag-filter-spacer"></div>
            <button type="button" class="btn primary" id="tagFilterApply">適用</button>
          </div>

          <div id="tagFilterColumns" class="tag-filter-columns" aria-label="Tag tree"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="./main.js"></script>
  <script src="./tagfilter.js"></script>

  <script>
    // ----------------------------
    //  Minimal language menu logic
    // ----------------------------
    (function(){
      const toggle = document.getElementById('langToggle');
      const menu   = document.getElementById('langMenu');
      if (!toggle || !menu) return;

      const normalizeLang = (v)=>{
        v = (v || '').toLowerCase();
        if (v.startsWith('ja')) return 'ja';
        if (v.startsWith('en')) return 'en';
        if (v.startsWith('zh')) return 'zh';
        if (v.startsWith('hi')) return 'hi';
        if (v.startsWith('he')) return 'he';
        if (v.startsWith('fa')) return 'fa';
        return 'en';
      };

      let current = normalizeLang(localStorage.getItem('dd_lang') || navigator.language || navigator.userLanguage);

      const setLang = (lang)=>{
        current = lang;
        localStorage.setItem('dd_lang', lang);
        menu.hidden = true;

        // NOTE: You likely have your own i18n; keep this minimal.
        // This block is intentionally conservative to avoid breaking existing behavior.
        // If you already load lang JSON elsewhere, that will take precedence.
      };

      toggle.addEventListener('click', (ev)=>{
        ev.preventDefault();
        menu.hidden = !menu.hidden;
      });

      menu.addEventListener('click', (ev)=>{
        const btn = ev.target.closest('button[data-lang]');
        if (!btn) return;
        setLang(btn.getAttribute('data-lang'));
      });

      document.addEventListener('click', (ev)=>{
        if (!menu.hidden && !menu.contains(ev.target) && ev.target !== toggle){
          menu.hidden = true;
        }
      });

      // init
      setLang(current);
    })();
  </script>
</body>
</html>
