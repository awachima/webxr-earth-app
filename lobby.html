<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待ち合わせロビー</title>
  <style>
    body{margin:0;background:#f6f7fb;color:#111;font:16px system-ui}
    header{background:#111;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
    main{display:grid;place-items:center;padding:24px 16px}
    .card{width:min(1100px,96vw);background:#fff;border:1px solid #ececf0;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.08);padding:20px}
    h1{font-size:20px;margin:4px 0 8px}
    .meta{color:#666;font-size:14px;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:1fr 660px;gap:16px}
    @media(max-width:980px){.grid{grid-template-columns:1fr}}
    .panel{border:1px solid #eee;border-radius:12px;padding:14px;background:#fff}
    .label{color:#666;font-size:12px;font-weight:700;text-transform:uppercase}
    .count{font-variant-numeric:tabular-nums;font-weight:800;font-size:36px;margin:6px 0 4px}
    .status{font-size:13px;color:#666}
    .btn{appearance:none;border:1px solid #111;background:#111;color:#fff;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .btn.ghost{background:#fff;color:#111}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
    .sep{height:1px;background:#eee;margin:16px 0}
    .copy{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:10px}
    /* chat */
    .chat{display:flex;flex-direction:column;height:520px}
    .chat-log{flex:1;border:1px solid #eee;border-radius:12px;padding:10px;overflow:auto;background:#fafafa}
    .msg{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:85%;word-break:break-word;font-size:14px}
    .msg.me{background:#e6f3ff;margin-left:auto}
    .msg.other{background:#fff;border:1px solid #eee}
    .msg.sys{background:#f3f4f6;border:1px dashed #ddd;color:#555;font-size:12px;text-align:center}
    .chat-input{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .chat-input input{flex:1;min-width:200px;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:14px}
    /* members */
    .members{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto;margin-top:8px}
    .member{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid #eee;border-radius:9999px;background:#fafafa;font-size:14px}
    .badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:9999px;background:#111;color:#fff;font-size:12px;font-weight:700}
    /* switches */
    .switch{display:inline-flex;align-items:center;gap:6px;font-size:13px}
    .switch input{width:18px;height:18px}
  </style>
</head>
<body>
  <header>
    <div>待ち合わせロビー</div>
    <div style="display:flex; gap:8px; align-items:center">
      <button id="setName" class="btn ghost" type="button">ニックネーム</button>
      <a class="btn ghost" href="./index.html">← 戻る</a>
    </div>
  </header>

  <main>
    <div class="card">
      <div>
        <div class="pill" id="limitPill" style="display:none"></div>
        <h1 id="title">（タイトル未設定）</h1>
        <div class="meta" id="meta">開始時刻：—</div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="label">カウントダウン</div>
          <div class="count" id="count">--:--:--</div>
          <div class="status" id="status">開始までお待ちください。</div>
          <div class="row">
            <a id="enter" class="btn" target="_top" rel="noopener">ツアーに行く</a>
          </div>
          <div class="sep"></div>
          <div class="row">
            <button id="copy" class="btn" type="button">この待ち合わせのURLをコピー</button>
          </div>
        </div>

        <div class="panel">
          <div class="label">参加者</div>
          <div id="members" class="members"></div>

          <div class="sep"></div>
          <div class="label">ボイスチャット</div>
          <div class="row">
            <button id="voicePower" class="btn" type="button">音声ON</button>
            <button id="micToggle" class="btn ghost" type="button" style="display:none">ミュート</button>
            <button id="sttToggle" class="btn ghost" type="button" title="自分の発話を自動で文字起こしして送信">自動字幕ON</button>
          </div>
          <div id="mobileModeRow" class="row" style="display:none">
            <label class="switch" title="認識中のみ相手へのマイク送信を一時停止して字幕化します（同時利用が不安定な端末向け）">
              <input type="checkbox" id="mobileCaptionMode">
              <span>字幕優先モード（モバイル）</span>
            </label>
          </div>
          <div id="serverModeRow" class="row" style="display:none">
            <label class="switch" title="音声の短い塊をWebSocketでサーバーへ送り、サーバーで文字起こしして返します。">
              <input type="checkbox" id="serverSttMode">
              <span>サーバー字幕モード</span>
            </label>
          </div>

          <div id="voiceHint" class="status" style="margin-top:6px">未参加</div>
          <button id="enableSound" class="btn ghost" type="button" style="display:none;margin-top:6px">スマホで音を有効化</button>

          <div class="sep"></div>
          <div class="label">テキストチャット</div>
          <div class="chat">
            <div id="chatLog" class="chat-log" aria-live="polite"></div>
            <div class="chat-input">
              <input id="chatInput" placeholder="メッセージを入力…" maxlength="2000">
              <button id="chatSend" class="btn" type="button">送信</button>
            </div>
          </div>
          <div class="status" id="chatStatus" style="margin-top:8px;color:#0a7f3f">接続していません</div>
        </div>
      </div>

      <div class="sep"></div>
      <pre id="debug" style="font:12px ui-monospace,monospace;color:#555;white-space:pre-wrap"></pre>
    </div>
  </main>
  <footer style="color:#888;font-size:12px;text-align:center;padding:18px">© DokodemoDoors</footer>

  <script>
  // ===== 基本パラメータ =====
  const NEGATIVE_LIMIT_MS = 20*60*1000;
  const S='meetups-store', O='meetups-owners';
  const readStore=()=>JSON.parse(localStorage.getItem(S)||'[]');
  const writeStore=(arr)=>localStorage.setItem(S,JSON.stringify(arr));
  const readOwners=()=>JSON.parse(localStorage.getItem(O)||'{}');
  const writeOwners=(map)=>localStorage.setItem(O,JSON.stringify(map));
  function autoDeleteRoom(roomId){
    if(!roomId) return;
    const remain = readStore().filter(x=>x.roomId!==roomId);
    writeStore(remain);
    const owners = readOwners(); delete owners[roomId]; writeOwners(owners);
    console.info('[auto-delete - lobby]', roomId, 'を削除しました');
  }

  const REGISTRY_API = 'https://do-chat.awachima7.workers.dev/api/rooms';

  const $=(s)=>document.querySelector(s);
  const p=new URLSearchParams(location.search);
  const title=p.get('title')||'待ち合わせ';
  const start=p.get('start');
  const limit=parseInt(p.get('limit')||'10',10);
  const target=p.get('target')||'';
  const roomId=p.get('roomId')||'';
  const user=localStorage.getItem('nickname')||`Guest-${Math.random().toString(16).slice(2,6)}`;
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  const isIOS    = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  $('#title').textContent=title;
  document.title=title+' | 待ち合わせロビー';
  if(Number.isFinite(limit)&&limit>0){
    const pill=document.createElement('div');
    pill.className='pill';
    pill.textContent=`参加上限 ${limit} 名`;
    pill.style.display='inline-flex';
    $('#limitPill').replaceWith(pill);
  }

  const enterBtn = $('#enter');
  const validTarget = /^https?:\/\//i.test(target);
  if (validTarget) { enterBtn.href = target; } else { enterBtn.style.display = 'none'; }

  let startDate=null; if(start){ startDate=new Date(start); $('#meta').textContent='開始時刻：'+startDate.toLocaleString(); }
  const pad=(n)=>String(n).padStart(2,'0');

  function showEnded(){
    autoDeleteRoom(roomId);
    $('#count').textContent = '消滅しました';
    $('#status').innerHTML = '<span style="color:#b00020">この待ち合わせは終了しました</span>';
    enterBtn.setAttribute('disabled','true'); enterBtn.removeAttribute('href');
    $('#chatStatus').textContent='この待ち合わせは終了しました';
    $('#chatSend').setAttribute('disabled','true');
    $('#chatInput').setAttribute('disabled','true');
  }

  async function checkRegistry(){
    try{
      const url = new URL(REGISTRY_API);
      url.searchParams.set('id', roomId);
      const res = await fetch(url.toString(), { cache: 'no-store' });
      if (!res.ok) { showEnded(); return false; }
      const j = await res.json();
      if (!j || !j.ok || !j.room) { showEnded(); return false; }
      return true;
    }catch(e){
      console.warn('[registry check]', e);
      return true; // ネットワーク異常時は従来挙動にフォールバック
    }
  }

  function tick(){
    if(!startDate){
      $('#count').textContent='--:--:--';
      $('#status').innerHTML='<span style="color:#b00020">開始時刻未設定</span>';
      requestAnimationFrame(tick); return;
    }
    const now = new Date(); const diff = startDate - now;
    if (diff > 0){
      const h=Math.floor(diff/3600000), m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
      $('#count').textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;
      $('#status').textContent='開始までお待ちください。';
      requestAnimationFrame(tick); return;
    }
    const expireAt = new Date(startDate.getTime() + NEGATIVE_LIMIT_MS);
    const remainMs = expireAt - now;
    if (remainMs > 0){
      const remainMin = Math.ceil(remainMs / 60000);
      $('#count').textContent = `消滅まで後${pad(remainMin)}分`;
      $('#status').textContent='開始済み：入室できます（20分以内）';
      requestAnimationFrame(tick);
    } else {
      showEnded();
    }
  }
  requestAnimationFrame(tick);

  $('#copy').onclick=async()=>{
    const url = location.href;
    try{ await navigator.clipboard.writeText(url);
      $('#copy').textContent = 'コピーしました';
      setTimeout(()=>$('#copy').textContent='この待ち合わせのURLをコピー', 1200);
    }catch(e){ prompt('手動コピー：', url); }
  };

  $('#debug').textContent=JSON.stringify({title,start,limit,target,roomId,user,isMobile,isIOS,hasSR:!!SR},null,2);

  document.getElementById('setName').onclick = function setNickname(){
    const current = localStorage.getItem('nickname') || user;
    const name = prompt('ニックネームを入力してください：', current);
    if (!name) return;
    localStorage.setItem('nickname', name.trim().slice(0, 32));
    alert('ニックネームを保存しました。ページを再読み込みすると反映されます。');
  };

  // ===== チャット + 音声 =====
  const WS_BASE = 'wss://do-chat.awachima7.workers.dev';
  const pageParams = new URLSearchParams(location.search);
  pageParams.set('user', user);
  const CHAT_URL = `${WS_BASE}/ws/${encodeURIComponent(roomId)}?${pageParams.toString()}`;

  let ws=null, connected=false;
  let myId=null;
  const chatLog=$('#chatLog');
  const chatInput=$('#chatInput');
  const chatSend=$('#chatSend');
  const members=$('#members');
  const chatStatus=$('#chatStatus');

  function pushMsg(el, cls, text){
    const li=document.createElement('div');
    li.className='msg '+cls;
    li.textContent=text;
    el.appendChild(li);
    el.scrollTop=el.scrollHeight;
  }
  function pushSys(text){ pushMsg(chatLog, 'sys', text); }
  function pushMe(text){  pushMsg(chatLog, 'me',  text); }
  function pushOther(text){pushMsg(chatLog, 'other', text);}

  function renderMembers(list){
    members.innerHTML='';
    list.forEach(m=>{
      const div=document.createElement('div');
      div.className='member';
      div.innerHTML=`<span class="badge">${(m.name||'?').slice(0,1)}</span><span>${m.name||'Guest'}</span>`;
      members.appendChild(div);
    });
  }

  function connect(){
    if(ws){ try{ ws.close(); }catch{} ws=null; }
    ws=new WebSocket(CHAT_URL);
    ws.addEventListener('open', ()=>{ connected=true; chatStatus.textContent='接続中'; });
    ws.addEventListener('message', (ev)=>{
      const data=String(ev.data||'');
      try{
        const j=JSON.parse(data);
        if(j?.sys && j.type==='welcome'){ myId=j.id; return; }
        if(j?.sys && j.type==='history'){
          const msgs=(Array.isArray(j.messages)?j.messages:[]).map(s=>{try{return JSON.parse(s)}catch{return null}}).filter(Boolean);
          msgs.forEach(m=>{
            if(m?.name===user){ pushMe(m.text); }
            else if(m?.name){ pushOther(`${m.name}：${m.text}`); }
          });
          return;
        }
        if(j?.sys && j.type==='roster'){ renderMembers(j.members||[]); return; }
        if(j?.sys && j.type==='join'){ pushSys(`${j.name||'誰か'} が入室しました`); return; }
        if(j?.sys && j.type==='leave'){ pushSys(`${j.name||'誰か'} が退室しました`); return; }
        if(j?.name===user){ pushMe(j.text); }
        else if(j?.name){ pushOther(`${j.name}：${j.text}`); }
      }catch{ /* 非JSONは無視 */ }
    });
    ws.addEventListener('close', ()=>{ connected=false; chatStatus.textContent='切断しました'; });
    ws.addEventListener('error', ()=>{ connected=false; chatStatus.textContent='エラー'; });
  }

  (async ()=>{ if(await checkRegistry()) connect(); else chatStatus.textContent='終了済み'; })();

  chatSend.onclick=()=>{
    const t=chatInput.value.trim();
    if(!t||!ws||ws.readyState!==1) return;
    ws.send(t);
    chatInput.value='';
  };
  chatInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter') chatSend.click(); });

  // ===== 音声 UI（トグル） =====
  const voicePower=$('#voicePower'), micToggle=$('#micToggle');
  const sttBtn=$('#sttToggle');
  const voiceHint=$('#voiceHint');
  const enableSound=$('#enableSound');
  const mobileCaptionMode=$('#mobileCaptionMode');
  const serverModeRow=$('#serverModeRow');
  const serverSttMode=$('#serverSttMode');

  let audioOn=false, micMuted=false, sttOn=false;

  function updateVoiceUI(){
    voicePower.textContent = audioOn ? '音声OFF' : '音声ON';
    micToggle.style.display = audioOn ? 'inline-flex' : 'none';
    sttBtn.style.display = audioOn ? 'inline-flex' : 'none';
    voiceHint.textContent = audioOn ? (micMuted?'ミュート中':'音声有効') : '未参加';
  }
  function updateSttUI(){
    sttBtn.textContent = sttOn ? '自動字幕OFF' : '自動字幕ON';
  }

  voicePower.onclick=()=>{ audioOn=!audioOn; updateVoiceUI(); };
  micToggle.onclick = ()=>{ micMuted=!micMuted; updateVoiceUI(); };

  // ===== STT（Web Speech API ベース） =====
  let recog=null;
  function startStt({continuous=false}={}){
    if(sttOn) return;
    if(!SR){ alert('このブラウザは音声認識に対応していません'); return; }
    recog = new SR();
    recog.lang='ja-JP'; recog.interimResults=false; recog.continuous=!!continuous;
    recog.onresult=(e)=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript.trim();
        if(t){ chatInput.value=t; chatSend.click(); }
      }
    };
    recog.onend=()=>{ if(sttOn && recog && recog.continuous) try{ recog.start(); }catch{} };
    try{ recog.start(); sttOn=true; updateSttUI(); }catch(e){ console.warn(e); }
  }
  function stopStt(){ if(!sttOn) return; try{ recog&&recog.stop(); }catch{} sttOn=false; updateSttUI(); }

  sttBtn.onclick = ()=>{ if (!sttOn) startStt({ continuous: !isMobile }); else stopStt(); };

  function stopAll(){ stopStt(); }
  window.addEventListener('beforeunload', stopAll);

  // 初期UI反映
  updateVoiceUI(); updateSttUI();
  </script>
</body>
</html>
