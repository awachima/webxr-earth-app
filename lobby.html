<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待ち合わせロビー</title>
  <link rel="stylesheet" href="./lobby.css" />
</head>
<body>
  <header>
    <div id="lobbyHeaderTitle">待ち合わせロビー</div>
    <div style="display:flex; gap:8px; align-items:center">
      <button id="setName" class="btn ghost" type="button">ニックネーム</button>
      <a id="backToIndex" class="btn ghost" href="./index.html">← 戻る</a>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="room-header">
        <div id="roomId" class="room-id"></div>
        <h1 id="title">（タイトル未設定）</h1>
        <div class="meta" id="meta">開始時刻：—</div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="label" id="countdownLabel">カウントダウン</div>
          <div class="count" id="count">--:--:--</div>
          <div class="status" id="status">開始までお待ちください。</div>
          <div class="row">
            <!-- ★ id を enterBtn に変更（JS と一致させる） -->
            <a id="enterBtn" class="btn" target="_top" rel="noopener">ツアーに行く</a>
          </div>
          <div class="sep"></div>
          <div class="row">
            <!-- ★ id を copyRoomUrl に変更（JS と一致させる） -->
            <button id="copyRoomUrl" class="btn" type="button">この待合室のURLをコピー</button>
          </div>
        </div>

        <div class="panel">
          <div class="label" id="voiceSectionTitle">ボイスチャット</div>
          <div id="members" class="members"></div>

          <div class="sep"></div>
          <div class="label" id="voiceControlLabel">ボイスチャット</div>
          <div class="row">
            <button id="voicePower" class="btn" type="button">音声ON</button>
            <button id="micToggle" class="btn ghost" type="button" style="display:none">ミュート</button>
          </div>
          <!-- ★ 音声ON/OFF 注意書きに id を付与して多言語化 -->
          <div class="notice-small" id="voiceOnOffHint">🔊 音声はON/OFFで改善することがあります。</div>

          <div id="voiceHint" class="status" style="margin-top:6px">※ 音声はブラウザ同士で直接やり取りされます。</div>
          <button id="enableSound" class="btn ghost" type="button" style="display:none;margin-top:6px">スマホで音を有効化</button>

          <div class="sep"></div>
          <div class="label" id="textChatLabel">テキストチャット</div>
          <div class="chat">
            <div id="chatLog" class="chat-log" aria-live="polite"></div>
            <div class="chat-input">
              <input id="chatInput" placeholder="メッセージを入力…" maxlength="2000">
              <button id="chatSend" class="btn" type="button">送信</button>
            </div>
            <!-- ★ 執事に質問（音声）ボタンとステータス表示 -->
            <div class="chat-voice-ask" style="margin-top:8px;">
              <button id="voiceAskBtn" class="btn ghost" type="button">
                執事に質問（音声）
              </button>
              <div id="voiceAskStatus" class="status" style="margin-top:4px;"></div>
              <!-- ★ 執事向け注意書きに id を付与して多言語化 -->
              <div class="notice-small" id="voiceSpeakHint">🤵 ゆっくり・はっきり話すと認識が安定します。</div>
            </div>
          </div>
          <div class="status" id="chatStatus" style="margin-top:4px;"></div>
        </div>

        <div class="panel">
          <div class="label" id="infoPanelLabel">待合室の情報</div>
          <table class="info-table">
            <tr>
              <th id="dateLabel">開始日時</th>
              <td id="dateValue">—</td>
            </tr>
            <tr>
              <th id="limitLabel">人数制限</th>
              <td id="limitValue">—</td>
            </tr>
            <tr>
              <th id="urlLabel">ツアーURL</th>
              <td id="urlValue">—</td>
            </tr>
            <tr>
              <th id="eventTypeLabel">種別</th>
              <td id="eventTypeValue">—</td>
            </tr>
            <tr>
              <th id="priceLabel">料金</th>
              <td id="priceValue">—</td>
            </tr>
          </table>

          <div class="sep"></div>
          <div class="label" id="voicePanelLabel">音声・会話設定</div>
          <div class="row">
            <label>
              <input type="checkbox" id="selfEcho" />
              <span id="selfEchoLabel">自分の声を自分にも流す</span>
            </label>
          </div>
          <div class="row">
            <label>
              <input type="checkbox" id="voiceAutoJoin" />
              <span id="voiceAutoJoinLabel">入室時に自動で音声接続する</span>
            </label>
          </div>
        </div>
      </div>

      <div class="sep"></div>
      <!-- デバッグログは残すが画面には表示しない -->
      <pre id="debug" class="debug"></pre>
    </div>
  </main>
  <footer id="lobbyFooter">
    © DokodemoDoors
  </footer>

  <script src="./lobby.js"></script>
</body>
</html>
