<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待ち合わせロビー</title>
  <style>
    body{margin:0;background:#f6f7fb;color:#111;font:16px system-ui}
    header{background:#111;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
    main{display:grid;place-items:center;padding:24px 16px}
    .card{width:min(1100px,96vw);background:#fff;border:1px solid #ececf0;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.08);padding:20px}
    h1{font-size:20px;margin:4px 0 8px}
    .meta{color:#666;font-size:14px;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:1fr 660px;gap:16px}
    @media(max-width:980px){.grid{grid-template-columns:1fr}}
    .panel{border:1px solid #eee;border-radius:12px;padding:14px;background:#fff}
    .label{color:#666;font-size:12px;font-weight:700;text-transform:uppercase}
    .count{font-variant-numeric:tabular-nums;font-weight:800;font-size:36px;margin:6px 0 4px}
    .status{font-size:13px;color:#666}
    .btn{appearance:none;border:1px solid #111;background:#111;color:#fff;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .btn.ghost{background:#fff;color:#111}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
    .sep{height:1px;background:#eee;margin:16px 0}
    .copy{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font:14px system-ui}
    .chat{display:flex;flex-direction:column;height:520px}
    .chat-log{flex:1;border:1px solid #eee;border-radius:12px;padding:10px;overflow:auto;background:#fafafa}
    .msg{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:85%;word-break:break-word;font-size:14px}
    .msg.me{background:#e6f3ff;margin-left:auto}
    .msg.other{background:#fff;border:1px solid #eee}
    .msg.sys{background:#f3f4f6;border:1px dashed #ddd;color:#555;font-size:12px;text-align:center}
    .chat-input{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .chat-input input{flex:1;min-width:200px;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:14px}
    .members{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto;margin-top:8px}
    .member{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid #eee;border-radius:9999px;background:#fafafa;font-size:14px}
    .badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:9999px;background:#111;color:#fff;font-size:12px;font-weight:700}
  </style>
</head>
<body>
  <header>
    <div>待ち合わせロビー</div>
    <div style="display:flex; gap:8px; align-items:center">
      <button id="setName" class="btn ghost" type="button">ニックネーム</button>
      <a class="btn ghost" href="./index.html">← 戻る</a>
    </div>
  </header>

  <main>
    <div class="card">
      <div>
        <div class="pill" id="limitPill" style="display:none"></div>
        <h1 id="title">（タイトル未設定）</h1>
        <div class="meta" id="meta">開始時刻：—</div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="label">カウントダウン</div>
          <div class="count" id="count">--:--:--</div>
          <div class="status" id="status">開始までお待ちください。</div>

          <div class="row">
            <a id="enter" class="btn" target="_top" rel="noopener">ツアーに行く</a>
          </div>

          <div class="sep"></div>
          <div class="row">
            <button id="copy" class="btn" type="button">この待合室のURLをコピー</button>
          </div>
        </div>

        <div class="panel">
          <div class="label">参加者</div>
          <div id="members" class="members"></div>

          <div class="sep"></div>
          <div class="label">ボイスチャット</div>
          <div class="row">
            <button id="voicePower" class="btn" type="button">音声ON</button>
            <button id="micToggle" class="btn ghost" type="button" style="display:none">ミュート</button>
            <button id="sttToggle" class="btn ghost" type="button" style="display:none" title="自動字幕（PC向け）">自動字幕ON</button>
            <button id="sttHold" class="btn ghost" type="button" style="display:none" title="長押しで字幕（モバイル）">長押しで字幕</button>
          </div>
          <div id="vu" class="status" style="margin-top:6px">🎙️ マイク入力レベル：□□□□□</div>
          <div id="voiceHint" class="status" style="margin-top:6px">未参加</div>
          <button id="enableSound" class="btn ghost" type="button" style="display:none;margin-top:6px">スマホで音を有効化</button>

          <div class="sep"></div>
          <div class="label">テキストチャット</div>
          <div class="chat">
            <div id="chatLog" class="chat-log" aria-live="polite"></div>
            <div class="chat-input">
              <input id="chatInput" placeholder="メッセージを入力…" maxlength="2000">
              <button id="chatSend" class="btn" type="button">送信</button>
            </div>
          </div>
          <div class="status" id="chatStatus" style="margin-top:8px;color:#0a7f3f">接続していません</div>
        </div>
      </div>

      <div class="sep"></div>
      <pre id="debug" style="font:12px ui-monospace,monospace;color:#555;white-space:pre-wrap"></pre>
    </div>
  </main>
  <footer style="color:#888;font-size:12px;text-align:center;padding:18px">© DokodemoDoors</footer>

  <script>
  // ===== 基本（カウントダウン等） =====
  const NEGATIVE_LIMIT_MS = 20*60*1000;
  const $=(s)=>document.querySelector(s);
  const p=new URLSearchParams(location.search);
  const title=p.get('title')||'待ち合わせ';
  const start=p.get('start');
  const limit=parseInt(p.get('limit')||'10',10);
  const target=p.get('target')||'';
  const roomId=p.get('roomId')||'';
  const user=localStorage.getItem('nickname')||`Guest-${Math.random().toString(16).slice(2,6)}`;
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  $('#title').textContent=title;
  document.title=title+' | 待ち合わせロビー';
  if(Number.isFinite(limit)&&limit>0){
    const pill=document.createElement('div');
    pill.className='pill';
    pill.textContent=`参加上限 ${limit} 名`;
    pill.style.display='inline-flex';
    $('#limitPill').replaceWith(pill);
  }
  const enterBtn = $('#enter');
  if(/^https?:\/\//i.test(target)) enterBtn.href = target; else enterBtn.style.display = 'none';

  let startDate=null; if(start){ startDate=new Date(start); $('#meta').textContent='開始時刻：'+startDate.toLocaleString(); }
  const pad=n=>String(n).padStart(2,'0');
  function tick(){
    if(!startDate){ $('#count').textContent='--:--:--'; $('#status').innerHTML='<span style="color:#b00020">開始時刻未設定</span>'; requestAnimationFrame(tick); return; }
    const now=new Date(), diff=startDate-now;
    if(diff>0){
      $('#count').textContent=`${pad(Math.floor(diff/3600000))}:${pad(Math.floor(diff/60000)%60)}:${pad(Math.floor(diff/1000)%60)}`;
      $('#status').textContent='開始までお待ちください。';
      requestAnimationFrame(tick); return;
    }
    const expireAt=new Date(startDate.getTime()+NEGATIVE_LIMIT_MS), remainMs=expireAt-now;
    if(remainMs>0){
      $('#count').textContent=`消滅まで後${pad(Math.ceil(remainMs/60000))}分`;
      $('#status').textContent='開始済み：入室できます（20分以内）';
      requestAnimationFrame(tick);
    }else{
      $('#count').textContent='消滅しました';
      $('#status').innerHTML='<span style="color:#b00020">この待ち合わせは終了しました</span>';
    }
  }
  requestAnimationFrame(tick);

  // ===== UI =====
  document.getElementById('setName').onclick=()=>{
    const current=localStorage.getItem('nickname')||user;
    const name=prompt('ニックネームを入力してください：', current);
    if(!name) return;
    localStorage.setItem('nickname', name.trim().slice(0,32));
    alert('保存しました。再読み込みで反映されます。');
  };
  document.getElementById('copy').onclick=async function(){
    try{ await navigator.clipboard.writeText(location.href); this.textContent='コピーしました'; setTimeout(()=>this.textContent='この待合室のURLをコピー',1200); }
    catch{ prompt('手動コピー：', location.href); }
  };

  // ===== WebSocket（チャット/RTC 分離 + 重複除去） =====
  const WS_BASE='wss://do-chat.awachima7.workers.dev';
  const pageParams=new URLSearchParams(location.search); pageParams.set('user', user);
  const CHAT_URL=`${WS_BASE}/ws/${encodeURIComponent(roomId)}?${pageParams.toString()}`;

  const chatLog=$('#chatLog'), chatInput=$('#chatInput'), chatSend=$('#chatSend'), chatStatus=$('#chatStatus');
  const membersEl=$('#members');

  function addMsg(cls, text){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; chatLog.appendChild(d); chatLog.scrollTop=chatLog.scrollHeight; }
  function addSys(t){ addMsg('sys', t); }

  // === 重複検出 ===
  const seen = new Set();      // 表示済みキー
  const seenOrder = [];        // FIFO ローテーション用
  const SEEN_LIMIT = 1000;     // 直近1000件で十分
  function msgKey(x){
    if (typeof x === 'string') return 's|' + x;
    if (x && typeof x === 'object'){
      // RTC はキー化しない（表示しない）
      if (typeof x.text === 'string' && x.text.startsWith('RTC:')) return null;
      const n = typeof x.name === 'string' ? x.name : '';
      const t = typeof x.text === 'string' ? x.text : JSON.stringify(x);
      return 'o|' + n + '|' + t;
    }
    return String(x);
  }
  function pushIfNew(x){
    // 1) RTC: は表示せずシグナリングへ
    if (typeof x === 'string' && x.startsWith('RTC:')){
      try{ const p = JSON.parse(x.slice(4)); if (p && p.rtc) onRtcSignal(p); }catch{}; return;
    }
    if (x && typeof x === 'object' && typeof x.text === 'string' && x.text.startsWith('RTC:')){
      try{ const p = JSON.parse(x.text.slice(4)); if (p && p.rtc) onRtcSignal(p); }catch{}; return;
    }

    // 2) キー化して重複排除
    const k = msgKey(x);
    if (k && seen.has(k)) return;
    if (k){ seen.add(k); seenOrder.push(k); if (seenOrder.length > SEEN_LIMIT){ const old = seenOrder.shift(); seen.delete(old); } }

    // 3) 表示
    if (typeof x === 'string'){ addMsg('other', x); return; }
    if (x && typeof x.name === 'string' && typeof x.text === 'string'){
      addMsg(x.name===user?'me':'other', `${x.name}: ${x.text}`); return;
    }
  }

  function renderMembers(list){
    membersEl.innerHTML='';
    (list||[]).forEach((m,i)=>{
      const row=document.createElement('div'); row.className='member';
      row.innerHTML=`<div class="badge">${i+1}</div><div>${m.name}${m.id?` (${m.id.slice(0,6)})`:''}</div>`;
      membersEl.appendChild(row);
    });
    if(!list||!list.length){ const s=document.createElement('div'); s.className='status'; s.textContent='参加者はいません。'; membersEl.appendChild(s); }
  }

  // ===== WebRTC =====
  const wsSendChat = (t)=>{ try{ ws?.readyState===1 && ws.send(t); }catch{} };
  const wsSendRTC  = (o)=>{ try{ ws?.readyState===1 && ws.send('RTC:'+JSON.stringify(o)); }catch{} };

  const iceServers=[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}];
  const pcConfig={iceServers};
  let localStream=null, ws=null, myId=null, rosterMembers=[];
  const peers=new Map(), transceivers=new Map(), audios=new Map();
  const makingOffer=new Map(), ignoreOffer=new Map(), polite=new Map(), candQueue=new Map(), negoLock=new Map();

  let audioCtx=null;
  function getAudioCtx(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }catch{return null;} }
  const enableBtn=document.getElementById('enableSound');
  function anyAudioPlaying(){ let ok=false; audios.forEach(a=>{ if(!a.paused) ok=true; }); return ok; }
  async function tryPlayAll(){ for(const el of audios.values()){ try{ el.muted=false; el.volume=1; await el.play(); }catch{} } }
  async function resumeCtx(){ try{ const c=getAudioCtx(); if(!c) return false; if(c.state!=='running') await c.resume(); return c.state==='running'; }catch{return false;} }
  function maybeShowEnable(){ if(!isMobile) return; enableBtn.style.display=(audioCtx&&audioCtx.state==='running')||anyAudioPlaying()?'none':''; }
  document.addEventListener('click', async()=>{ await resumeCtx(); await tryPlayAll(); maybeShowEnable(); });
  document.addEventListener('touchend', async()=>{ await resumeCtx(); await tryPlayAll(); maybeShowEnable(); });

  // VU
  let vuTimer=null, analyser=null, vuData=null;
  function startVu(){ try{ if(!localStream) return; const c=getAudioCtx(); if(!c) return; const src=c.createMediaStreamSource(localStream);
    analyser=c.createAnalyser(); analyser.fftSize=256; src.connect(analyser); vuData=new Uint8Array(analyser.frequencyBinCount);
    if(vuTimer) cancelAnimationFrame(vuTimer); const el=document.getElementById('vu'); const loop=()=>{ analyser.getByteTimeDomainData(vuData);
      let max=0; for(let i=0;i<vuData.length;i++){ const d=Math.abs(vuData[i]-128)/128; if(d>max) max=d; } const bars=Math.min(5, Math.floor(max*8));
      el.textContent='🎙️ マイク入力レベル：'+'■'.repeat(bars)+'□'.repeat(5-bars); vuTimer=requestAnimationFrame(loop); }; loop(); }catch{} }
  function stopVu(){ if(vuTimer) cancelAnimationFrame(vuTimer); vuTimer=null; analyser=null; vuData=null; const el=document.getElementById('vu'); if(el) el.textContent='🎙️ マイク入力レベル：□□□□□'; }

  const voicePowerBtn=document.getElementById('voicePower');
  const micToggleBtn=document.getElementById('micToggle');
  const voiceHint=document.getElementById('voiceHint');
  function updateVoiceUI(){ const on=!!localStream; voicePowerBtn.textContent=on?'音声OFF':'音声ON'; voicePowerBtn.classList.toggle('ghost', !on);
    micToggleBtn.style.display=on?'':'none'; if(on){ const t=localStream.getAudioTracks()[0]; micToggleBtn.textContent=(t&&t.enabled)?'ミュート':'ミュート解除'; voiceHint.textContent=`音声: 参加中（マイク${t&&t.enabled?'ON':'OFF'}）`; } else { micToggleBtn.textContent='ミュート'; voiceHint.textContent='音声: 未参加'; } }
  function isMicEnabled(){ const t=localStream?.getAudioTracks?.()[0]; return !!(t&&t.enabled); }

  function computePolite(id){ if(!id||!myId) return true; return myId<id; }
  function queueNegotiation(peerId, task){
    const prev=negoLock.get(peerId)||Promise.resolve();
    const next=prev.then(()=>task()).catch(e=>console.warn('[nego]', peerId, e));
    negoLock.set(peerId, next.finally(()=>{ if(negoLock.get(peerId)===next) negoLock.delete(peerId); }));
  }

  function createPeer(peerId){
    const pc=new RTCPeerConnection(pcConfig);
    polite.set(peerId, computePolite(peerId));
    makingOffer.set(peerId,false); ignoreOffer.set(peerId,false); candQueue.set(peerId,[]);
    const trx=pc.addTransceiver('audio',{direction:'sendrecv'}); transceivers.set(peerId,trx);

    pc.ontrack=async(ev)=>{ let el=audios.get(peerId); if(!el){ el=document.createElement('audio'); el.autoplay=true; el.playsInline=true; el.muted=false; el.volume=1; audios.set(peerId,el); document.body.appendChild(el); }
      el.srcObject=ev.streams[0]; try{ await el.play(); }catch{} maybeShowEnable(); };

    pc.onicecandidate=(ev)=>{ if(ev.candidate) wsSendRTC({ rtc:{ to:peerId, type:'candidate', data: ev.candidate }}); };
    pc.oniceconnectionstatechange=()=>{ const st=pc.iceConnectionState; if(st==='failed'||st==='disconnected'){ setTimeout(async()=>{ if(pc.iceConnectionState==='failed'||pc.iceConnectionState==='disconnected'){ queueNegotiation(peerId, async()=>{ const offer=await pc.createOffer({iceRestart:true}); await pc.setLocalDescription(offer); wsSendRTC({ rtc:{ to:peerId, type:'offer', data: pc.localDescription }}); }); } },1500); } };
    pc.onnegotiationneeded=()=>{ queueNegotiation(peerId, async()=>{ makingOffer.set(peerId,true); try{ const offer=await pc.createOffer(); await pc.setLocalDescription(offer); wsSendRTC({ rtc:{ to:peerId, type:'offer', data: pc.localDescription }}); }finally{ makingOffer.set(peerId,false); } }); };

    peers.set(peerId,pc); return pc;
  }
  async function ensureLocalOnPeer(peerId){ const trx=transceivers.get(peerId); const track=localStream?.getAudioTracks?.()[0]||null; try{ await trx?.sender.replaceTrack(track); }catch{} }
  async function callPeer(peerId){ const pc=createPeer(peerId); await ensureLocalOnPeer(peerId); queueNegotiation(peerId, async()=>{ const offer=await pc.createOffer(); await pc.setLocalDescription(offer); wsSendRTC({ rtc:{ to:peerId, type:'offer', data: pc.localDescription }}); }); }
  function startCalls(list){ (list||[]).filter(m=>m.id&&m.id!==myId).forEach(m=>{ if(!peers.has(m.id)) callPeer(m.id); }); }
  function cleanupPeer(peerId){ const pc=peers.get(peerId); if(pc){ try{ pc.close(); }catch{}; peers.delete(peerId); } const el=audios.get(peerId); if(el){ try{ el.srcObject=null; el.remove(); }catch{}; audios.delete(peerId); } transceivers.delete(peerId); makingOffer.delete(peerId); ignoreOffer.delete(peerId); polite.delete(peerId); candQueue.delete(peerId); negoLock.delete(peerId); }

  async function onRtcSignal(msg){
    const {from:peerId, type, data}=msg.rtc; if(!peerId||peerId===myId) return;
    let pc=peers.get(peerId); if(!pc) pc=createPeer(peerId);

    if(type==='candidate'){ if(pc.remoteDescription){ try{ await pc.addIceCandidate(new RTCIceCandidate(data)); }catch{} } else { candQueue.get(peerId).push(data); } return; }

    if(type==='offer'){
      const iAmPolite=!!polite.get(peerId); const offerCollision=(makingOffer.get(peerId)||pc.signalingState!=='stable');
      if(!iAmPolite && offerCollision){ ignoreOffer.set(peerId,true); return; }
      ignoreOffer.set(peerId,false);
      queueNegotiation(peerId, async()=>{
        if(offerCollision){ await Promise.all([ pc.setLocalDescription({type:'rollback'}), pc.setRemoteDescription(new RTCSessionDescription(data)) ]); }
        else{ await pc.setRemoteDescription(new RTCSessionDescription(data)); }
        const q=candQueue.get(peerId)||[]; while(q.length){ const c=q.shift(); try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch{} }
        const answer=await pc.createAnswer(); await pc.setLocalDescription(answer); wsSendRTC({ rtc:{ to:peerId, type:'answer', data: pc.localDescription }});
      });
      return;
    }

    if(type==='answer'){
      if(ignoreOffer.get(peerId)) return;
      try{ await pc.setRemoteDescription(new RTCSessionDescription(data)); }catch{}
      const q=candQueue.get(peerId)||[]; while(q.length){ const c=q.shift(); try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch{} }
    }
  }

  // ===== 参加/ミュート & STT =====
  const sttBtn=document.getElementById('sttToggle'), sttHold=document.getElementById('sttHold');
  let sttOn=false, sttPreMuteOn=false, recog=null;

  function updateSttUI(){
    const SR=!!(window.SpeechRecognition||window.webkitSpeechRecognition), voice=!!localStream;
    if(!SR){ sttBtn.style.display='none'; sttHold.style.display='none'; return; }
    const showDesktop = !isMobile && voice, showMobile = isMobile && voice;
    sttBtn.style.display = showDesktop ? '' : 'none';
    sttHold.style.display= showMobile  ? '' : 'none';
    sttBtn.textContent=sttOn?'自動字幕OFF':'自動字幕ON';
    sttBtn.classList.toggle('ghost', !sttOn);
    const micOk=isMicEnabled(); sttBtn.disabled=!micOk; sttHold.disabled=!micOk;
  }
  function setRemoteMuted(m){ document.querySelectorAll('audio').forEach(el=>{ try{ el.muted=m; el.volume=m?0:1; }catch{} }); }
  function stopStt(){ try{ recog&&recog.stop(); }catch{} recog=null; sttOn=false; setRemoteMuted(false); updateSttUI(); }
  function startStt({continuous}){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ alert('未対応ブラウザ'); return; }
    if(!localStream){ alert('先に「音声ON」にしてください'); return; } if(!isMicEnabled()){ alert('マイクがミュートです'); return; }
    recog=new SR(); recog.lang='ja-JP'; recog.interimResults=true; recog.continuous=!!continuous;
    recog.onresult=(e)=>{ if(!isMicEnabled()) return; let txt=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) txt+=r[0].transcript; } if(txt.trim()) wsSendChat(`（自動字幕）${txt.trim()}`); };
    recog.onend = ()=>{ if(sttOn && !isMobile && isMicEnabled()){ try{ recog.start(); }catch{} } };
    recog.onerror=()=> stopStt();
    try{ recog.start(); }catch(e){ alert('自動字幕の起動に失敗しました'); return; }
    sttOn=true; setRemoteMuted(true); updateSttUI(); }
  sttBtn.onclick=()=>{ if(!sttOn) startStt({continuous:true}); else stopStt(); };
  ['mousedown','touchstart'].forEach(ev=> sttHold.addEventListener(ev, e=>{ e.preventDefault(); if(!sttOn) startStt({continuous:false}); }));
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=> sttHold.addEventListener(ev, e=>{ e.preventDefault(); if(sttOn) stopStt(); }));

  const voicePowerBtnEl=document.getElementById('voicePower');
  voicePowerBtnEl.onclick=async()=>{
    if(!localStream){
      try{
        localStream=await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
        for(const id of peers.keys()) await ensureLocalOnPeer(id);
        startCalls(rosterMembers);
        updateVoiceUI(); updateSttUI(); await resumeCtx(); await tryPlayAll(); startVu();
      }catch(e){ alert('マイク権限を許可してください'); console.error(e); }
    }else{
      for(const id of peers.keys()){ try{ await transceivers.get(id)?.sender.replaceTrack(null); }catch{} }
      localStream.getTracks().forEach(t=>t.stop()); localStream=null;
      stopStt(); sttPreMuteOn=false; stopVu(); updateVoiceUI(); updateSttUI();
    }
    maybeShowEnable();
  };
  micToggleBtn.onclick=()=>{ if(!localStream) return; const t=localStream.getAudioTracks()[0]; if(!t) return;
    t.enabled=!t.enabled; if(!t.enabled){ sttPreMuteOn=sttOn; if(sttOn) stopStt(); } else { if(sttPreMuteOn) startStt({continuous:!isMobile}); sttPreMuteOn=false; }
    updateVoiceUI(); updateSttUI(); };

  // ===== WebSocket 接続 =====
  let historyLoaded = false;  // ★ 履歴は一度だけ
  function connect(){
    try{
      ws=new WebSocket(CHAT_URL);
      ws.onopen = ()=>{ chatStatus.textContent='接続しました'; };
      ws.onclose= ()=>{ chatStatus.textContent='切断されました。再接続を試みます…'; setTimeout(connect,1500); };
      ws.onerror= ()=>{ chatStatus.textContent='エラーが発生しました'; };
      ws.onmessage=(ev)=>{
        // 1) 先に "RTC:" 文字列
        if(typeof ev.data==='string' && ev.data.startsWith('RTC:')){ try{ const d=JSON.parse(ev.data.slice(4)); if(d&&d.rtc) onRtcSignal(d); }catch{} return; }

        try{
          const data=JSON.parse(ev.data);

          // 2) JSONで来るRTC
          if(data && data.rtc){ onRtcSignal(data); return; }

          // 3) システム（履歴/名簿等）
          if(data && data.sys){
            if(data.type==='welcome'){ myId=data.id; }
            else if(data.type==='history' && Array.isArray(data.messages)){
              if (!historyLoaded){
                data.messages.forEach(line=>{
                  if(typeof line==='string'){ pushIfNew(line); }
                  else if(line && typeof line==='object'){ pushIfNew(line); }
                });
                historyLoaded = true;
                addSys('— 過去のメッセージを読み込みました —');
              }
            }else if(data.type==='roster'){
              rosterMembers = Array.isArray(data.members)?data.members:[];
              renderMembers(rosterMembers);
              rosterMembers.forEach(m=>{ if(m.id&&m.id!==myId) polite.set(m.id, computePolite(m.id)); });
              startCalls(rosterMembers);
            }else if(data.type==='join'){
              addSys(`${data.name} が参加しました（合計 ${data.count} 名）`);
            }else if(data.type==='leave'){
              addSys(`${data.name} が退出しました（合計 ${data.count} 名）`);
              if(data.id) cleanupPeer(data.id);
            }
            return;
          }

          // 4) 通常メッセージ
          pushIfNew(data);
        }catch{
          // 5) 純テキスト
          if(typeof ev.data==='string') pushIfNew(ev.data);
        }
      };
    }catch(e){ chatStatus.textContent='接続に失敗しました'; console.error(e); }
  }
  connect();

  chatSend.onclick=()=>{ const t=(chatInput.value||'').trim(); if(!t||!ws||ws.readyState!==1) return; wsSendChat(t); chatInput.value=''; };
  chatInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); chatSend.click(); } });

  // ===== デバッグ =====
  function updateDebug(){ $('#debug').textContent=JSON.stringify({title,start,limit,target,roomId,user,peers:[...peers.keys()],local:!!localStream},null,2); }
  setInterval(updateDebug,1000);
  </script>
</body>
