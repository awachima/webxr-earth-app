<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待ち合わせロビー</title>
  <link rel="stylesheet" href="./lobby.css" />
</head>
<body>
  <header>
    <div id="lobbyHeaderTitle">待ち合わせロビー</div>
    <div style="display:flex; gap:8px; align-items:center">
      <button id="setName" class="btn ghost" type="button">名前を設定</button>
      <button id="copy" class="btn ghost" type="button">この待合室のURLをコピー</button>
    </div>
  </header>

  <main>
    <section class="lobby-main">
      <div class="lobby-info">
        <h1 id="title">待ち合わせ</h1>
        <div id="meta">開始時刻：--</div>
        <div id="limitPill" class="pill" style="display:none">参加上限 -- 名</div>
      </div>

      <div class="status-panel">
        <div class="status-time">
          <div id="count">--:--:--</div>
          <div id="status">開始までお待ちください。</div>
        </div>
        <div class="status-actions">
          <button id="enter" class="btn primary" type="button">動画の視聴ページへ進む</button>
          <div class="status-note" id="statusNote">
            ※ボタンを押すと Dokodemo Doors のツアー／ワールドページに移動します。
          </div>
        </div>
      </div>

      <section class="chat-section">
        <h2 id="chatTitle">チャット</h2>
        <div class="chat-layout">
          <div class="chat-messages" id="messages"></div>

          <div class="chat-controls">
            <div class="chat-input-row">
              <input id="messageInput" class="chat-input" type="text" placeholder="メッセージを入力..." autocomplete="off" />
              <button id="sendBtn" class="btn" type="button">送信</button>
            </div>
            <div class="chat-bot-toggle">
              <label>
                <input id="botToggle" type="checkbox" checked />
                ロボの返信を有効にする
              </label>
            </div>
          </div>
        </div>
      </section>

      <section class="debug-section">
        <details>
          <summary>デバッグ情報</summary>
          <pre id="debug"></pre>
        </details>
      </section>
    </section>
  </main>

  <footer>
    <small id="footerNote">
      この待ち合わせロビーはファンサイトによる非公式機能です。Dokodemo Doors 本体の動作を保証するものではありません。
    </small>
  </footer>

  <script src="./lobby.js"></script>
</body>
</html>
