<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待ち合わせロビー</title>
  <style>
    body{margin:0;background:#f6f7fb;color:#111;font:16px system-ui}
    header{background:#111;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
    main{display:grid;place-items:center;padding:24px 16px}
    .card{width:min(1100px,96vw);background:#fff;border:1px solid #ececf0;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.08);padding:20px}
    h1{font-size:20px;margin:4px 0 8px}
    .meta{color:#666;font-size:14px;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:1fr 660px;gap:16px}
    @media(max-width:980px){.grid{grid-template-columns:1fr}}
    .panel{border:1px solid #eee;border-radius:12px;padding:14px;background:#fff}
    .label{color:#666;font-size:12px;font-weight:700;text-transform:uppercase}
    .count{font-variant-numeric:tabular-nums;font-weight:800;font-size:36px;margin:6px 0 4px}
    .status{font-size:13px;color:#666}
    .btn{appearance:none;border:1px solid #111;background:#111;color:#fff;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .btn.ghost{background:#fff;color:#111}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
    .sep{height:1px;background:#eee;margin:16px 0}
    .copy{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #ddd;border-radius:10px;font:14px system-ui}

    /* chat */
    .chat{display:flex;flex-direction:column;height:520px}
    .chat-log{flex:1;border:1px solid #eee;border-radius:12px;padding:10px;overflow:auto;background:#fafafa}
    .msg{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:85%;word-break:break-word;font-size:14px}
    .msg.me{background:#e6f3ff;margin-left:auto}
    .msg.other{background:#fff;border:1px solid #eee}
    .msg.sys{background:#f3f4f6;border:1px dashed #ddd;color:#555;font-size:12px;text-align:center}
    .chat-input{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .chat-input input{flex:1;min-width:200px;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:14px}

    /* members */
    .members{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto;margin-top:8px}
    .member{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid #eee;border-radius:9999px;background:#fafafa;font-size:14px}
    .badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:9999px;background:#111;color:#fff;font-size:12px;font-weight:700}
  </style>
</head>
<body>
  <header>
    <div>待ち合わせロビー</div>
    <div style="display:flex; gap:8px; align-items:center">
      <button id="setName" class="btn ghost" type="button">ニックネーム</button>
      <a class="btn ghost" href="./index.html">← 戻る</a>
    </div>
  </header>

  <main>
    <div class="card">
      <div>
        <div class="pill" id="limitPill" style="display:none"></div>
        <h1 id="title">（タイトル未設定）</h1>
        <div class="meta" id="meta">開始時刻：—</div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="label">カウントダウン</div>
          <div class="count" id="count">--:--:--</div>
          <div class="status" id="status">開始までお待ちください。</div>

          <div class="row">
            <a id="enter" class="btn" target="_top" rel="noopener">ツアーに行く</a>
          </div>

          <div class="sep"></div>
          <div class="row">
            <button id="copy" class="btn" type="button">この待合室のURLをコピー</button>
          </div>
        </div>

        <div class="panel">
          <div class="label">参加者</div>
          <div id="members" class="members"></div>

          <div class="sep"></div>
          <div class="label">ボイスチャット</div>
          <div class="row">
            <button id="voicePower" class="btn" type="button">音声ON</button>
            <button id="micToggle" class="btn ghost" type="button" style="display:none">ミュート</button>
            <!-- 初期は非表示。音声ONかつ対応ブラウザ時のみ出す -->
            <button id="sttToggle" class="btn ghost" type="button" style="display:none"
              title="自分の発話を自動で文字起こしして送信（PC向け）">自動字幕ON</button>
            <button id="sttHold" class="btn ghost" type="button" style="display:none"
              title="長押しで字幕（モバイル推奨）">長押しで字幕</button>
          </div>

          <!-- VUメーター -->
          <div id="vu" class="status" style="margin-top:6px">🎙️ マイク入力レベル：□□□□□</div>

          <div id="voiceHint" class="status" style="margin-top:6px">未参加</div>
          <button id="enableSound" class="btn ghost" type="button" style="display:none;margin-top:6px">
            スマホで音を有効化
          </button>

          <div class="sep"></div>
          <div class="label">テキストチャット</div>
          <div class="chat">
            <div id="chatLog" class="chat-log" aria-live="polite"></div>
            <div class="chat-input">
              <input id="chatInput" placeholder="メッセージを入力…" maxlength="2000">
              <button id="chatSend" class="btn" type="button">送信</button>
            </div>
          </div>
          <div class="status" id="chatStatus" style="margin-top:8px;color:#0a7f3f">接続していません</div>
        </div>
      </div>

      <div class="sep"></div>
      <pre id="debug" style="font:12px ui-monospace,monospace;color:#555;white-space:pre-wrap"></pre>
    </div>
  </main>
  <footer style="color:#888;font-size:12px;text-align:center;padding:18px">© DokodemoDoors</footer>

  <script>
  // ===== 基本（ロビー情報/自動削除） =====
  const NEGATIVE_LIMIT_MS = 20*60*1000;
  const S='meetups-store', O='meetups-owners';
  const readStore=()=>JSON.parse(localStorage.getItem(S)||'[]');
  const writeStore=(arr)=>localStorage.setItem(S,JSON.stringify(arr));
  const readOwners=()=>JSON.parse(localStorage.getItem(O)||'{}');
  const writeOwners=(map)=>localStorage.setItem(O,JSON.stringify(map));
  function autoDeleteRoom(roomId){
    if(!roomId) return;
    const remain = readStore().filter(x=>x.roomId!==roomId);
    writeStore(remain);
    const owners = readOwners(); delete owners[roomId]; writeOwners(owners);
    console.info('[auto-delete - lobby]', roomId, 'を削除しました');
  }

  const $=(s)=>document.querySelector(s);
  const p=new URLSearchParams(location.search);
  const title=p.get('title')||'待ち合わせ';
  const start=p.get('start');
  const limit=parseInt(p.get('limit')||'10',10);
  const target=p.get('target')||'';
  const roomId=p.get('roomId')||'';
  const user=localStorage.getItem('nickname')||`Guest-${Math.random().toString(16).slice(2,6)}`;
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  $('#title').textContent=title;
  document.title=title+' | 待ち合わせロビー';
  if(Number.isFinite(limit)&&limit>0){
    const pill=document.createElement('div');
    pill.className='pill';
    pill.textContent=`参加上限 ${limit} 名`;
    pill.style.display='inline-flex';
    $('#limitPill').replaceWith(pill);
  }

  const enterBtn = $('#enter');
  const validTarget = /^https?:\/\//i.test(target);
  if (validTarget) { enterBtn.href = target; } else { enterBtn.style.display = 'none'; }

  let startDate=null; if(start){ startDate=new Date(start); $('#meta').textContent='開始時刻：'+startDate.toLocaleString(); }
  const pad=(n)=>String(n).padStart(2,'0');
  function tick(){
    if(!startDate){
      $('#count').textContent='--:--:--';
      $('#status').innerHTML='<span style="color:#b00020">開始時刻未設定</span>';
      requestAnimationFrame(tick); return;
    }
    const now = new Date(); const diff = startDate - now;
    if (diff > 0){
      const h=Math.floor(diff/3600000), m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
      $('#count').textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;
      $('#status').textContent='開始までお待ちください。';
      requestAnimationFrame(tick); return;
    }
    const expireAt = new Date(startDate.getTime() + NEGATIVE_LIMIT_MS);
    const remainMs = expireAt - now;
    if (remainMs > 0){
      const remainMin = Math.ceil(remainMs / 60000);
      $('#count').textContent = `消滅まで後${pad(remainMin)}分`;
      $('#status').textContent='開始済み：入室できます（20分以内）';
      requestAnimationFrame(tick);
    } else {
      autoDeleteRoom(roomId);
      $('#count').textContent = '消滅しました';
      $('#status').innerHTML = '<span style="color:#b00020">この待ち合わせは終了しました</span>';
    }
  }
  requestAnimationFrame(tick);

  // ===== ユーティリティ/UI =====
  $('#copy').onclick=async()=>{
    const url = location.href;
    try{
      await navigator.clipboard.writeText(url);
      $('#copy').textContent = 'コピーしました';
      setTimeout(()=>$('#copy').textContent='この待合室のURLをコピー', 1200);
    }catch(e){
      prompt('手動コピー：', url);
    }
  };

  $('#debug').textContent=JSON.stringify({title,start,limit,target,roomId,user},null,2);

  document.getElementById('setName').onclick = function setNickname(){
    const current = localStorage.getItem('nickname') || user;
    const name = prompt('ニックネームを入力してください：', current);
    if (!name) return;
    localStorage.setItem('nickname', name.trim().slice(0, 32));
    alert('ニックネームを保存しました。ページを再読み込みすると反映されます。');
  };

  // ===== WebSocket（チャット + シグナリング分離） =====
  const WS_BASE = 'wss://do-chat.awachima7.workers.dev';
  const pageParams = new URLSearchParams(location.search);
  pageParams.set('user', user);
  const CHAT_URL = `${WS_BASE}/ws/${encodeURIComponent(roomId)}?${pageParams.toString()}`;

  const chatLog = $('#chatLog');
  const chatInput = $('#chatInput');
  const chatSend = $('#chatSend');
  const chatStatus = $('#chatStatus');

  const membersEl = $('#members');
  function renderMembers(list){
    membersEl.innerHTML = '';
    if (!list || list.length===0){
      const empty = document.createElement('div');
      empty.className = 'status';
      empty.textContent = '参加者はいません。';
      membersEl.appendChild(empty);
      return;
    }
    list.forEach((m, idx)=>{
      const row = document.createElement('div');
      row.className = 'member';
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = String(idx+1);
      const label = document.createElement('div');
      label.textContent = m.name + (m.id ? ` (${m.id.slice(0,6)})` : '');
      row.appendChild(badge);
      row.appendChild(label);
      membersEl.appendChild(row);
    });
  }

  function addMsg(elClass, text){
    const div=document.createElement('div');
    div.className='msg '+elClass;
    div.textContent=text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }
  function addSys(text){
    const div=document.createElement('div');
    div.className='msg sys';
    div.textContent=text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  let ws, focused = true;
  window.addEventListener('focus', ()=> focused=true);
  window.addEventListener('blur', ()=> focused=false);

  let myId = null;
  let rosterMembers = []; // [{name,id}]

  // 送信ヘルパ（重要：RTCは "RTC:" プレフィクス）
  const wsSendChat = (text)=>{ try{ ws?.readyState===1 && ws.send(text); }catch{} };
  const wsSendRTC  = (obj)=>{  try{ ws?.readyState===1 && ws.send('RTC:'+JSON.stringify(obj)); }catch{} };

  // ====== WebRTC（音声） ======
  const iceServers = [{ urls: [
    "stun:stun.l.google.com:19302",
    "stun:stun1.l.google.com:19302"
  ]}];
  const pcConfig = { iceServers };

  let localStream = null;
  const peers = new Map();             // id -> RTCPeerConnection
  const audios = new Map();            // id -> <audio>
  const transceivers = new Map();      // id -> RTCRtpTransceiver (audio)
  // Perfect Negotiation 状態管理
  const makingOffer = new Map();       // id -> boolean
  const ignoreOffer = new Map();       // id -> boolean
  const polite = new Map();            // id -> boolean（ID比較で決定）
  // 受信前Candidateの一時キュー
  const candQueue = new Map();         // id -> RTCIceCandidateInit[]
  // 交渉直列化の簡易キュー
  const negoLock = new Map();          // id -> Promise (最後の交渉タスク)

  // --- AudioContext / 再生ユーティリティ ---
  let audioCtx = null;
  function getAudioCtx(){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }catch(_){ return null; }
  }
  const enableBtn = document.getElementById('enableSound');
  function anyAudioPlaying(){
    let ok = false;
    audios.forEach(el => { if (!el.paused) ok = true; });
    return ok;
  }
  async function tryPlayAllAudios(){
    for (const el of audios.values()){
      try { el.volume = 1; el.muted = false; await el.play(); } catch (e) {}
    }
    document.querySelectorAll('audio').forEach(async (el)=>{
      try { el.volume = 1; el.muted = false; await el.play(); } catch (e) {}
    });
  }
  async function resumeAudioContext(){
    try{
      const ctx = getAudioCtx();
      if (!ctx) return false;
      if (ctx.state !== 'running'){ await ctx.resume(); }
      return ctx.state === 'running';
    }catch(_){ return false; }
  }
  function maybeShowEnableButton(){
    if (!isMobile) return;
    const ctxOk = audioCtx && audioCtx.state === 'running';
    enableBtn.style.display = (ctxOk || anyAudioPlaying()) ? 'none' : '';
  }
  document.addEventListener('click', async()=>{ await resumeAudioContext(); await tryPlayAllAudios(); maybeShowEnableButton(); });
  document.addEventListener('touchend', async()=>{ await resumeAudioContext(); await tryPlayAllAudios(); maybeShowEnableButton(); });

  // --- VUメーター ---
  let vuTimer = null, analyser = null, vuData = null;
  function startVuMeter(){
    try{
      if (!localStream) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      const src = ctx.createMediaStreamSource(localStream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      vuData = new Uint8Array(analyser.frequencyBinCount);
      if (vuTimer) cancelAnimationFrame(vuTimer);
      const vuEl = document.getElementById('vu');
      const loop = ()=>{
        analyser.getByteTimeDomainData(vuData);
        let maxDev = 0;
        for (let i=0;i<vuData.length;i++){
          const d = Math.abs(vuData[i]-128)/128;
          if (d>maxDev) maxDev=d;
        }
        const bars = Math.min(5, Math.floor(maxDev*8));
        vuEl.textContent = '🎙️ マイク入力レベル：' + '■'.repeat(bars) + '□'.repeat(5-bars);
        vuTimer = requestAnimationFrame(loop);
      };
      loop();
    }catch(_){}
  }
  function stopVuMeter(){
    if (vuTimer) cancelAnimationFrame(vuTimer);
    vuTimer = null; analyser=null; vuData=null;
    const vuEl = document.getElementById('vu');
    if (vuEl) vuEl.textContent = '🎙️ マイク入力レベル：□□□□□';
  }

  function setRemoteMuted(muted){
    audios.forEach(el => {
      try { el.muted = muted; el.volume = muted ? 0 : 1; } catch {}
    });
  }

  // --- UI（音声ON/OFF・ミュート） ---
  const voicePowerBtn = document.getElementById('voicePower');
  const micToggleBtn  = document.getElementById('micToggle');
  const voiceHint     = document.getElementById('voiceHint');

  function updateVoiceUI(){
    const on = !!localStream;
    voicePowerBtn.textContent = on ? '音声OFF' : '音声ON';
    voicePowerBtn.classList.toggle('ghost', !on);
    micToggleBtn.style.display = on ? '' : 'none';
    if (on){
      const t = localStream.getAudioTracks()[0];
      micToggleBtn.textContent = (t && t.enabled) ? 'ミュート' : 'ミュート解除';
      voiceHint.textContent = `音声: 参加中（マイク${t && t.enabled ? 'ON' : 'OFF'}）`;
    } else {
      micToggleBtn.textContent = 'ミュート';
      voiceHint.textContent = '音声: 未参加';
    }
  }
  function isMicEnabled(){
    if (!localStream) return false;
    const t = localStream.getAudioTracks()[0];
    return !!(t && t.enabled);
  }

  // --- Perfect Negotiation 補助 ---
  function computePolite(peerId){
    if (!peerId || !myId) return true;
    return myId < peerId; // 小さい方をpolite
  }
  function queueNegotiation(peerId, task){
    const prev = negoLock.get(peerId) || Promise.resolve();
    const next = prev.then(()=>task()).catch(e=>console.warn('[nego]', peerId, e));
    negoLock.set(peerId, next.finally(()=> {
      if (negoLock.get(peerId) === next) negoLock.delete(peerId);
    }));
  }

  function createPeer(peerId){
    const pc = new RTCPeerConnection(pcConfig);
    polite.set(peerId, computePolite(peerId));
    makingOffer.set(peerId, false);
    ignoreOffer.set(peerId, false);
    candQueue.set(peerId, []);

    // 常設 sendrecv の器
    const trx = pc.addTransceiver('audio', { direction: 'sendrecv' });
    transceivers.set(peerId, trx);

    pc.ontrack = async (ev) => {
      let el = audios.get(peerId);
      if (!el) {
        el = document.createElement('audio');
        el.autoplay = true;
        el.playsInline = true;
        el.muted = false;
        el.volume = 1;
        audios.set(peerId, el);
        document.body.appendChild(el);
      }
      el.srcObject = ev.streams[0];
      try { await el.play(); } catch {}
      maybeShowEnableButton();
    };

    pc.onicecandidate = (ev) => {
      if (ev.candidate) wsSendRTC({ rtc: { to: peerId, type: "candidate", data: ev.candidate }});
    };
    pc.oniceconnectionstatechange = async () => {
      const st = pc.iceConnectionState;
      console.info("[ICE]", peerId, st);
      if (st === 'failed' || st === 'disconnected'){
        // 少し待って復帰しなければICE Restart
        setTimeout(async ()=>{
          if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected'){
            queueNegotiation(peerId, async ()=>{
              const offer = await pc.createOffer({ iceRestart: true });
              await pc.setLocalDescription(offer);
              wsSendRTC({ rtc:{ to: peerId, type:'offer', data: pc.localDescription }});
            });
          }
        }, 1500);
      }
    };
    pc.onconnectionstatechange = ()=> console.info("[PC]", peerId, pc.connectionState);

    // negotiationneeded は直列化
    pc.onnegotiationneeded = () => {
      queueNegotiation(peerId, async ()=>{
        try{
          makingOffer.set(peerId, true);
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          wsSendRTC({ rtc:{ to: peerId, type:'offer', data: pc.localDescription }});
        }finally{
          makingOffer.set(peerId, false);
        }
      });
    };

    peers.set(peerId, pc);
    return pc;
  }

  async function ensureLocalOnPeer(peerId){
    const pc = peers.get(peerId);
    if (!pc) return;
    const trx = transceivers.get(peerId);
    if (!trx) return;
    const track = localStream?.getAudioTracks()[0] || null;
    try { await trx.sender.replaceTrack(track); } catch(e){ console.warn('[replaceTrack]', peerId, e); }
  }

  async function callPeer(peerId){
    const pc = createPeer(peerId);
    await ensureLocalOnPeer(peerId);
    // 明示Offer（保険）
    queueNegotiation(peerId, async ()=>{
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      wsSendRTC({ rtc:{ to: peerId, type:"offer", data: pc.localDescription }});
    });
  }

  function startCalls(memberList){
    const others = (memberList||[]).filter(m => m.id && m.id !== myId);
    for (const m of others) if (!peers.has(m.id)) callPeer(m.id);
  }

  function cleanupPeer(peerId){
    const pc = peers.get(peerId);
    if (pc) { try { pc.close(); } catch{}; peers.delete(peerId); }
    const el = audios.get(peerId);
    if (el) { try { el.srcObject=null; el.remove(); } catch{}; audios.delete(peerId); }
    transceivers.delete(peerId);
    makingOffer.delete(peerId); ignoreOffer.delete(peerId); polite.delete(peerId);
    candQueue.delete(peerId); negoLock.delete(peerId);
  }

  // Perfect Negotiation + candidateキュー
  async function onRtcSignal(msg){
    const { from:peerId, type, data } = msg.rtc;
    if (!peerId || peerId === myId) return;
    let pc = peers.get(peerId);
    if (!pc) pc = createPeer(peerId);

    if (!polite.has(peerId)) polite.set(peerId, computePolite(peerId));

    if (type === 'candidate'){
      if (pc.remoteDescription) {
        try { await pc.addIceCandidate(new RTCIceCandidate(data)); } catch(e){ console.warn('[addCandidate]', peerId, e); }
      } else {
        candQueue.get(peerId)?.push(data);
      }
      return;
    }

    if (type === 'offer'){
      const iAmPolite = !!polite.get(peerId);
      const offerCollision = (makingOffer.get(peerId) || pc.signalingState !== 'stable');
      if (!iAmPolite && offerCollision){
        ignoreOffer.set(peerId, true);
        console.info('[PN] ignore remote offer (impolite/collision)', peerId);
        return;
      }
      ignoreOffer.set(peerId, false);

      queueNegotiation(peerId, async ()=>{
        if (offerCollision){
          await Promise.all([
            pc.setLocalDescription({type:'rollback'}),
            pc.setRemoteDescription(new RTCSessionDescription(data))
          ]);
        }else{
          await pc.setRemoteDescription(new RTCSessionDescription(data));
        }

        // 溜めていたcandidateを適用
        const q = candQueue.get(peerId) || [];
        while(q.length){
          const c = q.shift();
          try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){ console.warn('[flushCandidate]', peerId, e); }
        }

        // Answer
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        wsSendRTC({ rtc:{ to: peerId, type:'answer', data: pc.localDescription }});
      });
      return;
    }

    if (type === 'answer'){
      if (ignoreOffer.get(peerId)) { console.info('[PN] ignored answer because we ignored offer', peerId); return; }
      try{ await pc.setRemoteDescription(new RTCSessionDescription(data)); }catch(e){ console.warn('[setRD answer]', peerId, e); }
      // 溜めていたcandidateを適用
      const q = candQueue.get(peerId) || [];
      while(q.length){
        const c = q.shift();
        try{ await pc.addIceCandidate(new RTCIceCandidate(c)); }catch(e){ console.warn('[flushCandidate]', peerId, e); } }
      return;
    }
  }

  // 参加・ミュートUI
  let sttPreMuteOn = false;

  voicePowerBtn.onclick = async ()=>{
    if (!localStream){
      // ON（参加）
      try{
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        // 既存peerへ送信トラックを反映
        for (const peerId of peers.keys()) await ensureLocalOnPeer(peerId);
        startCalls(rosterMembers);
        updateVoiceUI();
        updateSttUI();
        await tryPlayAllAudios();
        await resumeAudioContext();
        startVuMeter();
      }catch(e){
        alert('マイク権限を許可してください'); console.error(e);
      }
    } else {
      // OFF（退出）
      for (const [peerId, pc] of peers.entries()){
        try{ await transceivers.get(peerId)?.sender.replaceTrack(null); }catch{}
        cleanupPeer(peerId);
      }
      if (localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
      stopStt();
      sttPreMuteOn=false;
      stopVuMeter();
      updateVoiceUI();
      updateSttUI();
    }
    maybeShowEnableButton();
  };

  micToggleBtn.onclick = ()=>{
    if (!localStream) return;
    const t = localStream.getAudioTracks()[0];
    if (!t) return;

    t.enabled = !t.enabled;
    updateVoiceUI();

    if (!t.enabled){
      sttPreMuteOn = sttOn;
      if (sttOn) stopStt();
    }else{
      if (sttPreMuteOn){ startStt({ continuous: !isMobile }); }
      sttPreMuteOn = false;
    }
    updateSttUI();
  };

  // ====== STT（自動字幕） ======
  const sttBtn  = document.getElementById('sttToggle'); // PC向けトグル
  const sttHold = document.getElementById('sttHold');   // モバイル向け長押し
  let sttOn = false;
  let recog = null;

  function sttSupportedDesktop(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition) && !isMobile; }
  function sttSupportedMobile(){  return !!(window.SpeechRecognition || window.webkitSpeechRecognition) &&  isMobile; }

  function updateSttUI(){
    const SRAvail = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    const voiceOn = !!localStream;

    if (!SRAvail){
      sttBtn.style.display  = 'none';
      sttHold.style.display = 'none';
      let warn = document.getElementById('sttWarn');
      if (!warn){
        warn = document.createElement('div');
        warn.id = 'sttWarn';
        warn.className = 'status';
        warn.style.color = '#b00020';
        warn.style.marginTop = '6px';
        warn.textContent = 'この端末・ブラウザでは自動字幕（音声認識）は利用できません。';
        const hintAfter = document.getElementById('voiceHint');
        hintAfter.insertAdjacentElement('afterend', warn);
      }
      return;
    }else{
      const warn = document.getElementById('sttWarn');
      if (warn) warn.remove();
    }

    const showDesktop = sttSupportedDesktop() && voiceOn;
    const showMobile  = sttSupportedMobile()  && voiceOn;

    sttBtn.style.display  = showDesktop ? '' : 'none';
    sttHold.style.display = showMobile  ? '' : 'none';

    sttBtn.textContent = sttOn?'自動字幕OFF':'自動字幕ON';
    sttBtn.classList.toggle('ghost', !sttOn);

    const micOk = isMicEnabled();
    sttBtn.disabled  = !micOk;
    sttHold.disabled = !micOk;
    sttBtn.title  = micOk ? '自分の発話を自動で文字起こしして送信（PC向け）' : 'マイクがミュート中は自動字幕を使用できません';
    sttHold.title = micOk ? '長押しで字幕（モバイル推奨）' : 'マイクがミュート中は自動字幕を使用できません';
  }

  function stopStt(){
    try { recog && recog.stop(); } catch {}
    recog = null;
    sttOn = false;
    setRemoteMuted(false);
    updateSttUI();
  }

  function startStt({continuous}){
    const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SRClass){ alert('このブラウザは音声認識に未対応です'); return; }
    if (!localStream){ alert('先に「音声ON」にしてください'); return; }
    if (!isMicEnabled()){
      alert('マイクがミュートです。ミュート解除後に自動字幕を開始してください。');
      updateSttUI();
      return;
    }

    recog = new SRClass();
    recog.lang = 'ja-JP';
    recog.interimResults = true;
    recog.continuous = !!continuous;

    recog.onresult = (e) => {
      if (!isMicEnabled()) return;
      let finalText = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) finalText += res[0].transcript;
      }
      if (finalText.trim() && ws && ws.readyState===1) {
        wsSendChat(`（自動字幕）${finalText.trim()}`);
      }
    };
    recog.onend = () => {
      if (sttOn && !isMobile && isMicEnabled()) {
        try { recog.start(); } catch {}
      }
    };
    recog.onerror = (ev) => {
      console.warn('[STT]', ev.error);
      stopStt();
    };

    try { recog.start(); } catch (e) {
      console.error(e); alert('自動字幕の起動に失敗しました'); return;
    }
    sttOn = true;
    setRemoteMuted(true);
    updateSttUI();
  }

  sttBtn.onclick = () => { if (!sttOn) startStt({ continuous: true }); else stopStt(); };
  ['mousedown','touchstart'].forEach(ev =>
    sttHold.addEventListener(ev, (e)=>{ e.preventDefault(); if (!sttOn) startStt({ continuous:false }); })
  );
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev =>
    sttHold.addEventListener(ev, (e)=>{ e.preventDefault(); if (sttOn) stopStt(); })
  );

  // ===== WebSocket 接続 =====
  function connect(){
    try{
      ws = new WebSocket(CHAT_URL);
      ws.onopen = ()=>{ chatStatus.textContent='接続しました'; };
      ws.onclose = ()=>{ chatStatus.textContent='切断されました。再接続を試みます…'; setTimeout(connect, 1500); };
      ws.onerror = ()=>{ chatStatus.textContent='エラーが発生しました'; };
      ws.onmessage = (ev)=>{
        // 1) "RTC:" 文字列はシグナリングへ
        if (typeof ev.data === 'string' && ev.data.startsWith('RTC:')){
          try{ const data = JSON.parse(ev.data.slice(4)); if (data && data.rtc) onRtcSignal(data); }catch{}
          return;
        }
        try{
          const data = JSON.parse(ev.data);

          // 2) WebRTC シグナリング（JSONの場合も一応対応）
          if (data.rtc) { onRtcSignal(data); return; }

          // 3) システム
          if (data.sys){
            if (data.type === 'welcome'){ myId = data.id; }
            else if (data.type === 'history' && Array.isArray(data.messages)){
              data.messages.forEach((line)=>{
                try{
                  if (typeof line === 'string' && line.startsWith('RTC:')) return; // RTC履歴はスキップ
                  const obj = JSON.parse(line);
                  if (typeof obj === 'string' && obj.startsWith('RTC:')) return;
                  const klass = (obj.name===user)?'me':'other';
                  addMsg(klass, `${obj.name}: ${obj.text}`);
                }catch{
                  // 純テキスト履歴
                  if (typeof line==='string' && !line.startsWith('RTC:')) addMsg('other', line);
                }
              });
              addSys('— 過去のメッセージを読み込みました —');
            } else if (data.type === 'roster'){
              rosterMembers = Array.isArray(data.members) ? data.members : [];
              renderMembers(rosterMembers);
              rosterMembers.forEach(m => { if (m.id && m.id !== myId) polite.set(m.id, computePolite(m.id)); });
              startCalls(rosterMembers);
            } else if (data.type === 'join'){
              addSys(`${data.name} が参加しました（合計 ${data.count} 名）`);
            } else if (data.type === 'leave'){
              addSys(`${data.name} が退出しました（合計 ${data.count} 名）`);
              if (data.id) cleanupPeer(data.id);
            }
            return;
          }

          // 4) テキスト
          const obj = data;
          const klass = (obj.name===user)?'me':'other';
          addMsg(klass, `${obj.name}: ${obj.text}`);
        }catch{
          // 5) 純テキスト（RTC:以外）はチャットとして表示
          if (typeof ev.data === 'string' && !ev.data.startsWith('RTC:')) addMsg('other', ev.data);
        }
      };
    }catch(e){
      chatStatus.textContent='接続に失敗しました';
      console.error(e);
    }
  }
  connect();

  chatSend.onclick = ()=>{
    const t = (chatInput.value||'').trim();
    if(!t || !ws || ws.readyState!==1) return;
    wsSendChat(t);
    chatInput.value='';
  };
  chatInput.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); chatSend.click(); }
  });

  // ===== 最後の初期化 =====
  window.addEventListener('beforeunload', ()=>{ try{ stopStt(); }catch{} });
  updateVoiceUI();
  updateSttUI();
  </script>
</body>
</html>
