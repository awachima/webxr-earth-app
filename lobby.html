<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待ち合わせロビー</title>
  <link rel="stylesheet" href="./lobby.css" />
</head>
<body>
  <header>
    <div id="lobbyHeaderTitle">待ち合わせロビー</div>
    <div style="display:flex; gap:8px; align-items:center">
      <button id="setName" class="btn ghost" type="button">ニックネーム</button>
      <a id="backToIndex" class="btn ghost" href="./index.html">← 戻る</a>
    </div>
  </header>

  <main>
    <div class="card">
      <div>
        <div class="pill" id="limitPill" style="display:none"></div>
        <h1 id="title">（タイトル未設定）</h1>
        <div class="meta" id="meta">開始時刻：—</div>
      </div>

      <div class="grid">
        <div class="panel">
          <div class="label" id="countdownLabel">カウントダウン</div>
          <div class="count" id="count">--:--:--</div>
          <div class="status" id="status">開始までお待ちください。</div>
          <div class="row">
            <a id="enter" class="btn" target="_top" rel="noopener">ツアーに行く</a>
          </div>
          <div class="sep"></div>
          <div class="row">
            <button id="copy" class="btn" type="button">この待合室のURLをコピー</button>
          </div>
        </div>

        <div class="panel">
          <div class="label" id="voiceSectionTitle">ボイスチャット</div>
          <div id="members" class="members"></div>

          <div class="sep"></div>
          <div class="label" id="voiceControlLabel">ボイスチャット</div>
          <div class="row">
            <button id="voicePower" class="btn" type="button">音声ON</button>
            <button id="micToggle" class="btn ghost" type="button" style="display:none">ミュート</button>
          </div>
          <!-- ★ 追加: 音声ON/OFFの注意書き（アイコン付き・ボタンのすぐ下） -->
          <div class="notice-small">🔊 音声はON/OFFで改善することがあります。</div>

          <div id="voiceHint" class="status" style="margin-top:6px">音声: 未参加</div>
          <button id="enableSound" class="btn ghost" type="button" style="display:none;margin-top:6px">スマホで音を有効化</button>

          <div class="sep"></div>
          <div class="label" id="textChatLabel">テキストチャット</div>
          <div class="chat">
            <div id="chatLog" class="chat-log" aria-live="polite"></div>
            <div class="chat-input">
              <input id="chatInput" placeholder="メッセージを入力…" maxlength="2000">
              <button id="chatSend" class="btn" type="button">送信</button>
            </div>
            <!-- ★ 執事に質問（音声）ボタンとステータス表示 -->
            <div class="chat-voice-ask" style="margin-top:8px;">
              <button id="voiceAskBtn" class="btn ghost" type="button">
                執事に質問（音声）
              </button>
              <div id="voiceAskStatus" class="status" style="margin-top:4px;"></div>
              <!-- ★ 追加: 執事向け注意書き（アイコン付き・ステータスのすぐ下） -->
              <div class="notice-small">🤵 ゆっくり・はっきり話すと認識が安定します。</div>
            </div>
          </div>
          <div class="status" id="chatStatus" style="margin-top:8px;color:#0a7f3f">接続していません</div>
        </div>
      </div>

      <div class="sep"></div>
      <!-- デバッグログは残すが画面には表示しない -->
      <pre id="debug" class="debug"></pre>
    </div>
  </main>
  <footer id="lobbyFooter">
    © DokodemoDoors
  </footer>

  <script src="./lobby.js"></script>
</body>
</html>
