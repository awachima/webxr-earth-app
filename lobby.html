<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待ち合わせロビー</title>
  <style>
    body{margin:0;background:#f6f7fb;color:#111;font:16px system-ui}
    header{background:#111;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
    main{display:grid;place-items:center;padding:24px 16px}
    .card{width:min(1100px,96vw);background:#fff;border:1px solid #e9e9ef;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.08);padding:20px}
    h1{font-size:20px;margin:4px 0 8px}
    .meta{color:#666;font-size:14px;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:1fr 660px;gap:16px}
    @media(max-width:980px){.grid{grid-template-columns:1fr}}
    .panel{border:1px solid #eee;border-radius:12px;padding:14px;background:#fff}
    .label{color:#666;font-size:12px;font-weight:700;text-transform:uppercase}
    .count{font-variant-numeric:tabular-nums;font-weight:700}
    .pill{display:none;background:#111;color:#fff;font-size:12px;padding:4px 8px;border-radius:999px;margin-left:8px}
    .controls{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer}
    .btn.ghost{background:#f3f4f8;color:#333}
    .btn.primary{background:#111;color:#fff;border-color:#111}
    .row{display:flex;gap:8px;align-items:center}
    .muted{color:#666;font-size:12px}
    .chat{height:360px;overflow:auto;border:1px solid #eee;border-radius:12px;padding:10px;background:#fcfcff}
    .msg{margin:0 0 8px}
    .me{color:#111}
    .sys{color:#888;font-style:italic}
    .debug{white-space:pre-wrap;font-size:11px;color:#666;background:#fafafa;border:1px dashed #ccc;border-radius:8px;padding:8px;height:120px;overflow:auto}
    .pillwarn{color:#b00;font-weight:700}
    .spacer{flex:1}
  </style>
</head>
<body>
  <header>
    <div class="row">
      <strong id="title">待ち合わせロビー</strong>
      <span id="limitPill" class="pill"></span>
    </div>
    <div class="row">
      <button id="enter" class="btn primary">入室（新しいタブで開く）</button>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="grid">
        <section class="panel">
          <div class="label">情報</div>
          <div class="meta" id="meta">開始前です。</div>

          <div class="controls" style="margin:8px 0 12px">
            <button id="voiceOn"  class="btn">音声ON</button>
            <button id="mute"     class="btn ghost">ミュート</button>
            <button id="sttBtn"   class="btn ghost" title="音声ON時のみ表示">自動字幕ON</button>
            <div id="sttHold" class="row muted" style="display:none">（長押しで一時的に字幕）</div>
            <div class="spacer"></div>
            <span class="muted">参加者：<span id="members">0</span>人</span>
          </div>

          <div class="chat" id="chat"></div>

          <div class="row" style="margin-top:8px">
            <input id="input" class="btn" style="flex:1" placeholder="メッセージ入力…" />
            <button id="send" class="btn">送信</button>
          </div>
        </section>

        <aside class="panel">
          <div class="label">デバッグ</div>
          <div id="debug" class="debug">(ログ)</div>
        </aside>
      </div>
    </div>
  </main>

  <script>
  // 便宜上の util
  const $ = (s)=>document.querySelector(s);
  const addMsg = (who, text)=>{
    const el = document.createElement('div');
    el.className = 'msg ' + (who==='sys'?'sys':'me');
    el.textContent = (who==='sys'?`[通知] `:'') + text;
    $('#chat').appendChild(el);
    $('#chat').scrollTop = $('#chat').scrollHeight;
  };
  const addDebug = (s)=>{
    const el = $('#debug');
    el.textContent += (el.textContent ? '\n' : '') + s;
    el.scrollTop = el.scrollHeight;
  };

  // URLパラメタ
  const params = new URLSearchParams(location.search);
  const title = params.get('title') || '待ち合わせロビー';
  const limit = Number(params.get('limit') || '') || 0;

  // 端末判定
  const fmt = (n)=> String(n).padStart(2,'0');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; // Web Speech API（ローカル）

  $('#title').textContent = title;
  document.title = title + ' | 待ち合わせロビー';
  if (Number.isFinite(limit) && limit > 0) {
    const pill = document.createElement('div');
    pill.className = 'pill';
    pill.textContent = `参加上限 ${limit} 名`;
    pill.style.display = 'inline-flex';
    $('#limitPill').replaceWith(pill);
  }

  const enterBtn = $('#enter');

  // WebSocket 接続
  const roomId = params.get('id') || 'default';
  const ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/${encodeURIComponent(roomId)}`);

  ws.addEventListener('open', ()=> addDebug('[WS] open'));
  ws.addEventListener('close',()=> addDebug('[WS] close'));
  ws.addEventListener('error',()=> addDebug('[WS] error'));

  function wsSend(objOrText){
    try{
      const s = (typeof objOrText === 'string') ? objOrText : JSON.stringify(objOrText);
      ws.send(s);
    }catch(e){ console.warn('[WS:send error]', e); }
  }

  // チャット受信
  ws.onmessage = (ev)=>{
    try{
      const data = JSON.parse(ev.data);

      // 受信: サーバーSTTの文字列（自分宛）
      if (data.sttText && typeof data.sttText.text === 'string'){
        addMsg('me', `（自動字幕）${data.sttText.text}`);
        const dbg = document.getElementById('debug');
        dbg.textContent += `\n[SSTT:recv seq=${data.sttText.seq}] ${data.sttText.text}`;
        return;
      }

      // WebRTC シグナリングなど（必要に応じて既存の分岐をこの下に保持）
      if (data.sys && data.type==='join'){
        $('#members').textContent = String(data.count || 0);
        addMsg('sys', `${data.name || '誰か'}さんが入室しました。`);
        return;
      }
      if (data.sys && data.type==='leave'){
        $('#members').textContent = String(data.count || 0);
        addMsg('sys', `${data.name || '誰か'}さんが退室しました。`);
        return;
      }
      if (data.sys && data.type==='roster'){
        $('#members').textContent = String((data.members||[]).length);
        return;
      }

      // 通常のチャット
      if (data.name && typeof data.text === 'string'){
        addMsg('me', `${data.name}: ${data.text}`);
        return;
      }
    }catch{
      // JSONでない: テキスト扱い
      if (typeof ev.data === 'string' && ev.data.trim()) {
        addMsg('me', ev.data.trim());
      }
    }
  };

  // 入室
  enterBtn.addEventListener('click', ()=>{
    const url = params.get('target') || location.href;
    window.open(url, '_top'); // target=_top（既存仕様を維持）
  });

  // 入力・送信
  $('#send').addEventListener('click', ()=>{
    const v = $('#input').value.trim();
    if (!v) return;
    wsSend(v);
    $('#input').value = '';
  });

  // ───── 音声入力（ローカルSTT ＆ サーバーSTT） ─────
  let localStream = null;
  let rec = null;
  let recSeq = 0;
  const CHUNK_MS = 3200; // Android で安定しやすい既定
  let sttOn = false;

  const sttBtn  = $('#sttBtn');
  const sttHold = $('#sttHold');
  const voiceOn = $('#voiceOn');
  const muteBtn = $('#mute');

  function updateSttUI(){
    const voiceOk = !!localStream;
    sttBtn.style.display = voiceOk ? '' : 'none';
    sttBtn.textContent = sttOn ? '自動字幕OFF' : '自動字幕ON';
    sttBtn.classList.toggle('ghost', !sttOn);
  }

  async function ensureMic(){
    if (localStream) return true;
    try{
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      addDebug('[MIC] granted');
      return true;
    }catch(e){
      addDebug('[MIC] denied');
      return false;
    }
  }

  // ローカルSTT（Web Speech API）開始
  let recog = null;
  function startLocalStt(){
    if (!SR) return false;
    try{
      recog = new SR();
      recog.continuous = true;
      recog.interimResults = true;
      recog.lang = 'ja-JP';
      recog.onresult = (ev)=>{
        for (let i = ev.resultIndex; i < ev.results.length; i++){
          const res = ev.results[i];
          const text = res[0].transcript.trim();
          if (text) {
            addMsg('me', `（自動字幕）${text}`);
          }
        }
      };
      recog.onerror = (e)=> addDebug('[STT:local error] ' + (e?.error || ''));
      recog.onend   = ()=> addDebug('[STT:local end]');
      recog.start();
      addDebug('[STT:local start]');
      return true;
    }catch(e){ addDebug('[STT:local fail]'); return false; }
  }

  // サーバーSTT（MediaRecorder→WS）
  function startServerStt(){
    if (!localStream) return false;
    try{
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus' : 'audio/webm';
      rec = new MediaRecorder(localStream, { mimeType: mime, audioBitsPerSecond: 24000 });
      const recMime = rec.mimeType;

      rec.ondataavailable = async (ev)=>{
        try{
          if (!ev.data || !ev.data.size) return;
          const blob = ev.data;
          const arrbuf = await blob.arrayBuffer();
          const b64 = btoa(String.fromCharCode(...new Uint8Array(arrbuf)));
          const payload = { sttAudio: { seq: ++recSeq, mime: recMime || blob.type || 'audio/webm', data: b64 } };
          wsSend(payload);
          addDebug(`[SSTT:send seq=${recSeq} size=${blob.size}]`);
        }catch(err){ console.warn('[SSTT:error send]', err); }
      };
      rec.onstart = ()=> addDebug('[SSTT:start]');
      rec.onstop  = ()=> addDebug('[SSTT:stop]');
      rec.onerror = (e)=> { addDebug(`[SSTT:recorder error] ${e?.error||''}`); };

      rec.start(CHUNK_MS);
      return true;
    }catch(e){
      addDebug('[SSTT:fail]');
      return false;
    }
  }

  async function startStt(){
    if (sttOn) return;
    const ok = await ensureMic();
    if (!ok) return;

    // 1) まずローカルSTT（対応ブラウザのみ）
    let localOk = false;
    if (SR) {
      localOk = startLocalStt();
    }

    // 2) さらにサーバーSTTも併用（Androidでの安定性向上）
    const svrOk = startServerStt();

    sttOn = (localOk || svrOk);
    updateSttUI();
  }
  function stopStt(){
    sttOn = false;
    try{ if (rec && rec.state!=='inactive') rec.stop(); }catch{}
    try{ if (recog) recog.stop(); }catch{}
    updateSttUI();
  }

  // UI イベント
  voiceOn.addEventListener('click', async ()=>{
    const ok = await ensureMic();
    if (ok) addDebug('[MIC] ready');
    updateSttUI();
  });
  sttBtn.addEventListener('click', ()=>{
    if (!sttOn) startStt();
    else stopStt();
  });
  muteBtn.addEventListener('click', ()=>{
    if (!localStream) return;
    for (const track of localStream.getAudioTracks()){
      track.enabled = !track.enabled;
    }
    muteBtn.textContent = (localStream.getAudioTracks().some(t=>t.enabled)) ? 'ミュート' : 'ミュート解除';
  });

  </script>
</body>
</html>
